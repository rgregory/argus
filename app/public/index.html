<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Argus</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1/dist/css/tabler.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..700,0..100&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5/papaparse.min.js"></script>
<script>
  (function () {
    var t = null; try { t = localStorage.getItem('argus-theme'); } catch (e) {}
    if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-bs-theme', t);
  })();
</script>
<style>
  body { font-feature-settings: "tnum"; }
  .mono { font-family: var(--tblr-font-monospace); font-size: .8125rem; word-break: break-all; }
  /* Tabler's default <pre> text color nearly matches --tblr-bg-surface-secondary in this
     theme, so the evidence block was rendering real text invisibly (confirmed by
     select-all over the "blank" area turning up highlighted text). Pin the color
     explicitly instead of leaving it to inherit. */
  .evidence { white-space: pre-wrap; max-height: 22rem; overflow: auto; font-size: .78rem; background: var(--tblr-bg-surface-secondary); color: var(--tblr-body-color); border-radius: 4px; padding: .5rem .75rem; margin: .5rem 0 0; }
  .finding-row { cursor: pointer; }
  .finding-row:hover { background: var(--tblr-bg-surface-secondary); }
  .chart-box { position: relative; height: 260px; }
  .chart-box.sm { height: 180px; }
  .tab-badge { margin-left: .35rem; }
  .table-wrap { max-height: 32rem; overflow: auto; }
  .nowrap { white-space: nowrap; }
  .kpi { font-size: 1.6rem; font-weight: 600; line-height: 1.1; }
  .clickable { cursor: pointer; }
  [x-cloak] { display: none !important; }
  .navbar-nav .nav-link { padding-left: .6rem; padding-right: .6rem; }
  /* ===================================================================== editorial theme
     Paper and ink, serif small-caps headlines asked as questions, one colour per area. */
  :root, [data-bs-theme=light] {
    --paper: #f3eee3; --paper-2: #faf7f0; --ink: #2a2521; --ink-2: #5d544b; --muted: #8b8073; --rule: #ddd3c1;
    --sev-high: #b3261e; --sev-medium: #d77a1f; --sev-low: #a98c1c; --sev-info: #5f7a94;
    --ok: #6b8f71; --field: rgba(42,37,33,.045);
    --tblr-body-bg: var(--paper); --tblr-bg-surface: var(--paper-2); --tblr-bg-surface-secondary: #f0eadf; --tblr-bg-surface-tertiary: #ebe4d7;
    --tblr-body-color: var(--ink); --tblr-secondary-color: var(--muted); --tblr-border-color: var(--rule); --tblr-border-color-translucent: var(--rule);
    --tblr-card-bg: var(--paper-2);
  }
  [data-bs-theme=dark] {
    --paper: #16151a; --paper-2: #1d1c22; --ink: #ece5d8; --ink-2: #c3b9aa; --muted: #8f8679; --rule: #34312e;
    --sev-high: #ef6a5e; --sev-medium: #f0a04b; --sev-low: #d9bd4f; --sev-info: #8fb0cc; --ok: #8fb596; --field: rgba(236,229,216,.05);
    --tblr-body-bg: var(--paper); --tblr-bg-surface: var(--paper-2); --tblr-bg-surface-secondary: #232229; --tblr-bg-surface-tertiary: #29282f;
    --tblr-body-color: var(--ink); --tblr-secondary-color: var(--muted); --tblr-border-color: var(--rule); --tblr-border-color-translucent: var(--rule);
    --tblr-card-bg: var(--paper-2);
  }
  body { background: var(--paper); color: var(--ink); }
  .card { border: 1px solid var(--rule); box-shadow: none; border-radius: 10px; }
  .card-header { border-bottom-color: var(--rule); }
  .card-title, h3.card-title { font-family: 'Fraunces', Georgia, serif; font-variant: small-caps; letter-spacing: .03em; font-weight: 600; font-size: 1.05rem; }
  .navbar { background: var(--paper) !important; border-bottom: 1px solid var(--rule); }
  .navbar-brand span { font-family: 'Fraunces', Georgia, serif; font-weight: 600; letter-spacing: .02em; }
  .navbar-nav .nav-link { font-family: 'Fraunces', Georgia, serif; font-variant: small-caps; letter-spacing: .04em; font-size: .98rem; color: var(--ink-2); }
  .navbar-nav .nav-item.active .nav-link, .navbar-nav .nav-link:hover { color: var(--ink); }
  .navbar-nav .nav-item.active .nav-link::after { border-color: var(--ink) !important; }
  .table thead th { font-family: 'Fraunces', Georgia, serif; font-variant: small-caps; text-transform: none; letter-spacing: .04em; font-size: .82rem; color: var(--muted); background: transparent; }
  .badge { font-weight: 600; letter-spacing: .02em; }

  .ed { max-width: 1120px; margin: 0 auto; padding: .5rem 0 3rem; }
  .ed-mast { text-align: center; padding: 1.25rem 0 .5rem; }
  .ed-kicker { font-family: 'Fraunces', Georgia, serif; font-variant: small-caps; letter-spacing: .12em; color: var(--muted); font-size: .95rem; }
  .ed-title { font-family: 'Fraunces', Georgia, serif; font-weight: 500; font-variant: small-caps; letter-spacing: .02em; font-size: clamp(2rem, 4.6vw, 3.4rem); line-height: 1.05; margin: .35rem 0 .9rem; font-variation-settings: "opsz" 144, "SOFT" 50; }
  .ed-lede { font-family: 'Source Serif 4', Georgia, serif; font-size: clamp(1.02rem, 1.5vw, 1.2rem); line-height: 1.6; color: var(--ink-2); max-width: 46rem; margin: 0 auto; }
  .ed-lede b, .ed-sub b, .ed-ptext b { font-weight: 700; color: var(--ink); }
  .ed-ornament { display: flex; align-items: center; gap: 1rem; justify-content: center; margin: 1.6rem auto .5rem; max-width: 30rem; color: var(--muted); }
  .ed-ornament span { flex: 1; height: 1px; background: var(--rule); }
  .ed-ornament i { font-size: 1.3rem; }
  .ed-sec { margin-top: 2.6rem; }
  .ed-h { font-family: 'Fraunces', Georgia, serif; font-variant: small-caps; font-weight: 600; letter-spacing: .03em; text-align: center; font-size: clamp(1.35rem, 2.4vw, 1.8rem); margin: 0; }
  .ed-sub { font-family: 'Source Serif 4', Georgia, serif; text-align: center; color: var(--ink-2); max-width: 44rem; margin: .35rem auto 1.4rem; font-size: 1.02rem; line-height: 1.55; }
  .ed-note { text-align: center; color: var(--muted); font-size: .9rem; }
  .ed-chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .ed-chart text { font-family: 'Source Serif 4', Georgia, serif; fill: var(--muted); }
  .ed-chart .lbl { fill: var(--ink-2); font-size: 11px; }
  .ed-chart .axis { stroke: var(--rule); }

  .ed-portraits { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1.4rem 1rem; }
  .ed-portrait { text-align: center; color: inherit; text-decoration: none; padding: .4rem; border-radius: 14px; transition: background .15s; }
  .ed-portrait:hover { background: var(--field); text-decoration: none; color: inherit; }
  .ed-ring { width: 128px; height: 128px; margin: 0 auto .4rem; }
  .ed-pname { font-family: 'Fraunces', Georgia, serif; font-variant: small-caps; font-weight: 700; font-size: 1.2rem; letter-spacing: .03em; line-height: 1.1; }
  .ed-ptext { font-family: 'Source Serif 4', Georgia, serif; font-size: .92rem; line-height: 1.45; color: var(--ink-2); margin: .3rem 0 0; }
  .ed-empty { grid-column: 1 / -1; text-align: center; color: var(--muted); font-family: 'Source Serif 4', Georgia, serif; }

  .ed-two { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; }
  .ed-two .ed-h, .ed-two .ed-sub { text-align: left; margin-left: 0; }
  @media (max-width: 900px) { .ed-two { grid-template-columns: 1fr; gap: 2rem; } }
  .ed-changes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; border-top: 2px solid var(--ink); padding-top: .6rem; }
  @media (max-width: 600px) { .ed-changes { grid-template-columns: 1fr; } }
  .ed-colhead { font-family: 'Fraunces', Georgia, serif; font-variant: small-caps; letter-spacing: .05em; color: var(--muted); margin-bottom: .35rem; }
  .ed-colhead b { color: var(--ink); font-size: 1.25rem; margin-left: .2rem; }
  .ed-change { display: flex; gap: .45rem; align-items: baseline; font-family: 'Source Serif 4', Georgia, serif; font-size: .92rem; line-height: 1.35; color: var(--ink); text-decoration: none; padding: .22rem 0; border-bottom: 1px dotted var(--rule); }
  .ed-change:hover { color: var(--ink); text-decoration: none; background: var(--field); }
  .ed-change.is-resolved span { text-decoration: line-through; color: var(--muted); }
  .ed-dot { display: inline-block; width: .55rem; height: .55rem; border-radius: 50%; flex: none; transform: translateY(-.05rem); }
  .ed-none { color: var(--muted); font-size: .88rem; font-style: italic; font-family: 'Source Serif 4', Georgia, serif; }
  .ed-link { display: inline-block; margin-top: .9rem; font-family: 'Fraunces', Georgia, serif; font-variant: small-caps; letter-spacing: .04em; color: var(--ink); border-bottom: 1px solid var(--ink); text-decoration: none; }
  .ed-link:hover { text-decoration: none; opacity: .75; color: var(--ink); }
  .ed-list { list-style: none; padding: 0; margin: 0; border-top: 2px solid var(--ink); }
  .ed-list li { display: grid; grid-template-columns: 2.4rem 9.5rem 1fr; gap: .6rem; align-items: baseline; padding: .55rem .2rem; border-bottom: 1px solid var(--rule); cursor: pointer; }
  .ed-list li:hover { background: var(--field); }
  .ed-num { font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 1.15rem; font-variant-numeric: lining-nums; }
  .ed-area { font-family: 'Fraunces', Georgia, serif; font-variant: small-caps; letter-spacing: .04em; font-weight: 600; font-size: .9rem; }
  .ed-ftitle { font-family: 'Source Serif 4', Georgia, serif; font-size: .98rem; line-height: 1.35; }
  @media (max-width: 600px) { .ed-list li { grid-template-columns: 2rem 1fr; } .ed-area { grid-column: 2; } .ed-ftitle { grid-column: 2; } }

  .ed-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 6px; }
  .ed-tile { padding: .7rem .8rem; border-radius: 8px; background: var(--field); border-left: 4px solid var(--muted); }
  .ed-tile.is-fail { background: color-mix(in srgb, var(--sev-high) 14%, transparent); border-left-color: var(--sev-high); }
  .ed-tile.is-warn { background: color-mix(in srgb, var(--sev-medium) 14%, transparent); border-left-color: var(--sev-medium); }
  .ed-tile.is-info { background: color-mix(in srgb, var(--sev-info) 12%, transparent); border-left-color: var(--sev-info); }
  .ed-tile.is-pass { background: color-mix(in srgb, var(--ok) 10%, transparent); border-left-color: var(--ok); opacity: .85; }
  .ed-tname { font-family: 'Fraunces', Georgia, serif; font-variant: small-caps; font-weight: 600; letter-spacing: .03em; }
  .ed-tval { font-size: .82rem; color: var(--ink-2); margin-top: .15rem; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .ed-foot { margin-top: 3rem; text-align: center; color: var(--muted); font-family: 'Fraunces', Georgia, serif; font-variant: small-caps; letter-spacing: .06em; font-size: .85rem; border-top: 1px solid var(--rule); padding-top: .9rem; }
  :root, [data-bs-theme=light] { --tblr-primary: #34445e; --tblr-primary-rgb: 52,68,94; --tblr-primary-fg: #faf7f0; }
  [data-bs-theme=dark] { --tblr-primary: #c9b991; --tblr-primary-rgb: 201,185,145; --tblr-primary-fg: #16151a; }
  .btn-primary, .btn-check:checked + .btn { background: var(--tblr-primary) !important; border-color: var(--tblr-primary) !important; color: var(--tblr-primary-fg) !important; }
  .subheader { font-family: 'Fraunces', Georgia, serif; font-variant: small-caps; text-transform: none; letter-spacing: .06em; font-size: .9rem; color: var(--muted); }
  .navbar-brand .ti { color: var(--ink); }
</style>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
</head>
<body>
<div class="page" x-data="argus()" x-init="init()" x-cloak>
  <!-- header -->
  <header class="navbar navbar-expand-md d-print-none">
    <div class="container-xl">
      <div class="navbar-brand pe-3">
        <i class="ti ti-eye text-primary me-2" style="font-size:1.4rem"></i><span>Argus</span>
      </div>
      <div class="d-none d-md-flex align-items-center gap-2 text-secondary small" x-show="r">
        <span class="badge bg-secondary-lt" x-text="r && r.host.name ? r.host.name : 'Mac'"></span>
        <span x-show="r && r.host.os" x-text="r ? 'macOS ' + r.host.os : ''"></span>
        <span>· updated <span x-text="r ? ago(r.generated) : ''"></span></span>
      </div>
      <div class="navbar-nav flex-row order-md-last ms-auto gap-1 align-items-center">
        <button class="btn btn-ghost-secondary btn-icon" title="Refresh now" @click="load(true)"><i class="ti ti-refresh" :class="loading && 'ti-spin'"></i></button>
        <button class="btn btn-ghost-secondary btn-icon" title="Toggle theme" @click="toggleTheme()"><i class="ti" :class="theme === 'dark' ? 'ti-sun' : 'ti-moon'"></i></button>
      </div>
    </div>
  </header>
  <div class="navbar-expand-md border-bottom">
    <div class="navbar navbar-light">
      <div class="container-xl">
        <ul class="navbar-nav flex-row flex-wrap">
          <template x-for="t in tabs" :key="t.id">
            <li class="nav-item" :class="tab === t.id && 'active'">
              <a class="nav-link" href="#" @click.prevent="setTab(t.id)">
                <span class="nav-link-icon d-inline-block"><i class="ti" :class="t.icon"></i></span>
                <span class="nav-link-title" x-text="t.label"></span>
                <span class="badge tab-badge" :class="t.badgeClass ? t.badgeClass() : 'bg-secondary-lt'" x-show="t.badge && t.badge()" x-text="t.badge && t.badge()"></span>
              </a>
            </li>
          </template>
        </ul>
      </div>
    </div>
  </div>

  <div class="page-wrapper">
    <div class="page-body">
      <div class="container-xl">
        <div class="alert alert-danger" x-show="error" x-text="error"></div>
        <div class="text-center py-6 text-secondary" x-show="!r && !error"><div class="spinner-border mb-3"></div><div>Loading report…</div></div>

        <template x-if="r">
        <div>

        <!-- ============================================================ OVERVIEW -->
        <div x-show="tab === 'overview'" class="ed">
          <!-- masthead -->
          <header class="ed-mast">
            <div class="ed-kicker" x-text="'The Argus brief · ' + new Date(r.generated).toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' })"></div>
            <h1 class="ed-title">What has <span x-text="r.host.name || 'this Mac'"></span> been up&nbsp;to?</h1>
            <p class="ed-lede" x-html="lede()"></p>
            <div class="ed-ornament"><span></span><i class="ti ti-eye"></i><span></span></div>
          </header>

          <!-- portraits -->
          <section class="ed-sec">
            <h2 class="ed-h">Where is the attention needed?</h2>
            <p class="ed-sub" x-html="portraitSub()"></p>
            <div class="ed-portraits">
              <template x-for="a in areaStats().slice(0, 6)" :key="a.area">
                <a href="#" class="ed-portrait" @click.prevent="fArea = a.area; fSev = ['high','medium','low','info']; setTab('findings')">
                  <div class="ed-ring" x-html="ringSvg(a)"></div>
                  <div class="ed-pname" :style="'color:' + areaColor(a.area)" x-text="a.area"></div>
                  <p class="ed-ptext" x-html="portraitText(a)"></p>
                </a>
              </template>
              <div class="ed-empty" x-show="!areaStats().length">Nothing open. Every finding is either resolved or acknowledged.</div>
            </div>
          </section>

          <!-- timeline -->
          <section class="ed-sec">
            <h2 class="ed-h">When did things happen?</h2>
            <p class="ed-sub" x-html="timelineSub()"></p>
            <div class="ed-chart" x-html="timelineSvg()"></div>
            <p class="ed-note" x-show="!r.timeline.length">No unified-log events yet. Install the host collector (<code>./argus.sh install-collector</code>) and give it five minutes.</p>
          </section>

          <!-- changes + attention list -->
          <section class="ed-sec ed-two">
            <div>
              <h2 class="ed-h">What changed since yesterday?</h2>
              <p class="ed-sub" x-html="changesSub()"></p>
              <div class="ed-changes">
                <template x-for="col in [['new', 'New'], ['changed', 'Changed'], ['resolved', 'Resolved']]" :key="col[0]">
                  <div>
                    <div class="ed-colhead"><span x-text="col[1]"></span> <b x-text="((r.changes && r.changes[col[0]]) || []).length"></b></div>
                    <template x-for="(c, i) in ((r.changes && r.changes[col[0]]) || []).slice(0, 8)" :key="i">
                      <a href="#" class="ed-change" :class="col[0] === 'resolved' && 'is-resolved'" @click.prevent="col[0] !== 'resolved' && (fQ = '', fArea = c.area, fSev = ['high','medium','low','info'], setTab('findings'), openFinding = c.id)">
                        <i class="ed-dot" :style="'background:' + sevColor(c.sev)"></i><span x-text="c.title"></span>
                      </a>
                    </template>
                    <div class="ed-none" x-show="!((r.changes && r.changes[col[0]]) || []).length">None.</div>
                  </div>
                </template>
              </div>
              <a class="ed-link" href="/api/digest" target="_blank" rel="noopener">Read today's digest →</a>
            </div>
            <div>
              <h2 class="ed-h">What should you look at first?</h2>
              <p class="ed-sub">The open high and medium findings, most severe first. Acknowledge the ones you expect and they leave this list.</p>
              <ol class="ed-list">
                <template x-for="(f, i) in r.findings.filter(x => !x.acked && (x.sev === 'high' || x.sev === 'medium')).slice(0, 10)" :key="f.id">
                  <li @click="fArea = f.area; fSev = ['high','medium','low','info']; setTab('findings'); openFinding = f.id">
                    <span class="ed-num" :style="'color:' + sevColor(f.sev)" x-text="String(i + 1).padStart(2, '0')"></span>
                    <span class="ed-area" :style="'color:' + areaColor(f.area)" x-text="f.area"></span>
                    <span class="ed-ftitle" x-text="f.title"></span>
                  </li>
                </template>
              </ol>
              <div class="ed-none" x-show="!r.findings.some(x => !x.acked && (x.sev === 'high' || x.sev === 'medium'))">No open high or medium findings.</div>
            </div>
          </section>

          <!-- talkers -->
          <section class="ed-sec" x-show="talkers().length">
            <h2 class="ed-h">Who is the Mac talking to?</h2>
            <p class="ed-sub" x-html="talkersSub()"></p>
            <div class="ed-chart" x-html="talkersSvg()"></div>
          </section>

          <!-- posture tiles -->
          <section class="ed-sec">
            <h2 class="ed-h">How is the Mac set up?</h2>
            <p class="ed-sub" x-html="postureSub()"></p>
            <div class="ed-tiles">
              <template x-for="p in r.posture.filter(p => p.status !== 'pass' || showPassing)" :key="p.control">
                <div class="ed-tile" :class="'is-' + p.status" :title="p.why || ''">
                  <div class="ed-tname" x-text="p.control"></div>
                  <div class="ed-tval" x-text="p.value"></div>
                </div>
              </template>
            </div>
            <a href="#" class="ed-link" x-show="r.posture.some(p => p.status === 'pass')" @click.prevent="showPassing = !showPassing" x-text="showPassing ? 'Hide the passing checks' : 'Show the ' + r.posture.filter(p => p.status === 'pass').length + ' passing checks'"></a>
            <p class="ed-note" x-show="!r.posture.length">Waiting for the first posture snapshot from the collector.</p>
          </section>

          <footer class="ed-foot" x-text="'Argus ' + r.version + ' · ' + num(tpTotal('events')) + ' events read in 24 h · ' + num(r.intel.total || 0) + ' indicators tracked · updated ' + ago(r.generated)"></footer>
        </div>

        <!-- ============================================================ FINDINGS -->
        <div x-show="tab === 'findings'">
          <div class="card">
            <div class="card-header flex-wrap gap-2">
              <div class="btn-group" role="group">
                <template x-for="s in ['high','medium','low','info']" :key="s">
                  <button class="btn btn-sm" :class="fSev.includes(s) ? 'btn-primary' : ''" @click="toggleSev(s)" x-text="s + ' (' + r.counts[s] + ')'"></button>
                </template>
              </div>
              <select class="form-select form-select-sm w-auto" x-model="fArea">
                <option value="">All areas</option>
                <template x-for="a in areas()" :key="a"><option :value="a" x-text="a"></option></template>
              </select>
              <input class="form-control form-control-sm w-auto flex-fill" placeholder="Search findings and evidence" x-model.debounce.250ms="fQ">
              <label class="form-check form-switch m-0" x-show="ackedCount()"><input class="form-check-input" type="checkbox" x-model="showAcked"><span class="form-check-label small" x-text="'Show acknowledged (' + ackedCount() + ')'"></span></label>
              <div class="ms-auto btn-list">
                <button class="btn btn-sm" @click="csv('argus-findings', filteredFindings().map(f => ({id: f.id, severity: f.sev, area: f.area, title: f.title, count: f.count, detail: f.detail, evidence: f.evidence.join(' | ')})))"><i class="ti ti-download"></i> CSV</button>
              </div>
            </div>
            <div class="list-group list-group-flush">
              <template x-for="f in filteredFindings().slice(0, fLimit)" :key="f.id">
                <div class="list-group-item finding-row" @click="openFinding = openFinding === f.id ? null : f.id">
                  <div class="d-flex gap-2 align-items-center flex-wrap">
                    <span class="badge" :class="sevBadge(f.sev)" x-text="f.sev"></span>
                    <span class="badge bg-secondary-lt" x-text="f.area"></span>
                    <span class="flex-fill" :class="f.acked && 'text-secondary'" x-text="f.title"></span>
                    <span class="badge bg-secondary-lt" x-show="f.acked">acknowledged</span>
                    <span class="badge bg-orange-lt" x-show="f.ackChanged" title="You acknowledged this earlier; something new has appeared in its evidence">changed since acknowledged</span>
                    <span class="text-secondary small" x-text="f.source"></span>
                    <button class="btn btn-sm btn-ghost-primary" x-show="f.indicator" @click.stop="openIndicator(f.indicator.type, f.indicator.value)">Details</button>
                  </div>
                  <div x-show="openFinding === f.id">
                    <div class="text-secondary small mt-2" x-show="f.detail" x-text="f.detail"></div>
                    <pre class="evidence" x-text="f.evidence.join('\n')"></pre>
                    <div class="d-flex gap-2 align-items-center mt-2" @click.stop>
                      <template x-if="!f.acked">
                        <div class="d-flex gap-2 align-items-center flex-fill">
                          <input class="form-control form-control-sm" placeholder="Note (optional): why this is expected" x-model="ackNote" @keydown.enter="ackFinding(f)">
                          <button class="btn btn-sm" :disabled="ackBusy" @click="ackFinding(f)"><i class="ti ti-check"></i> Acknowledge</button>
                        </div>
                      </template>
                      <template x-if="f.acked">
                        <div class="d-flex gap-2 align-items-center flex-fill small text-secondary">
                          <span class="flex-fill" x-text="'Acknowledged ' + fmt(f.acked.at) + (f.acked.note ? ': ' + f.acked.note : '') + '. Hidden until something new shows up in its evidence.'"></span>
                          <button class="btn btn-sm" :disabled="ackBusy" @click="ackFinding(f, true)">Un-acknowledge</button>
                        </div>
                      </template>
                    </div>
                    <div class="small text-secondary mt-1" x-show="f.ackChanged" x-text="f.ackChanged ? 'Acknowledged ' + fmt(f.ackChanged.at) + (f.ackChanged.note ? ' (' + f.ackChanged.note + ')' : '') + '; acknowledge again to hide the new state.' : ''"></div>
                  </div>
                </div>
              </template>
              <div class="list-group-item text-secondary" x-show="!filteredFindings().length">Nothing matches these filters.</div>
              <div class="list-group-item text-center" x-show="filteredFindings().length > fLimit"><button class="btn btn-sm" @click="fLimit += 100">Show more</button></div>
            </div>
          </div>
        </div>

        <!-- ============================================================ INDICATORS -->
        <div x-show="tab === 'indicators'">
          <div class="card mb-3">
            <div class="card-body">
              <form class="row g-2 align-items-center" @submit.prevent="lookup()">
                <div class="col-md"><input class="form-control" placeholder="Look up an IP, domain or URL across feeds, CrowdSec and OSINT sources" x-model="lookupQ"></div>
                <div class="col-auto"><button class="btn btn-primary" :disabled="lookupBusy || !lookupQ"><span class="spinner-border spinner-border-sm me-2" x-show="lookupBusy"></span><i class="ti ti-search me-1" x-show="!lookupBusy"></i>Look up</button></div>
              </form>
              <div class="text-danger small mt-2" x-show="lookupErr" x-text="lookupErr"></div>
            </div>
          </div>
          <div class="card">
            <div class="card-header flex-wrap gap-2">
              <select class="form-select form-select-sm w-auto" x-model="iRisk" @change="iOffset = 0; loadIndicators()">
                <option value="flagged">Flagged (malicious + suspicious)</option><option value="malicious">Malicious</option><option value="suspicious">Suspicious</option>
                <option value="clean">Clean</option><option value="unknown">Not yet rated</option><option value="">All</option>
              </select>
              <select class="form-select form-select-sm w-auto" x-model="iType" @change="iOffset = 0; loadIndicators()">
                <option value="">IPs and domains</option><option value="ip">IPs</option><option value="domain">Domains</option>
              </select>
              <select class="form-select form-select-sm w-auto" x-model="iSource" @change="iOffset = 0; loadIndicators()">
                <option value="">Any source</option><option value="connection">Active connections</option><option value="dns">DNS (Pi-hole)</option><option value="dns-heuristic">DNS heuristics</option>
                <option value="ssh">SSH</option><option value="firewall">Firewall</option><option value="syslog">Syslog</option><option value="resolved">Resolved</option><option value="manual">Manual lookups</option>
              </select>
              <input class="form-control form-control-sm w-auto flex-fill" placeholder="Filter by value" x-model.debounce.400ms="iQ" @input.debounce.400ms="iOffset = 0; loadIndicators()">
              <div class="ms-auto btn-list">
                <a class="btn btn-sm" href="/api/export/indicators.csv"><i class="ti ti-download"></i> Flagged CSV</a>
              </div>
            </div>
            <div class="table-responsive table-wrap">
              <table class="table table-vcenter card-table table-sm">
                <thead><tr><th>Indicator</th><th>Risk</th><th>Why</th><th>Sources</th><th class="text-end">Hits</th><th>Last seen</th></tr></thead>
                <tbody>
                  <template x-for="o in ind.rows" :key="o.type + o.value">
                    <tr class="clickable" @click="openIndicator(o.type, o.value)">
                      <td><span class="mono" x-text="o.value"></span> <span class="badge bg-secondary-lt" x-text="o.type"></span></td>
                      <td><span class="badge" :class="riskBadge(o.risk)" x-text="o.risk + (o.risk_score ? ' ' + o.risk_score : '')"></span></td>
                      <td class="small text-secondary" x-text="(o.reasons[0] || '') + (o.reasons.length > 1 ? ' (+' + (o.reasons.length - 1) + ')' : '')"></td>
                      <td class="small" x-text="o.sources.join(', ')"></td>
                      <td class="text-end" x-text="num(o.hits)"></td>
                      <td class="small nowrap" x-text="ago(o.last_seen)"></td>
                    </tr>
                  </template>
                  <tr x-show="!ind.rows.length"><td colspan="6" class="text-secondary">No indicators match. Indicators come from active connections, Pi-hole DNS, SSH/firewall events and syslog.</td></tr>
                </tbody>
              </table>
            </div>
            <div class="card-footer d-flex align-items-center">
              <span class="text-secondary small" x-text="ind.total ? (iOffset + 1) + '–' + Math.min(iOffset + 200, ind.total) + ' of ' + num(ind.total) : ''"></span>
              <div class="ms-auto btn-list">
                <button class="btn btn-sm" :disabled="iOffset === 0" @click="iOffset = Math.max(0, iOffset - 200); loadIndicators()">Previous</button>
                <button class="btn btn-sm" :disabled="iOffset + 200 >= ind.total" @click="iOffset += 200; loadIndicators()">Next</button>
              </div>
            </div>
          </div>
        </div>

        <!-- ============================================================ CROWDSEC -->
        <div x-show="tab === 'crowdsec'">
          <div class="alert alert-warning" x-show="r.crowdsec.error || r.crowdsec.alertError" x-text="'CrowdSec: ' + [r.crowdsec.error, r.crowdsec.alertError].filter(Boolean).join(' · ')"></div>
          <div class="row row-cards mb-3">
            <div class="col-md-3"><div class="card card-sm"><div class="card-body"><div class="text-secondary small text-uppercase">Alerts</div><div class="kpi" x-text="num(r.crowdsec.alerts.length)"></div><div class="small text-secondary" x-text="'synced ' + ago(r.crowdsec.lastAlerts)"></div></div></div></div>
            <div class="col-md-3"><div class="card card-sm"><div class="card-body"><div class="text-secondary small text-uppercase">Decisions known</div><div class="kpi" x-text="num(r.crowdsec.decisions)"></div><div class="small text-secondary" x-text="'synced ' + ago(r.crowdsec.lastStream)"></div></div></div></div>
            <div class="col-md-6"><div class="card card-sm h-100"><div class="card-body"><div class="text-secondary small text-uppercase mb-2">By origin</div>
              <template x-for="[k, v] in Object.entries(r.crowdsec.byOrigin || {})" :key="k"><span class="badge bg-azure-lt me-1 mb-1" x-text="k + ': ' + num(v)"></span></template>
              <div class="small text-secondary mt-1">CAPI and lists are the community blocklist; "crowdsec" means detected here. Argus is detection-only: no bouncer blocks traffic on the Mac.</div></div></div></div>
          </div>
          <div class="card">
            <div class="card-header"><h3 class="card-title">Alerts</h3></div>
            <div class="table-responsive table-wrap">
              <table class="table table-sm table-vcenter card-table">
                <thead><tr><th>When</th><th>Scenario</th><th>Source</th><th>Origin</th><th class="text-end">Events</th><th class="text-end">Decisions</th></tr></thead>
                <tbody>
                  <template x-for="a in r.crowdsec.alerts" :key="a.id">
                    <tr><td class="nowrap small" x-text="fmt(a.created)"></td><td x-text="a.scenario"></td>
                      <td><a href="#" class="mono" @click.prevent="a.ip && openIndicator('ip', a.ip)" x-text="a.ip"></a></td>
                      <td class="small" x-text="[a.cn, a.as].filter(Boolean).join(' · ')"></td><td class="text-end" x-text="a.events"></td><td class="text-end" x-text="a.decisions"></td></tr>
                  </template>
                  <tr x-show="!r.crowdsec.alerts.length"><td colspan="6" class="text-secondary">No alerts. CrowdSec reads the macOS events Argus converts plus anything sent to the syslog listener.</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- ============================================================ MACOS -->
        <div x-show="tab === 'macos'">
          <ul class="nav nav-pills mb-3 flex-wrap">
            <template x-for="s in macTabs" :key="s.id">
              <li class="nav-item"><a href="#" class="nav-link" :class="macTab === s.id && 'active'" @click.prevent="macTab = s.id" x-text="s.label"></a></li>
            </template>
          </ul>

          <!-- access -->
          <div x-show="macTab === 'access'" class="row row-cards">
            <div class="col-12"><div class="card">
              <div class="card-header"><h3 class="card-title">sudo</h3>
                <div class="card-actions"><label class="form-check form-switch m-0"><input class="form-check-input" type="checkbox" x-model="hideCollector"><span class="form-check-label small">Hide collector commands</span></label></div></div>
              <div class="table-responsive table-wrap"><table class="table table-sm card-table">
                <thead><tr><th>When</th><th>User</th><th>As</th><th>Command</th><th>Result</th></tr></thead>
                <tbody><template x-for="(s, i) in r.macos.access.sudo.filter(x => !hideCollector || !x.collector).slice().reverse().slice(0, 500)" :key="i">
                  <tr><td class="nowrap small" x-text="fmt(s.ts)"></td><td x-text="s.user"></td><td x-text="s.runas"></td>
                    <td class="mono"><span x-text="s.command"></span> <span class="badge bg-orange-lt" x-show="s.risk" x-text="s.risk"></span></td>
                    <td><span class="badge" :class="s.ok ? 'bg-green-lt' : 'bg-red-lt'" x-text="s.ok ? 'ok' : (s.reason || 'failed')"></span></td></tr>
                </template></tbody></table></div></div></div>
            <div class="col-lg-6"><div class="card">
              <div class="card-header"><h3 class="card-title">SSH and Screen Sharing</h3></div>
              <div class="table-responsive table-wrap"><table class="table table-sm card-table">
                <thead><tr><th>When</th><th>Service</th><th>User</th><th>From</th><th>Result</th></tr></thead>
                <tbody>
                  <template x-for="(e, i) in remoteAccess()" :key="i"><tr><td class="small nowrap" x-text="fmt(e.ts)"></td><td x-text="e.svc"></td><td x-text="e.user"></td><td class="mono" x-text="e.ip"></td>
                    <td><span class="badge" :class="e.ok ? 'bg-green-lt' : 'bg-red-lt'" x-text="e.ok ? 'ok' : 'failed'"></span></td></tr></template>
                  <tr x-show="!remoteAccess().length"><td colspan="5" class="text-secondary">No remote access events.</td></tr>
                </tbody></table></div></div></div>
            <div class="col-lg-6"><div class="card">
              <div class="card-header"><h3 class="card-title">Login history</h3><div class="card-actions small text-secondary" x-text="'screen locks: ' + r.macos.access.locks.lock + ' · unlocks: ' + r.macos.access.locks.unlock"></div></div>
              <div class="table-responsive table-wrap"><table class="table table-sm card-table">
                <thead><tr><th>When</th><th>User</th><th>TTY</th><th>From</th><th>Session</th></tr></thead>
                <tbody><template x-for="(l, i) in r.macos.access.logins.slice(0, 300)" :key="i"><tr :class="l.remote && 'table-warning'"><td class="small nowrap" x-text="fmt(l.ts)"></td><td x-text="l.user"></td><td x-text="l.tty"></td><td x-text="l.host"></td><td class="small" x-text="l.session"></td></tr></template></tbody></table></div></div></div>
            <div class="col-12"><div class="card">
              <div class="card-header"><h3 class="card-title">Authorization rights (admin prompts)</h3></div>
              <div class="table-responsive table-wrap"><table class="table table-sm card-table">
                <thead><tr><th>Right</th><th>Client</th><th class="text-end">OK</th><th class="text-end">Failed</th><th>Last</th></tr></thead>
                <tbody><template x-for="(a, i) in r.macos.access.authd.slice(0, 200)" :key="i"><tr><td class="mono" x-text="a.right"></td><td class="mono small" x-text="a.client"></td><td class="text-end" x-text="a.ok"></td><td class="text-end" :class="a.fail && 'text-red'" x-text="a.fail"></td><td class="small nowrap" x-text="fmt(a.last)"></td></tr></template></tbody></table></div></div></div>
          </div>

          <!-- permissions -->
          <div x-show="macTab === 'permissions'" class="row row-cards">
            <div class="col-12"><div class="card">
              <div class="card-header"><h3 class="card-title">Privacy permissions (TCC) in use</h3>
                <div class="card-actions"><label class="form-check form-switch m-0"><input class="form-check-input" type="checkbox" x-model="thirdPartyTcc"><span class="form-check-label small">Third-party apps only</span></label></div></div>
              <div class="table-responsive table-wrap"><table class="table table-sm card-table">
                <thead><tr><th>App</th><th>Permission</th><th class="text-end">Allowed</th><th class="text-end">Denied</th><th class="text-end">Checks</th><th>Last</th></tr></thead>
                <tbody><template x-for="(t, i) in r.macos.protect.tcc.filter(x => !thirdPartyTcc || !x.apple).slice(0, 400)" :key="i">
                  <tr><td class="mono small" x-text="t.client"></td><td><span x-text="t.serviceName"></span> <span class="badge bg-orange-lt" x-show="t.high">high impact</span></td>
                    <td class="text-end" x-text="t.allowed"></td><td class="text-end" x-text="t.denied"></td><td class="text-end text-secondary" x-text="t.preflight"></td><td class="small nowrap" x-text="fmt(t.last)"></td></tr>
                </template></tbody></table></div></div></div>
            <div class="col-lg-7"><div class="card">
              <div class="card-header"><h3 class="card-title">Gatekeeper and XProtect</h3></div>
              <div class="table-responsive table-wrap"><table class="table table-sm card-table">
                <thead><tr><th>Last</th><th>Outcome</th><th>Item</th><th>Team</th><th class="text-end">×</th></tr></thead>
                <tbody>
                  <template x-for="(g, i) in r.macos.protect.gatekeeper.filter(x => x.outcome !== 'scan' || showScans).slice(0, 300)" :key="i">
                    <tr><td class="small nowrap" x-text="fmt(g.last)"></td><td><span class="badge" :class="g.outcome === 'malware' ? 'bg-red-lt' : g.outcome === 'blocked' ? 'bg-orange-lt' : 'bg-secondary-lt'" x-text="g.outcome"></span></td>
                      <td class="mono small" x-text="g.path || g.sample"></td><td class="small" x-text="g.team || '—'"></td><td class="text-end" x-text="g.count"></td></tr>
                  </template>
                  <template x-for="(x, i) in r.macos.protect.xprotect.slice(-100).reverse()" :key="'x' + i">
                    <tr><td class="small nowrap" x-text="fmt(x.ts)"></td><td><span class="badge" :class="x.high ? 'bg-red-lt' : 'bg-yellow-lt'">XProtect</span></td><td class="small" colspan="2" x-text="x.proc + ': ' + x.msg"></td><td class="text-end" x-text="x.count"></td></tr>
                  </template>
                </tbody></table></div>
              <div class="card-footer"><label class="form-check form-switch m-0"><input class="form-check-input" type="checkbox" x-model="showScans"><span class="form-check-label small">Include routine scans</span></label></div></div></div>
            <div class="col-lg-5"><div class="card">
              <div class="card-header"><h3 class="card-title">Firewall: inbound sources</h3><div class="card-actions small text-secondary" x-text="num(r.macos.protect.firewall.events) + ' events'"></div></div>
              <div class="table-responsive table-wrap"><table class="table table-sm card-table">
                <thead><tr><th>Source</th><th>Scope</th><th class="text-end">Attempts</th><th>Ports</th></tr></thead>
                <tbody><template x-for="(s, i) in r.macos.protect.firewall.sources.slice(0, 200)" :key="i"><tr><td class="mono" x-text="s.src"></td><td><span class="badge bg-secondary-lt" x-text="s.scope"></span></td><td class="text-end" x-text="s.count"></td><td class="small" x-text="s.ports"></td></tr></template>
                <tr x-show="!r.macos.protect.firewall.sources.length"><td colspan="4" class="text-secondary">No firewall events (normal when nothing probes this Mac).</td></tr></tbody></table></div></div></div>
          </div>

          <!-- persistence -->
          <div x-show="macTab === 'persistence'" class="row row-cards">
            <div class="col-12"><div class="card">
              <div class="card-header"><h3 class="card-title">Launch agents and daemons</h3></div>
              <div class="table-responsive table-wrap"><table class="table table-sm card-table">
                <thead><tr><th>Label</th><th>Type</th><th>Program</th><th>Flags</th><th>Modified</th></tr></thead>
                <tbody><template x-for="(l, i) in r.macos.persistence.launch" :key="i">
                  <tr><td class="mono small" x-text="l.label"></td><td class="small" x-text="l.domain"></td><td class="mono small" x-text="l.args.join(' ') || l.program"></td>

                </template>
                <tr x-show="!r.macos.persistence.launch.length"><td colspan="5" class="text-secondary">No launch-item snapshot yet.</td></tr></tbody></table></div></div></div>
            <div class="col-12"><div class="card">
              <div class="card-header"><h3 class="card-title">Background items (Login Items &amp; Extensions)</h3></div>
              <div class="table-responsive table-wrap"><table class="table table-sm card-table">
                <thead><tr><th>Name</th><th>Developer</th><th>Team</th><th>Type</th><th>State</th><th>Executable</th></tr></thead>
                <tbody><template x-for="(b, i) in r.macos.persistence.btm" :key="i">
                  <tr><td x-text="b.name || b.ident"></td><td class="small" x-text="b.developer"></td><td class="small"><span x-text="b.team || '—'"></span></td><td class="small" x-text="b.type"></td>
                    <td><span class="badge" :class="b.enabled ? 'bg-green-lt' : 'bg-secondary-lt'" x-text="b.enabled ? 'enabled' : 'disabled'"></span></td><td class="mono small" x-text="b.exe || b.url"></td></tr>
                </template></tbody></table></div></div></div>
            <div class="col-lg-6"><div class="card">
              <div class="card-header"><h3 class="card-title">System extensions</h3></div>
              <div class="table-responsive"><table class="table table-sm card-table"><thead><tr><th>Name</th><th>Category</th><th>Team</th><th>State</th></tr></thead>
                <tbody><template x-for="(s, i) in r.macos.persistence.sysext" :key="i"><tr><td x-text="s.name"></td><td class="small" x-text="s.category"></td><td class="small" x-text="s.team"></td><td class="small" x-text="s.state"></td></tr></template>
                <tr x-show="!r.macos.persistence.sysext.length"><td colspan="4" class="text-secondary">None reported.</td></tr></tbody></table></div></div></div>
            <div class="col-lg-6"><div class="card">
              <div class="card-header"><h3 class="card-title">Other persistence</h3></div>
              <div class="card-body small">
                <div class="mb-2"><strong>Configuration profiles:</strong> <span x-text="r.macos.persistence.profiles.join(', ') || 'none'"></span></div>
                <div class="mb-2"><strong>crontab:</strong> <span class="mono" x-text="r.macos.persistence.cron.join(' ; ') || 'none'"></span></div>
                <div><strong>Third-party launchd jobs (your session):</strong>
                  <template x-for="(a, i) in r.macos.persistence.agents.slice(0, 60)" :key="i"><div class="mono"><span x-text="a.label"></span> <span class="text-secondary" x-text="a.status ? '(exit ' + a.status + ')' : (a.pid ? '(running)' : '')"></span></div></template>
                </div>
              </div></div></div>
          </div>

          <!-- network -->
          <div x-show="macTab === 'network'" class="row row-cards">
            <div class="col-lg-6"><div class="card">
              <div class="card-header"><h3 class="card-title">Listening TCP services</h3></div>
              <div class="table-responsive table-wrap"><table class="table table-sm card-table">
                <thead><tr><th>Process</th><th>Address</th><th>Port</th><th>Exposure</th></tr></thead>
                <tbody><template x-for="(t, i) in r.macos.network.tcp" :key="i">
                  <tr><td><span x-text="t.cmd"></span> <span class="text-secondary small" x-text="'pid ' + t.pid"></span></td><td class="mono" x-text="t.host"></td>
                    <td><span x-text="t.port"></span> <span class="text-secondary small" x-text="t.service"></span></td>
                    <td><span class="badge" :class="t.scope === 'loopback' ? 'bg-green-lt' : (t.apple ? 'bg-secondary-lt' : 'bg-orange-lt')" x-text="t.scope === 'loopback' ? 'this Mac only' : t.scope === 'any' ? 'all interfaces' : t.scope"></span></td></tr>
                </template></tbody></table></div></div></div>
            <div class="col-lg-6"><div class="card">
              <div class="card-header"><h3 class="card-title">Public endpoints this Mac is talking to</h3></div>
              <div class="table-responsive table-wrap"><table class="table table-sm card-table">
                <thead><tr><th>Remote IP</th><th>Ports</th><th>Processes</th><th class="text-end">Conns</th></tr></thead>

                  <tr class="clickable" @click="openIndicator('ip', c.ip)"><td class="mono" x-text="c.ip"></td><td class="small" x-text="c.ports"></td><td class="small" x-text="c.procs"></td><td class="text-end" x-text="c.count"></td></tr>
                </template>
                <tr x-show="!r.macos.network.remotes.length"><td colspan="4" class="text-secondary">No connection snapshot yet.</td></tr></tbody></table></div></div></div>
          </div>

          <!-- crashes -->
          <div x-show="macTab === 'crashes'" class="card">
            <div class="card-header"><h3 class="card-title">Crash and diagnostic reports (14 days)</h3></div>
            <div class="table-responsive table-wrap"><table class="table table-sm card-table">
              <thead><tr><th>When</th><th>App</th><th>Kind</th><th>Exception / detail</th><th>Path</th></tr></thead>
              <tbody><template x-for="(c, i) in r.macos.crashes.slice(0, 500)" :key="i">

                  <tbody><template x-for="(s, i) in r.dns.suspicious.slice(0, 200)" :key="i"><tr class="clickable" @click="!s.domain.startsWith('*') && openIndicator('domain', s.domain)"><td class="mono small" x-text="s.domain"></td><td class="small" x-text="s.reasons"></td><td class="text-end" x-text="s.queries"></td></tr></template>

              <div class="col-lg-6"><div class="card"><div class="card-header"><h3 class="card-title">Top blocked</h3></div>

              <div class="col-lg-6"><div class="card"><div class="card-header"><h3 class="card-title">Clients</h3></div>

            </div>
          </div></template>

              <div class="card-body small text-secondary border-top">

              </div></div></div>
            <div class="col-lg-7"><div class="card">
              <div class="card-header"><h3 class="card-title">Recent messages</h3></div>
              <div class="table-responsive table-wrap"><table class="table table-sm card-table"><tbody>

              </tbody></table></div></div></div>
          </div>

        <!-- ============================================================ ENDPOINT -->
        <div x-show="tab === 'endpoint'">
          <template x-if="!r.hostsec"><div class="alert alert-info">No endpoint telemetry in this report yet.</div></template>

          <div class="row row-cards">
            <div class="col-12"><div class="row row-cards">
              <div class="col-sm-6 col-lg-3"><div class="card card-sm"><div class="card-body">
                <div class="subheader">Endpoint Security</div>
                <div class="h2 mb-0" x-text="r.hostsec.es && r.hostsec.es.active ? num(r.hostsec.es.events) + ' events' : 'not active'"></div>
                <div class="small text-secondary" x-text="r.hostsec.es && r.hostsec.es.active ? 'last chunk ' + ago(r.hostsec.es.lastFileAt) + ' · collecting since ' + fmt(r.hostsec.es.since) : 'run ./argus.sh install-telemetry and grant Full Disk Access to /usr/bin/eslogger'"></div></div></div></div>
              <div class="col-sm-6 col-lg-3"><div class="card card-sm"><div class="card-body">
                <div class="subheader">Third-party binaries (window)</div>
                <div class="h2 mb-0" x-text="r.hostsec.es && r.hostsec.es.active ? num(r.hostsec.es.thirdParty) : '—'"></div>

                <div class="small text-secondary" x-text="r.hostsec.tccDb && r.hostsec.tccDb.available ? num(r.hostsec.tccDb.granted) + ' grants in ' + (r.hostsec.tccDb.system ? 'system' : '') + (r.hostsec.tccDb.system && r.hostsec.tccDb.user ? ' + ' : '') + (r.hostsec.tccDb.user ? 'user' : '') + ' DB' : 'grant Full Disk Access to /usr/bin/sqlite3'"></div></div></div></div>
              <div class="col-sm-6 col-lg-3"><div class="card card-sm"><div class="card-body">
                <div class="subheader">Downloads (30 days)</div>
                <div class="h2 mb-0" x-text="r.hostsec.downloads && r.hostsec.downloads.available ? num(r.hostsec.downloads.total) : 'no data'"></div>
                <div class="small text-secondary" x-text="r.hostsec.downloads && r.hostsec.downloads.available ? num(r.hostsec.downloads.hosts.length) + ' source hosts (checked against threat intel)' : 'waits for the user collector'"></div></div></div></div>
            </div></div>

            <div class="col-12" x-show="r.hostsec.es && r.hostsec.es.active"><div class="card">
              <div class="card-header"><h3 class="card-title">Notable Endpoint Security events</h3>
                <div class="card-actions small text-secondary" x-text="(r.hostsec.es.eventKinds || []).map(k => k.kind + ' ' + k.n).join(' · ')"></div></div>
              <div class="table-responsive table-wrap"><table class="table table-sm card-table">
                <thead><tr><th>When</th><th>Event</th><th>Severity</th><th>Detail</th></tr></thead>
                <tbody>
                  <template x-for="(e, i) in (r.hostsec.es.recent || []).slice(0, 300)" :key="i"><tr><td class="small nowrap" x-text="fmt(e.ts)"></td><td class="small mono" x-text="e.kind"></td>
                    <td><span class="badge" :class="sevBadge(e.sev)" x-text="e.sev"></span></td><td class="small mono text-break" x-text="e.summary"></td></tr></template>
                  <tr x-show="!(r.hostsec.es.recent || []).length"><td colspan="4" class="text-secondary">Nothing notable in the window.</td></tr>
                </tbody></table></div></div></div>

            <div class="col-lg-6" x-show="r.hostsec.es && r.hostsec.es.active"><div class="card">

                <thead><tr><th>First run</th><th>Program</th><th>Signer</th><th>Parent</th></tr></thead>
                <tbody>
                  <template x-for="(b, i) in (r.hostsec.es.newBinaries || [])" :key="i"><tr><td class="small nowrap" x-text="fmt(b.first_seen)"></td><td class="small mono text-break" x-text="b.path"></td>
                    <td class="small"><span class="badge" :class="b.team ? 'bg-green-lt' : 'bg-orange-lt'" x-text="b.team || (b.adhoc ? 'ad-hoc' : 'no Team ID')"></span></td><td class="small mono text-break" x-text="b.last_parent"></td></tr></template>
                  <tr x-show="!(r.hostsec.es.newBinaries || []).length"><td colspan="4" class="text-secondary" x-text="r.hostsec.es.baselineDone ? 'None in the window.' : 'Learning what normally runs here (first 24 h).'"></td></tr>
                </tbody></table></div></div></div>
            <div class="col-lg-6" x-show="r.hostsec.es && r.hostsec.es.active"><div class="card">
              <div class="card-header"><h3 class="card-title">Most-run third-party programs</h3></div>
              <div class="table-responsive table-wrap"><table class="table table-sm card-table">
                <thead><tr><th>Program</th><th>Signer</th><th class="text-end">Runs</th><th>Last</th></tr></thead>
                <tbody><template x-for="(b, i) in (r.hostsec.es.topThirdParty || []).slice(0, 150)" :key="i"><tr><td class="small mono text-break" x-text="b.path"></td>
                  <td class="small" x-text="b.team || (b.adhoc ? 'ad-hoc' : 'no Team ID')"></td><td class="text-end" x-text="num(b.count)"></td><td class="small nowrap" x-text="ago(b.last_seen)"></td></tr></template></tbody></table></div></div></div>

            <div class="col-lg-6"><div class="card">
              <div class="card-header"><h3 class="card-title">High-impact grants (TCC.db)</h3></div>
              <div class="table-responsive table-wrap"><table class="table table-sm card-table">
                <thead><tr><th>Permission</th><th>Client</th><th>DB</th><th>Modified</th></tr></thead>

                  <template x-for="(t, i) in ((r.hostsec.tccDb && r.hostsec.tccDb.thirdParty) || [])" :key="i"><tr :class="t.recent && 'table-warning'"><td x-text="t.serviceName"></td>
                    <td class="small mono text-break"><span x-text="t.client"></span> <span class="badge bg-secondary-lt" x-show="t.ours">Argus</span> <span class="badge bg-orange-lt" x-show="t.recent">new</span></td><td class="small" x-text="t.db"></td><td class="small nowrap" x-text="t.modified ? fmt(t.modified) : ''"></td></tr></template>

                </tbody></table></div></div></div>
            <div class="col-lg-6"><div class="card">
              <div class="card-header"><h3 class="card-title">Background item changes</h3><div class="card-actions small text-secondary" x-show="r.hostsec.btmDiff && r.hostsec.btmDiff.available" x-text="num(r.hostsec.btmDiff.items) + ' third-party items · baseline ' + fmt(r.hostsec.btmDiff.baselineAt)"></div></div>
              <div class="table-responsive table-wrap"><table class="table table-sm card-table">
                <thead><tr><th>When</th><th>Change</th><th>Item</th><th>Executable</th></tr></thead>

                  <template x-for="(c, i) in ((r.hostsec.btmDiff && r.hostsec.btmDiff.changes) || [])" :key="i"><tr><td class="small nowrap" x-text="fmt(c.at)"></td>

                    <td class="small"><span x-text="c.name"></span> <span class="text-secondary" x-text="c.type"></span></td><td class="small mono text-break" x-text="c.exe"></td></tr></template>
                  <tr x-show="!((r.hostsec.btmDiff && r.hostsec.btmDiff.changes) || []).length"><td colspan="4" class="text-secondary">No changes since the baseline snapshot.</td></tr>
                </tbody></table></div></div></div>

            <div class="col-12" x-show="r.hostsec.littlesnitch && r.hostsec.littlesnitch.available"><div class="card">
              <div class="card-header"><h3 class="card-title">Little Snitch traffic (24 h)</h3>

              <div class="table-responsive table-wrap"><table class="table table-sm card-table">
                <thead><tr><th>Program</th><th>Destinations</th><th class="text-end">Remotes</th><th class="text-end">Conns</th><th class="text-end">Denied</th><th class="text-end">Sent</th><th class="text-end">Received</th><th>Last</th></tr></thead>
                <tbody><template x-for="(p, i) in ((r.hostsec.littlesnitch && r.hostsec.littlesnitch.programs) || []).slice(0, 200)" :key="i"><tr>

                  <td class="text-end nowrap" x-text="bytes(p.bytes_out)"></td><td class="text-end nowrap" x-text="bytes(p.bytes_in)"></td><td class="small nowrap" x-text="ago(p.last)"></td></tr></template></tbody></table></div></div></div>

            <div class="col-12" x-show="r.hostsec.dnsAttribution && r.hostsec.dnsAttribution.available && r.hostsec.dnsAttribution.rows.length"><div class="card">

                <thead><tr><th>Domain</th><th>Risk</th><th>Program</th><th class="text-end">Conns</th><th class="text-end">Denied</th><th>Last</th></tr></thead>
                <tbody><template x-for="(d, i) in ((r.hostsec.dnsAttribution && r.hostsec.dnsAttribution.rows) || []).slice(0, 200)" :key="i"><tr :class="d.programs.length && d.risk === 'malicious' && 'table-danger'">

                  <td class="small nowrap" x-text="d.programs.length ? ago(Math.max(...d.programs.map(p => p.last))) : ''"></td></tr></template></tbody></table></div></div></div>

            <div class="col-lg-6" x-show="r.hostsec.network && r.hostsec.network.available"><div class="card">

              <div class="table-responsive table-wrap"><table class="table table-sm card-table">
                <thead><tr><th>When</th><th>Event</th></tr></thead>
                <tbody>
                  <template x-for="(e, i) in ((r.hostsec.network && r.hostsec.network.events) || []).slice(0, 150)" :key="i"><tr :class="e.open && 'table-danger'"><td class="small nowrap" x-text="fmt(e.at)"></td>

            <div class="table-responsive"><table class="table table-sm card-table"><thead><tr><th>Feed</th><th>Type</th><th>Severity</th><th class="text-end">Entries</th><th>Updated</th><th>Status</th></tr></thead>

            <div class="table-responsive"><table class="table table-sm card-table">

              <tbody><template x-for="s in r.throughput.sources" :key="s.source"><tr><td x-text="tpLabel(s.source)"></td><td class="text-end" x-text="num(s.events)"></td><td class="text-end" x-text="s.eps.toFixed(2)"></td><td class="text-end" x-text="s.eps15.toFixed(2) + '/s'"></td>

                  <td class="small"><span x-text="e.error || e.summary"></span> <a x-show="e.link" :href="e.link" target="_blank" rel="noopener noreferrer"><i class="ti ti-external-link"></i></a></td>
                  <td class="small nowrap" x-text="ago(e.fetched_at)"></td></tr></template>
