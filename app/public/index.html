                  <div class="text-secondary" x-show="c.detail && c.status !== 'ok'" x-text="c.detail"></div><code class="d-block mt-1" x-show="c.fix" x-text="c.fix"></code></div>
              </template>
            </div></div></div>
          <div class="col-lg-6"><div class="card">
            <div class="card-header"><h3 class="card-title">Alerts</h3><div class="card-actions"><button class="btn btn-sm" @click="testAlert()"><i class="ti ti-bell"></i> Send a test</button></div></div>
            <div class="card-body small" x-show="r.alerts">
              <p class="mb-2" x-text="'Alerts go out for new ' + (r.alerts ? (r.alerts.minSev === 'high' ? 'high' : r.alerts.minSev === 'medium' ? 'high and medium' : r.alerts.minSev + ' and worse') : '') + ' findings' + (r.alerts && r.alerts.health !== 'off' ? ' and for inputs that ' + (r.alerts.health === 'warn' ? 'stall or stop' : 'stop') : '') + '. Each finding alerts once, and again only when new evidence appears. Acknowledged findings never alert.'
                + (r.alerts && r.alerts.quiet ? ' Quiet hours ' + r.alerts.quiet + ':00' + (r.alerts.quietHigh ? ', only highs get through' : ', nothing gets through') + '.' : '')
                + (r.alerts && r.alerts.batch && r.alerts.batch.length ? ' ' + r.alerts.batch.join(' and ') + ' findings are collected into one alert at ' + r.alerts.batchHour + ':00.' : '')
                + (r.alerts && r.alerts.held ? ' ' + r.alerts.held + ' held for later right now.' : '')"></p>
              <div class="list-group list-group-flush mb-2">
                <template x-for="ch in [['mac', 'macOS notification', 'on by default; shown by the com.argus.notify agent (./argus.sh install-collector)'], ['ntfy', 'ntfy', 'ARGUS_NTFY_URL'], ['pushover', 'Pushover', 'PUSHOVER_TOKEN + PUSHOVER_USER'], ['webhook', 'Webhook', 'ARGUS_ALERT_WEBHOOK (Slack-compatible JSON)']]" :key="ch[0]">
                  <div class="list-group-item px-0 d-flex gap-2 align-items-baseline"><i class="ed-dot" :style="'background:' + (r.alerts && r.alerts.channels[ch[0]] ? 'var(--ok)' : 'var(--rule)')"></i><strong x-text="ch[1]"></strong><span class="text-secondary flex-fill" x-text="r.alerts && r.alerts.channels[ch[0]] ? 'on' : 'off · set ' + ch[2]"></span></div>
                </template>
              </div>
              <div class="text-secondary" x-text="r.alerts ? (r.alerts.armed ? (r.alerts.last ? 'Last alert ' + ago(r.alerts.last.at) + ': ' + r.alerts.last.title : 'No alert sent since Argus started.') : 'Arming: what is open now is recorded silently so you are not paged for the backlog.') : ''"></div>
              <div class="text-red mt-1" x-show="r.alerts && r.alerts.error" x-text="r.alerts ? r.alerts.error : ''"></div>
              <div class="mt-2" x-show="alertMsg" x-text="alertMsg"></div>
            </div></div></div>
          <div class="col-lg-6"><div class="card">
            <div class="card-header"><h3 class="card-title">Inputs</h3></div>
            <div class="list-group list-group-flush small">
              <div class="list-group-item"><div class="d-flex"><strong class="flex-fill">Host collector</strong><span class="badge" :class="collectorFresh() ? 'bg-green-lt' : 'bg-orange-lt'" x-text="collectorFresh() ? 'reporting' : 'stale or not installed'"></span></div>
                <div class="text-secondary" x-text="'last unified-log batch ' + ago(r.inputs.collector.lastFileAt || (r.inputs.collector.meta.system_last_run ? r.inputs.collector.meta.system_last_run * 1000 : null)) + ' · ' + num(r.inputs.collector.inboxFiles) + ' batches in inbox · ' + num(r.inputs.collector.events) + ' events in the ' + r.inputs.collector.windowHours + ' h window'"></div>
                <div class="text-secondary" x-show="r.inputs.collector.meta.version" x-text="'collector ' + r.inputs.collector.meta.version + ' · system run ' + ago((r.inputs.collector.meta.system_last_run || 0) * 1000) + ' · user run ' + ago((r.inputs.collector.meta.user_last_run || 0) * 1000)"></div></div>
              <div class="list-group-item" x-show="r.inputs.collector.hostsec"><div class="d-flex"><strong class="flex-fill">Endpoint Security (eslogger)</strong><span class="badge" :class="r.inputs.collector.hostsec && r.inputs.collector.hostsec.lastFileAt && Date.now() - r.inputs.collector.hostsec.lastFileAt < 900e3 ? 'bg-green-lt' : 'bg-orange-lt'" x-text="r.inputs.collector.hostsec && r.inputs.collector.hostsec.esSince ? (Date.now() - r.inputs.collector.hostsec.lastFileAt < 900e3 ? 'reporting' : 'stale') : 'not installed'"></span></div>
                <div class="text-secondary" x-text="r.inputs.collector.hostsec ? num(r.inputs.collector.hostsec.esEvents) + ' events in ' + num(r.inputs.collector.hostsec.esFiles) + ' chunks · last ' + ago(r.inputs.collector.hostsec.lastFileAt) + ' · TCC.db ' + ago(r.inputs.collector.hostsec.tccDb.system) + ' · downloads ' + ago(r.inputs.collector.hostsec.quarantine) + ' · app inventory ' + ago(r.inputs.collector.hostsec.inventory) : ''"></div></div>
              <div class="list-group-item" x-show="r.inputs.collector.hostsec && r.inputs.collector.hostsec.sigma"><div class="d-flex"><strong class="flex-fill">Sigma rules</strong><span class="badge" :class="r.inputs.collector.hostsec && r.inputs.collector.hostsec.sigma && r.inputs.collector.hostsec.sigma.error ? 'bg-red-lt' : 'bg-green-lt'" x-text="r.inputs.collector.hostsec && r.inputs.collector.hostsec.sigma ? (r.inputs.collector.hostsec.sigma.enabled ? r.inputs.collector.hostsec.sigma.rules + ' rules' : 'off') : ''"></span></div>
                <div class="text-secondary" x-text="r.inputs.collector.hostsec && r.inputs.collector.hostsec.sigma ? 'SigmaHQ macOS process rules on Endpoint Security launches · updated ' + ago(r.inputs.collector.hostsec.sigma.updated) + ' · ' + r.inputs.collector.hostsec.sigma.skipped + ' skipped (unsupported fields or disabled)' + (r.inputs.collector.hostsec.sigma.error ? ' · ' + r.inputs.collector.hostsec.sigma.error : '') : ''"></div></div>
              <div class="list-group-item" x-show="r.inputs.collector.vulns"><div class="d-flex"><strong class="flex-fill">Vulnerability data</strong><span class="badge" :class="r.inputs.collector.vulns && (r.inputs.collector.vulns.kev.error || r.inputs.collector.vulns.apple.error) ? 'bg-red-lt' : 'bg-green-lt'" x-text="r.inputs.collector.vulns && (r.inputs.collector.vulns.kev.error || r.inputs.collector.vulns.apple.error) ? 'error' : 'ok'"></span></div>
                <div class="text-secondary" x-text="r.inputs.collector.vulns ? 'CISA KEV ' + (r.inputs.collector.vulns.kev.error || ago(r.inputs.collector.vulns.kev.updated)) + ' · Apple releases ' + (r.inputs.collector.vulns.apple.error || ago(r.inputs.collector.vulns.apple.updated)) + ' · OSV ' + (r.inputs.collector.vulns.osv.error || ago(r.inputs.collector.vulns.osv.updated)) : ''"></div></div>
              <div class="list-group-item"><div class="d-flex"><strong class="flex-fill">Pi-hole API</strong><span class="badge" :class="!r.inputs.pihole.configured ? 'bg-secondary-lt' : r.inputs.pihole.error ? 'bg-red-lt' : 'bg-green-lt'" x-text="!r.inputs.pihole.configured ? 'not configured' : r.inputs.pihole.error ? 'error' : 'ok'"></span></div>
                <div class="text-secondary" x-text="r.inputs.pihole.configured ? (r.inputs.pihole.url + ' · polled ' + ago(r.inputs.pihole.lastPoll) + (r.inputs.pihole.error ? ' · ' + r.inputs.pihole.error : '')) : 'Set PIHOLE_URL and PIHOLE_PASSWORD'"></div></div>
              <div class="list-group-item"><div class="d-flex"><strong class="flex-fill">MISP</strong><span class="badge" :class="r.inputs.misp && r.inputs.misp.configured ? 'bg-green-lt' : 'bg-secondary-lt'" x-text="r.inputs.misp && r.inputs.misp.configured ? 'configured' : 'not configured'"></span></div>
                <div class="text-secondary" x-text="r.inputs.misp && r.inputs.misp.configured ? r.inputs.misp.url + (r.inputs.misp.auto ? ' · checks every indicator against local events and feeds' : ' · manual lookups only') : 'Start ../mist, run ./mist.sh apikey argus, then ./argus.sh up'"></div></div>
              <div class="list-group-item"><div class="d-flex"><strong class="flex-fill">IntelOwl</strong><span class="badge" :class="r.inputs.intelowl.configured ? 'bg-green-lt' : 'bg-secondary-lt'" x-text="r.inputs.intelowl.configured ? 'configured' : 'not configured'"></span></div>
                <div class="text-secondary" x-text="r.inputs.intelowl.configured ? r.inputs.intelowl.url + ' · playbook ' + r.inputs.intelowl.playbook + ' (runs on flagged indicators and manual lookups)' : 'Set INTELOWL_URL and INTELOWL_TOKEN'"></div></div>
              <div class="list-group-item" x-show="r.asn"><div class="d-flex"><strong class="flex-fill">IP owners (ASN table)</strong><span class="badge" :class="!r.asn.enabled ? 'bg-secondary-lt' : r.asn.ranges ? 'bg-green-lt' : 'bg-orange-lt'" x-text="!r.asn.enabled ? 'off' : r.asn.ranges ? 'ok' : 'not loaded'"></span></div>
                <div class="text-secondary" x-text="!r.asn.enabled ? 'ARGUS_ASN=0' : (r.asn.ranges ? num(r.asn.ranges) + ' IPv4 and ' + num(r.asn.ranges6 || 0) + ' IPv6 ranges from iptoasn.com · updated ' + ago(r.asn.updated) + ' · looked up locally' : 'downloading the table from iptoasn.com') + (r.asn.error ? ' · ' + r.asn.error : '')"></div></div>
              <div class="list-group-item"><div class="d-flex"><strong class="flex-fill">CrowdSec</strong><span class="badge" :class="r.crowdsec.error ? 'bg-red-lt' : 'bg-green-lt'" x-text="r.crowdsec.error ? 'error' : 'ok'"></span></div>
                <div class="text-secondary" x-text="num(r.crowdsec.decisions) + ' decisions · ' + (r.crowdsec.error || 'stream synced ' + ago(r.crowdsec.lastStream))"></div></div>
            </div></div></div>
          <div class="col-lg-6"><div class="card" x-data="provSort()">
            <div class="card-header"><h3 class="card-title">OSINT providers</h3></div>
            <div class="table-responsive"><table class="table table-sm card-table"><thead><tr>
              <th class="sortable" @click="by('name')">Provider <i class="ti" :class="arrow('name')"></i></th>
              <th class="sortable" @click="by('mode')">Mode <i class="ti" :class="arrow('mode')"></i></th>
              <th class="sortable text-end" @click="by('today')">Today <i class="ti" :class="arrow('today')"></i></th>
              <th class="sortable" @click="by('status')">Status <i class="ti" :class="arrow('status')"></i></th></tr></thead>
              <tbody><template x-for="p in rows(r.providers)" :key="p.id"><tr><td><span x-text="p.name"></span> <span class="text-secondary small" x-text="p.types.join('/')"></span></td>
                <td class="small" x-text="modeLabel(p)"></td>
                <td class="text-end small" x-text="p.callsToday + ' / ' + p.daily"></td><td class="small" :class="p.error && 'text-red'" x-text="p.error ? p.error + ' (' + ago(p.errorAt) + ')' : p.capped ? 'daily limit reached; resumes at midnight' : (p.enabled ? 'ok' : '')" :style="p.capped && !p.error ? 'color:var(--sev-medium)' : ''"></td></tr></template></tbody></table></div></div></div>
          <div class="col-12"><div class="card">
            <div class="card-header"><h3 class="card-title">Threat feeds</h3><div class="card-actions"><button class="btn btn-sm" @click="refreshFeeds()"><i class="ti ti-refresh"></i> Refresh all</button></div></div>
            <div class="table-responsive"><table class="table table-sm card-table"><thead><tr><th>Feed</th><th>Type</th><th>Severity</th><th class="text-end">Entries</th><th>Updated</th><th>Status</th></tr></thead>
              <tbody><template x-for="f in r.feeds" :key="f.id"><tr :title="f.info"><td x-text="f.name"></td><td class="small" x-text="f.kind"></td><td><span class="badge" :class="sevBadge(f.severity)" x-text="f.severity"></span></td>
                <td class="text-end" x-text="num(f.entries)"></td><td class="small nowrap" x-text="ago(f.updated)"></td><td class="small" :class="f.error && 'text-red'" x-text="!f.enabled ? f.why : (f.error || 'ok')"></td></tr></template></tbody></table></div></div></div>
        </div>

        <!-- ============================================================ THROUGHPUT -->
        <div x-show="tab === 'throughput'">
          <div class="card mb-3">
            <div class="card-header"><h3 class="card-title">Log flow into Argus</h3><div class="card-actions small text-secondary" x-text="'measured over ' + dur(r.throughput.spanMinutes * 60e3)"></div></div>
            <div class="table-responsive"><table class="table table-sm card-table">
              <thead><tr><th>Input</th><th class="text-end">Events (24 h)</th><th class="text-end">Avg events/s</th><th class="text-end">Last 15 min</th><th class="text-end">Bytes (24 h)</th><th class="text-end">Avg rate</th><th class="text-end">Projected / day</th></tr></thead>
              <tbody><template x-for="s in r.throughput.sources" :key="s.source"><tr><td x-text="tpLabel(s.source)"></td><td class="text-end" x-text="num(s.events)"></td><td class="text-end" x-text="s.eps.toFixed(2)"></td><td class="text-end" x-text="s.eps15.toFixed(2) + '/s'"></td>
                <td class="text-end" x-text="bytes(s.bytes)"></td><td class="text-end" x-text="rate(s.bps)"></td><td class="text-end" x-text="bytes(s.perDayBytes)"></td></tr></template>
              <tr x-show="!r.throughput.sources.length"><td colspan="7" class="text-secondary">No data has flowed yet.</td></tr></tbody></table></div>
            <div class="card-body"><div class="chart-box"><canvas id="ch-tp"></canvas></div></div>
            <div class="card-footer small text-secondary">
              "macOS unified log" is the filtered security slice the collector exports (auth, sudo, SSH, TCC, Gatekeeper/XProtect, firewall, login items, faults), not the full unified log.
              The full default-level log on a Mac playing video is typically 100–500 events/s; this slice is usually under 1 event/s.
            </div>
          </div>
        </div>

        </div>
        </template>
      </div>
    </div>
  </div>

  <!-- indicator detail -->
  <!-- ============================================================ PROGRAM DOSSIER -->
  <div class="dos-wrap" x-show="dos || dosBusy || dosErr" x-cloak @keydown.escape.window="closeDossier()">
    <div class="dos-backdrop" @click="closeDossier()"></div>
    <article class="dos" role="dialog" aria-modal="true" aria-label="Program dossier">
      <button class="dos-close" @click="closeDossier()" title="Close (Esc)"><i class="ti ti-x"></i></button>
      <div class="ed-none py-5 text-center" x-show="dosBusy && !dos">Pulling the file…</div>
      <div class="ed-none py-5 text-center" x-show="dosErr" x-text="dosErr"></div>
      <template x-if="dos">
        <div>
          <header class="dos-mast">
            <div class="ed-kicker" x-text="'Program dossier · ' + signerLabel(dos.signer)"></div>
            <h1 class="dos-title" x-text="dos.name"></h1>
            <div class="dos-path" x-text="dos.bundle || dos.path"></div>
            <div class="dos-notes">
              <template x-for="(n, i) in dos.notes" :key="i"><span class="dos-note" :style="'--c:' + sevColor(n.sev)" x-text="n.text"></span></template>
              <span class="dos-note is-ok" x-show="!dos.notes.length">Nothing unusual on record</span>
            </div>
          </header>

          <div class="ed-stats dos-stats">
            <template x-for="s in dosStats()" :key="s.label">
              <div class="ed-stat">
                <div class="ed-stat-v" :style="s.color ? 'color:' + s.color : ''" x-text="s.value"></div>
                <div class="ed-stat-l"><span x-text="s.label"></span> <span class="ed-stat-u" x-text="s.unit || ''"></span></div>
              </div>
            </template>
          </div>

          <div class="dos-grid">
            <section>
              <h2 class="dos-h">Who made it?</h2>
              <dl class="dos-dl">
                <dt>Signature</dt><dd x-text="signerLabel(dos.signer)"></dd>
                <template x-if="dos.signerOrg"><div style="display:contents"><dt>Signed by</dt><dd x-text="dos.signerOrg"></dd></div></template>
                <template x-if="dos.gatekeeper"><div style="display:contents"><dt>Gatekeeper</dt><dd x-text="dos.gatekeeper"></dd></div></template>
                <template x-if="dos.sigValid === false"><div style="display:contents"><dt>Integrity</dt><dd style="color:var(--high, #b3261e)">Signature does not verify: binary changed after signing</dd></div></template>
                <dt x-show="dos.team">Team ID</dt><dd class="mono" x-show="dos.team" x-text="dos.team"></dd>
                <dt x-show="dos.ident">Identifier</dt><dd class="mono" x-show="dos.ident" x-text="dos.ident"></dd>
                <template x-if="dos.app"><dt>Version</dt></template><template x-if="dos.app"><dd x-text="dos.app.version || '—'"></dd></template>
                <template x-if="dos.app"><dt>Installed from</dt></template><template x-if="dos.app"><dd x-text="({ identified_developer: 'identified developer', mac_app_store: 'Mac App Store', apple: 'Apple', unknown: 'unknown source' })[dos.app.obtainedFrom] || dos.app.obtainedFrom || '—'"></dd></template>
                <template x-if="dos.app && dos.app.signedBy.length"><dt>Certificate</dt></template><template x-if="dos.app && dos.app.signedBy.length"><dd x-text="dos.app.signedBy[0]"></dd></template>
                <dt>Executable</dt><dd class="mono" x-text="dos.path"></dd>
              </dl>
              <template x-if="dos.binaries.length > 1">
                <div>
                  <div class="dos-sub">Programs in this bundle</div>
                  <ul class="dos-list">
                    <template x-for="b in dos.binaries.slice(0, 12)" :key="b.path"><li><span class="mono" x-text="b.path.replace(dos.bundle + '/', '')"></span><span class="dos-meta" x-text="num(b.count) + '×'"></span></li></template>
                  </ul>
                </div>
              </template>
            </section>

            <section>
              <h2 class="dos-h">Who started it?</h2>
              <ul class="dos-list">
                <template x-for="p in dos.parents" :key="p.path"><li><a href="#" class="mono" @click.prevent="openDossier(p.path)" x-text="p.path"></a><span class="dos-meta" x-text="ago(p.at)"></span></li></template>
              </ul>
              <div class="ed-none" x-show="!dos.parents.length" x-text="dos.esSince ? 'No launch recorded since Endpoint Security monitoring began (' + fmt(dos.esSince) + '). It was probably already running.' : 'Endpoint Security monitoring is not installed.'"></div>
              <h2 class="dos-h mt-4">What did it start?</h2>
              <ul class="dos-list">
                <template x-for="c in dos.children.slice(0, 15)" :key="c.path"><li><a href="#" class="mono" @click.prevent="openDossier(c.path)" x-text="c.path"></a><span class="dos-meta" x-text="num(c.count) + '× · ' + ago(c.last_seen)"></span></li></template>
              </ul>
              <div class="ed-none" x-show="!dos.children.length">Nothing recorded.</div>
            </section>

            <section class="dos-wide">
              <h2 class="dos-h">Who does it talk to?</h2>
              <p class="dos-cap" x-text="dos.network.littleSnitch ? 'Little Snitch traffic over the last 7 days, largest first. Click a destination for its threat-intel record.' : (dos.network.sockets.length ? 'Open connections seen by lsof over the last 7 days (no byte counts without Little Snitch).' : 'No network activity recorded in the last 7 days.')"></p>
              <table class="dos-table" x-show="dos.network.littleSnitch">
                <thead><tr><th>Destination</th><th class="dos-barcol">Data</th><th class="text-end">Connections</th><th>Last</th></tr></thead>
                <tbody>
                  <template x-for="f in dos.network.flows.slice(0, 25)" :key="f.dest">
                    <tr :class="f.flag && 'is-flag'">
                      <td><a href="#" class="mono" @click.prevent="openIndicator(/^[\d.]+$|:/.test(f.dest) ? 'ip' : 'domain', f.dest)" x-text="f.dest"></a>
                        <span class="dos-flag" x-show="f.flag" x-text="f.flag ? f.flag.risk + (f.flag.why ? ': ' + f.flag.why : '') : ''"></span></td>
                      <td class="dos-barcol"><div class="dos-bar"><i :style="'width:' + dosBarPct(f) + '%'"></i><span x-text="bytes((f.bytes_in || 0) + (f.bytes_out || 0))"></span></div></td>
                      <td class="text-end" x-text="num(f.connects) + (f.denies ? ' · ' + num(f.denies) + ' denied' : '')"></td>
                      <td class="nowrap" x-text="ago(f.last_seen)"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
              <table class="dos-table" x-show="!dos.network.littleSnitch && dos.network.sockets.length">
                <thead><tr><th>Address</th><th>Ports</th><th>First</th><th>Last</th></tr></thead>
                <tbody>
                  <template x-for="s in dos.network.sockets.slice(0, 25)" :key="s.remote">
                    <tr :class="s.flag && 'is-flag'"><td><a href="#" class="mono" @click.prevent="openIndicator('ip', s.remote)" x-text="s.remote"></a> <span class="dos-flag" x-show="s.flag" x-text="s.flag ? s.flag.risk : ''"></span></td>
                      <td class="mono" x-text="s.ports"></td><td class="nowrap" x-text="fmt(s.first_seen)"></td><td class="nowrap" x-text="ago(s.last_seen)"></td></tr>
                  </template>
                </tbody>
              </table>
            </section>

            <section>
              <h2 class="dos-h">What can it access?</h2>
              <ul class="dos-list">
                <template x-for="(t, i) in dos.permissions" :key="i"><li><span :class="t.high && 'dos-strong'" x-text="t.name"></span><span class="dos-meta" x-text="t.auth + ' · ' + t.db + (t.modified ? ' · ' + fmt(t.modified) : '')"></span></li></template>
              </ul>
              <div class="ed-none" x-show="!dos.permissions.length">No privacy permissions on record.</div>
              <template x-if="dos.permissionEvents.length">
                <div><div class="dos-sub">Recent permission changes</div>
                  <ul class="dos-list"><template x-for="(e, i) in dos.permissionEvents.slice(0, 8)" :key="i"><li><span x-text="e.summary"></span><span class="dos-meta" x-text="fmt(e.ts)"></span></li></template></ul></div>
              </template>
            </section>

            <section>
              <h2 class="dos-h">Does it start itself?</h2>
              <ul class="dos-list">
                <template x-for="(b, i) in dos.persistence" :key="i"><li><span x-text="b.name + ' (' + (b.type || 'item') + ')'"></span><span class="dos-meta" :style="b.enabled ? 'color:' + sevColor('medium') : ''" x-text="b.enabled ? 'enabled' : 'disabled'"></span></li></template>
                <template x-for="(c, i) in dos.persistenceChanges" :key="'c' + i"><li><span x-text="c.change + ': ' + c.name"></span><span class="dos-meta" x-text="fmt(c.at)"></span></li></template>
              </ul>
              <div class="ed-none" x-show="!dos.persistence.length && !dos.persistenceChanges.length">No login items or launchd jobs.</div>
              <template x-if="dos.downloads.length">
                <div><div class="dos-sub">Files it downloaded</div>
                  <ul class="dos-list"><template x-for="(d, i) in dos.downloads.slice(0, 8)" :key="i"><li><span class="mono" x-text="d.host || d.url"></span><span class="dos-meta" x-text="fmt(d.ts)"></span></li></template></ul></div>
              </template>
            </section>

            <section class="dos-wide" x-show="dos.findings.length">
              <h2 class="dos-h">Findings that mention it</h2>
              <ol class="ed-list">
                <template x-for="(f, i) in dos.findings" :key="f.id">
                  <li @click="closeDossier(); fArea = f.area; fSev = ['high','medium','low','info']; setTab('findings'); openFinding = f.id">
                    <span class="ed-num" :style="'color:' + sevColor(f.sev)" x-text="String(i + 1).padStart(2, '0')"></span>
                    <span class="ed-area" :style="'color:' + areaColor(f.area)" x-text="f.area"></span>
                    <span class="ed-ftitle"><span x-text="plainTitle(f)"></span><span class="dos-meta" x-show="f.acked"> · acknowledged</span></span>
                  </li>
                </template>
              </ol>
            </section>

            <section class="dos-wide">
              <h2 class="dos-h">What has it done?</h2>
              <p class="dos-cap">Endpoint Security events and Sigma matches that name this program, newest first.</p>
              <ul class="dos-events">
                <template x-for="(e, i) in dos.events.slice(0, 60)" :key="i">
                  <li><span class="dos-when" x-text="fmt(e.ts)"></span><i class="ed-dot" :style="'background:' + sevColor(e.sev)"></i>
                    <span><b x-show="e.sigma" x-text="e.sigma ? 'Sigma: ' + e.sigma.title + ' · ' : ''"></b><span class="mono" x-text="e.summary"></span>
                      <a x-show="e.sigma && e.sigma.link" :href="e.sigma && e.sigma.link" target="_blank" rel="noopener" class="ms-1">rule</a></span></li>
                </template>
              </ul>
              <div class="ed-none" x-show="!dos.events.length">No notable events.</div>
            </section>
          </div>
          <footer class="ed-foot" x-text="'Argus dossier · ' + (dos.bundle ? 'covers every program inside ' + dos.bundle : dos.path)"></footer>
        </div>
      </template>
    </article>
  </div>
  <div class="modal modal-blur" :class="detail && 'd-block show'" tabindex="-1" x-show="detail" @keydown.escape.window="detail = null" @click.self="detail = null">
    <div class="modal-dialog modal-lg modal-dialog-scrollable" x-show="detail">
      <div class="modal-content" x-show="detail">
        <template x-if="detail">
          <div>
          <div class="modal-header">
            <h5 class="modal-title"><span class="mono" x-text="detail.value"></span> <span class="badge ms-2" :class="riskBadge(detail.risk)" x-text="detail.risk + (detail.risk_score ? ' ' + detail.risk_score : '')"></span></h5>
            <button type="button" class="btn-close" @click="detail = null"></button>
          </div>
          <div class="modal-body">
            <div class="small text-secondary mb-3" x-text="detail.type + (detail.owner ? ' · ' + detail.owner : '') + ' · sources: ' + detail.sources.join(', ') + ' · first ' + fmt(detail.first_seen) + ' · last ' + fmt(detail.last_seen) + ' · ' + detail.hits + ' hits'"></div>
            <div class="small mb-3" x-show="detail.context"><strong>Context:</strong> <span x-text="detail.context"></span></div>
            <div class="mb-3" x-show="detail.reasons.length"><strong class="small">Why it is flagged</strong>
              <ul class="small mb-0"><template x-for="x in detail.reasons" :key="x"><li x-text="x"></li></template></ul></div>
            <div class="mb-3" x-show="detail.crowdsec"><strong class="small">CrowdSec:</strong> <span class="small" x-text="detail.crowdsec ? detail.crowdsec.origin + ' · ' + detail.crowdsec.scenario + ' · ' + detail.crowdsec.type : ''"></span></div>
            <div class="mb-3" x-show="detail.feedHits.length"><strong class="small">Feed matches</strong>
              <ul class="small mb-0"><template x-for="f in detail.feedHits" :key="f.feed"><li x-text="f.name + (f.matched !== detail.value ? ' (via ' + f.matched + ')' : '') + (f.label ? ' — ' + f.label : '')"></li></template></ul></div>
            <table class="table table-sm">
              <thead><tr><th>Source</th><th>Verdict</th><th>Result</th><th>Checked</th></tr></thead>
              <tbody>
                <template x-for="e in detail.enrichments" :key="e.provider"><tr>
                  <td class="nowrap" x-text="e.name"></td><td><span class="badge" :class="riskBadge(e.verdict)" x-text="e.verdict"></span></td>
                  <td class="small"><span x-text="e.error || e.summary"></span> <a x-show="e.link" :href="e.link" target="_blank" rel="noopener noreferrer"><i class="ti ti-external-link"></i></a></td>
                  <td class="small nowrap" x-text="ago(e.fetched_at)"></td></tr></template>
                <tr x-show="detail.pending && detail.pending.length"><td colspan="4" class="small text-secondary" x-text="'Queued or not yet run: ' + detail.pending.join(', ')"></td></tr>
              </tbody>
            </table>
          </div>
          <div class="modal-footer">
            <span class="small text-secondary me-auto" x-show="detail.allowed" x-text="'On your allow list (' + detail.allowed + '): raises no findings.'"></span>
            <div class="btn-list me-auto" x-show="!detail.allowed">
              <button class="btn btn-sm" @click="addAllow(detail.value)" :title="'Never raise findings for ' + detail.value"><i class="ti ti-shield-check"></i> Allow <span x-text="detail.type === 'ip' ? 'this IP' : 'this domain'"></span></button>
              <button class="btn btn-sm" x-show="detail.owner" @click="addAllow(detail.owner.split(' ')[0], detail.owner)" :title="'Allow every address in ' + detail.owner"><span x-text="'Allow ' + (detail.owner || '').split(' ')[0]"></span></button>
              <button class="btn btn-sm" x-show="detail.type === 'domain' && detail.value.split('.').length > 2" @click="addAllow(detail.value.split('.').slice(-2).join('.'))" x-text="'Allow ' + detail.value.split('.').slice(-2).join('.')"></button>
            </div>
            <button class="btn" @click="lookupQ = detail.value; lookup()"><i class="ti ti-search"></i> Re-check all sources</button>
            <button class="btn btn-primary" @click="detail = null">Close</button>
          </div>
          </div>
        </template>
      </div>
    </div>
  </div>
  <div class="modal-backdrop fade show" x-show="detail"></div>
</div>

<script>
const CH = {};
function argus() {
  return {
    r: null, error: '', loading: false, theme: document.documentElement.getAttribute('data-bs-theme') || 'light',
    tab: 'overview', macTab: 'access', openFinding: null,
    fSev: ['high', 'medium', 'low'], fArea: '', fQ: '', fLimit: 100,
    ind: { total: 0, rows: [] }, iRisk: 'flagged', iType: '', iSource: '', iQ: '', iOffset: 0,
    allow: [], allowQ: '', allowNote: '', allowLoaded: false, moreOpen: false, detail: null, sg: null, sgQ: '', sgAll: false, dos: null, dosBusy: false, dosErr: '', findQ: '', findRes: [], findBusy: false, alertMsg: '', lookupQ: '', lookupBusy: false, lookupErr: '',
    hideCollector: true, showPassing: false, showAcked: false, ackNote: '', ackDays: 0, ackBusy: false, thirdPartyTcc: true, showScans: false,
    macTabs: [{ id: 'access', label: 'Access' }, { id: 'permissions', label: 'Permissions & Gatekeeper' }, { id: 'persistence', label: 'Persistence' },
      { id: 'network', label: 'Network' }, { id: 'crashes', label: 'Crashes' }, { id: 'system', label: 'System' }],
    get tabs() {
      const r = this.r;
      return [
        { id: 'overview', label: 'Overview', icon: 'ti-layout-dashboard' },
        { id: 'findings', label: 'Findings', icon: 'ti-list-check', badge: () => r && (r.counts.high + r.counts.medium) || '', badgeClass: () => r && r.counts.high ? 'bg-red-lt' : 'bg-orange-lt' },
        { id: 'indicators', label: 'Indicators', icon: 'ti-fingerprint', badge: () => r && (r.intel.flags ? r.intel.flags.high + r.intel.flags.medium : (r.intel.malicious || 0) + (r.intel.suspicious || 0)) || '', badgeClass: () => r && (r.intel.flags ? r.intel.flags.high : r.intel.malicious) ? 'bg-red-lt' : 'bg-orange-lt' },
        { id: 'crowdsec', more: true, label: 'CrowdSec', icon: 'ti-shield-half', badge: () => r && r.crowdsec.alerts.length || '' },
        { id: 'macos', label: 'macOS', icon: 'ti-device-laptop' },
        { id: 'endpoint', label: 'Endpoint', icon: 'ti-cpu', badge: () => r && r.hostsec && r.hostsec.es && r.hostsec.es.recent ? r.hostsec.es.recent.filter(e => e.sev === 'high').length || '' : '', badgeClass: () => 'bg-red-lt' },
        { id: 'vulns', label: 'Vulnerabilities', icon: 'ti-bug', badge: () => r && r.findings ? r.findings.filter(f => f.area === 'Vulnerabilities' && (f.sev === 'high' || f.sev === 'medium')).length || '' : '', badgeClass: () => 'bg-orange-lt' },
        { id: 'dns', more: true, label: 'DNS', icon: 'ti-world-search' },
        { id: 'syslog', more: true, label: 'Syslog', icon: 'ti-server-2', badge: () => r && r.syslog.hosts.length || '' },
        { id: 'sources', more: true, label: 'Sources & feeds', icon: 'ti-plug-connected' },
        { id: 'throughput', more: true, label: 'Throughput', icon: 'ti-activity' },
      ];
    },
    init() {
      try { const t = localStorage.getItem('argus-tab'); if (t) this.tab = t; } catch (e) {}
      this.load();
      setInterval(() => this.load(), 60000);
      this.$watch('macTab', () => this.$nextTick(() => this.charts()));
    },
    async load(fresh) {
      this.loading = true;
      try {
        const res = await fetch('/api/report' + (fresh ? '?fresh=1' : ''));
        if (res.status === 401) throw new Error('you are not signed in, or your sign-in has expired. Run ./argus.sh open on this Mac.');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        this.r = Object.freeze(await res.json());
        this.error = '';
        if (this.tab === 'indicators') this.loadIndicators();
        this.$nextTick(() => this.charts());
      } catch (e) { this.error = 'Could not load the report: ' + e.message; }
      this.loading = false;
    },
    setTab(t) {
      this.tab = t;
      try { localStorage.setItem('argus-tab', t); } catch (e) {}
      if (t === 'indicators') this.loadIndicators();
      this.$nextTick(() => this.charts());
    },
    async loadAllow() { try { this.allow = await (await fetch('/api/allow')).json(); } catch (e) { /* shown elsewhere */ } },
    async addAllow(entry, note) {
      try {
        const res = await fetch('/api/allow', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ entry, note: note || '' }) });
        const j = await res.json();
        if (!res.ok) throw new Error(j.error || ('HTTP ' + res.status));
        this.allowQ = ''; this.allowNote = '';
        if (this.detail) this.detail = Object.freeze({ ...this.detail, allowed: j.entry });
        await Promise.all([this.loadAllow(), this.loadIndicators(), this.load(true)]);
      } catch (e) { this.error = 'Could not add to the allow list: ' + e.message; }
    },
    async removeAllow(entry) {
      try { await fetch('/api/allow/remove', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ entry }) }); await Promise.all([this.loadAllow(), this.loadIndicators(), this.load(true)]); }
      catch (e) { this.error = 'Could not remove: ' + e.message; }
    },
    async loadIndicators() {
      const p = new URLSearchParams({ risk: this.iRisk, type: this.iType, source: this.iSource, q: this.iQ, limit: 200, offset: this.iOffset });
      try { this.ind = Object.freeze(await (await fetch('/api/indicators?' + p)).json()); } catch (e) { this.error = 'Could not load indicators: ' + e.message; }
      if (!this.allowLoaded) { this.allowLoaded = true; this.loadAllow(); }
    },
    async openIndicator(type, value) {
      try {
        const res = await fetch('/api/indicators/' + encodeURIComponent(type) + '/' + encodeURIComponent(value));
        if (res.status === 404) { this.lookupQ = value; return this.lookup(); }
        this.detail = Object.freeze(await res.json());
      } catch (e) { this.error = e.message; }
    },
    async lookup() {
      if (!this.lookupQ) return;
      this.lookupBusy = true; this.lookupErr = '';
      try {
        const res = await fetch('/api/lookup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ value: this.lookupQ }) });
        const j = await res.json();
        if (!res.ok) throw new Error(j.error || ('HTTP ' + res.status));
        this.detail = Object.freeze(j);
        if (this.tab === 'indicators') this.loadIndicators();
      } catch (e) { this.lookupErr = e.message; }
      this.lookupBusy = false;
    },
    async refreshFeeds() { await fetch('/api/feeds/refresh', { method: 'POST' }); setTimeout(() => this.load(true), 15000); },
    toggleTheme() {
      this.theme = this.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-bs-theme', this.theme);
      try { localStorage.setItem('argus-theme', this.theme); } catch (e) {}
      this.$nextTick(() => this.charts());
    },
    toggleSev(s) { this.fSev = this.fSev.includes(s) ? this.fSev.filter(x => x !== s) : [...this.fSev, s]; },
    areas() { return this.r ? [...new Set(this.r.findings.map(f => f.area))].sort() : []; },
    // ---------------------------------------------------------- editorial overview
    areaColor(a) {
      const dark = this.theme === 'dark';
      const P = {
        'Access': ['#c44536', '#ef7a6a'], 'Persistence': ['#3d5a80', '#7fa3d1'], 'Permissions': ['#2a8f84', '#5cc7b9'], 'Network': ['#d4892a', '#f0ae55'],
        'Endpoint Security': ['#5c8a46', '#93c27b'], 'Vulnerabilities': ['#8d4f9a', '#c18bd0'], 'Browser': ['#b5577a', '#e08aac'], 'Posture': ['#4f6d8a', '#8fb0cc'],
        'Gatekeeper': ['#7a3f8c', '#b884c9'], 'Devices': ['#8f6f45', '#c9a77a'], 'File integrity': ['#7f4f2e', '#c48d64'], 'Certificates': ['#3f7f7e', '#77bdbb'],
        'Downloads': ['#c0605a', '#e8948e'], 'Threat intel': ['#a63a2e', '#e0705f'], 'Crashes': ['#6e6e6e', '#a9a9a9'], 'System': ['#6b6457', '#a59d8f'],
        'Firewall': ['#d4892a', '#f0ae55'], 'Containers': ['#476f95', '#86aed4'], 'DNS': ['#3a7ca5', '#7cb6db'], 'CrowdSec': ['#2f6f73', '#6ab0b4'], 'Ollama': ['#6b6457', '#a59d8f'],
      };
      if (P[a]) return P[a][dark ? 1 : 0];
      let h = 0; for (const c of String(a)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
      return `hsl(${h % 360} 45% ${dark ? 65 : 42}%)`;
    },
    sevColor(s) { return `var(--sev-${s || 'info'})`; },
    esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]); },
    word(n) { return ['no', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'][n] || this.num(n); },
    Word(n) { const w = this.word(n); return w.charAt(0).toUpperCase() + w.slice(1); },
    // Operator-style finding titles for the overview. The Findings tab keeps the exact engine titles.
    plainTitle(f) {
      const t = String(f.title || '');
      const s = (n, a, b) => +n === 1 ? a : b;
      const rules = [
        [/^(\d+) apps? not updated since known-exploited/, n => `${n} ${s(n, 'app', 'apps')} unpatched against actively exploited CVEs`],
        [/^(\d+) installed apps? with known-exploited/, n => `${n} ${s(n, 'app', 'apps')} had exploited CVEs in the past year (since patched)`],
        [/^macOS (\S+) is missing fixes for (\d+)/, (v, n) => `macOS ${v} missing ${n} actively exploited ${s(n, 'fix', 'fixes')}`],
        [/^(\d+) enabled background items? without a Developer Team ID/, n => `${n} enabled login ${s(n, 'item', 'items')} with no Developer Team ID`],
        [/^Background items running from unusual locations/, () => `Login items running from non-standard paths`],
        [/^(\d+) new background items? registered/, n => `${n} new login ${s(n, 'item', 'items')} registered`],
        [/^(\d+) background items? added or enabled/, n => `${n} login ${s(n, 'item', 'items')} added or enabled`],
        [/^(\d+) background items? removed or disabled/, n => `${n} login ${s(n, 'item', 'items')} removed or disabled`],
        [/^(\d+) background-item registration/, n => `${n} login-item registration ${s(n, 'event', 'events')}`],
        [/^(\d+) third-party permissions? with high-impact access in use/, n => `${n} third-party ${s(n, 'app', 'apps')} holding sensitive privacy access`],
        [/^(\d+) high-impact permissions? granted \(live\)/, n => `${n} sensitive privacy ${s(n, 'grant', 'grants')}, last 24 h`],
        [/^(\d+) new high-impact grants? in TCC/, n => `${n} new sensitive privacy ${s(n, 'grant', 'grants')}, last 7 d`],
        [/^(\d+) third-party high-impact grants? on record/, n => `${n} third-party sensitive privacy ${s(n, 'grant', 'grants')} on record`],
        [/^High-impact permission held by a program in an unusual location/, () => `Sensitive privacy access held by a binary in a non-standard path`],
        [/^(\d+) services? listening beyond localhost/, n => `${n} ${s(n, 'service', 'services')} exposed beyond localhost`],
        [/^(\d+) unsigned or oddly located programs? with internet/, n => `${n} unsigned or misplaced ${s(n, 'binary', 'binaries')} with internet traffic`],
        [/^(\d+) newly seen programs? talking to the internet/, n => `${n} first-seen ${s(n, 'program', 'programs')} with internet traffic`],
        [/^(\d+) certificate changes? in the System keychain/, n => `${n} system certificate trust ${s(n, 'change', 'changes')}, last 7 d`],
        [/^(\d+) certificates? newly trusted as a root/, n => `${n} new trusted root ${s(n, 'certificate', 'certificates')}`],
        [/^Crashes from programs in unusual locations/, () => `Crashes from binaries in non-standard paths`],
        [/^(\d+) rejected sudo\/su attempts?/, n => `${n} failed sudo/su ${s(n, 'elevation', 'elevations')}`],
        [/^(\d+) failed (SSH )?authentications?(.*)/, (n, ssh, rest) => `${n} failed ${ssh ? 'SSH ' : ''}${s(n, 'login', 'logins')}${rest || ''}`],
        [/^(\d+) remote session sources?/, n => `Remote sessions from ${n} ${s(n, 'source', 'sources')}`],
        [/^(\d+) suspicious command lines? executed/, n => `${n} suspicious command ${s(n, 'line', 'lines')} executed`],
        [/^(\d+) programs? launched from unusual locations/, n => `${n} ${s(n, 'binary', 'binaries')} launched from non-standard paths`],
        [/^(\d+) Sigma rules? matched/, n => `${n} Sigma ${s(n, 'rule', 'rules')} matched`],
        [/^XProtect acted on malware \((\d+)/, n => `XProtect remediated malware (${n} ${s(n, 'event', 'events')})`],
        [/^(\d+) container images? with critical or exploited/, n => `${n} container ${s(n, 'image', 'images')} with critical or exploited CVEs`],
        [/^(\d+) Homebrew packages? with high\/critical/, n => `${n} Homebrew ${s(n, 'package', 'packages')} with high, critical or exploited CVEs`],
        [/^(\d+) sideloaded or unsigned browser extensions?/, n => `${n} sideloaded or unsigned browser ${s(n, 'extension', 'extensions')}`],
        [/^(\d+) new USB devices?/, n => `${n} new USB ${s(n, 'device', 'devices')}, last 7 d`],
        [/^(\d+) new Bluetooth devices?/, n => `${n} new Bluetooth ${s(n, 'device', 'devices')}, last 7 d`],
        [/^(\d+) new Wi-Fi networks?/, n => `${n} new Wi-Fi ${s(n, 'network', 'networks')}, last 7 d`],
      ];
      for (const [re, fn] of rules) { const m = t.match(re); if (m) return fn(...m.slice(1)); }
      return t.replace(/\s*\(live\)/, ', last 24 h').replace(/\s*\(last 7 days\)/, ', last 7 d').replace(/\s*\(24 h\)/, ', last 24 h')
        .replace(/\bhigh-impact\b/g, 'sensitive').replace(/\bunusual locations?\b/g, 'non-standard paths');
    },
    open() { return this.r ? this.r.findings.filter(f => !f.acked) : []; },
    areaStats() {

        const palette = ['azure', 'purple', 'teal', 'orange', 'green', 'pink'];
        this.draw('ch-tp', { type: 'bar', data: { labels: series.map(x => new Date(x.t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })),
          datasets: srcs.map((s, i) => ({ label: this.tpLabel(s) + ' (events / ' + tp.bucketMin + ' min)', data: series.map(x => x[s + ':e'] || 0), backgroundColor: col(palette[i % palette.length]), borderWidth: 0 })) }, options: stackOpts });
      }
      if (this.tab === 'dns' && this.r.dns) {
        const h = this.r.dns.byHour;
        this.draw('ch-dns', { type: 'bar', data: { labels: h.map(x => timeLabel(x.t)), datasets: [{ label: 'Queries', data: h.map(x => x.n), backgroundColor: col('azure'), borderWidth: 0 }] },
          options: { ...stackOpts, plugins: { legend: { display: false } } } });
      }
      if (this.tab === 'macos' && this.macTab === 'system') {
        const d = this.r.macos.system.power.days;
        this.draw('ch-power', { type: 'bar', data: { labels: d.map(x => x.day.slice(5)), datasets: [
          { label: 'Sleep', data: d.map(x => x.sleep), backgroundColor: col('secondary') }, { label: 'Wake', data: d.map(x => x.wake), backgroundColor: col('azure') }, { label: 'Dark wake', data: d.map(x => x.darkwake), backgroundColor: col('purple') }] },
          options: { responsive: true, maintainAspectRatio: false, animation: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10 } } }, scales: { y: { beginAtZero: true } } } });
      }
    },
  };
}
</script>
<script>
// OSINT providers table: click a header to sort, click again to reverse. Choice remembered per browser.
function provSort() {
  let saved = {}; try { saved = JSON.parse(localStorage.getItem('argus.provSort') || '{}'); } catch (e) { /* storage off */ }
  return {
    key: saved.key || 'mode', dir: saved.dir || 1,
    modeLabel(p) { return !p.enabled ? 'off (no key)' : p.auto ? (p.minPriority >= 3 ? 'auto: flagged only' : p.minPriority >= 2 ? 'auto: high priority' : 'auto') : 'manual lookups'; },
    modeRank(p) { return !p.enabled ? 4 : !p.auto ? 3 : p.minPriority >= 3 ? 2 : p.minPriority >= 2 ? 1 : 0; },
    val(p) {
      if (this.key === 'mode') return this.modeRank(p);
      if (this.key === 'today') return p.callsToday / Math.max(1, p.daily);
      if (this.key === 'status') return p.error ? 0 : p.enabled ? 1 : 2;   // errors first, then ok, then off
      return p.name.toLowerCase();
    },
    rows(list) {
      return [...(list || [])].sort((a, b) => { const x = this.val(a), y = this.val(b);
        return (x < y ? -1 : x > y ? 1 : a.name.localeCompare(b.name)) * (x === y ? 1 : this.dir); });
    },
    by(k) { this.dir = this.key === k ? -this.dir : (k === 'today' ? -1 : 1); this.key = k;
      try { localStorage.setItem('argus.provSort', JSON.stringify({ key: this.key, dir: this.dir })); } catch (e) { /* storage off */ } },
    arrow(k) { return this.key !== k ? 'ti-selector text-secondary' : this.dir > 0 ? 'ti-chevron-up' : 'ti-chevron-down'; },
  };
}
</script>
<style>th.sortable { cursor: pointer; user-select: none; white-space: nowrap; } th.sortable .ti { font-size: .85em; vertical-align: -1px; }</style>
