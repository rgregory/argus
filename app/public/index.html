<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Argus</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1/dist/css/tabler.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..700,0..100&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5/papaparse.min.js"></script>
<script>
  (function () {
    var t = null; try { t = localStorage.getItem('argus-theme'); } catch (e) {}
    if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-bs-theme', t);
  })();
</script>
<style>
  body { font-feature-settings: "tnum"; }
  .mono { font-family: var(--tblr-font-monospace); font-size: .8125rem; word-break: break-all; }
  /* Tabler's default <pre> text color nearly matches --tblr-bg-surface-secondary in this
     theme, so the evidence block was rendering real text invisibly (confirmed by
     select-all over the "blank" area turning up highlighted text). Pin the color
     explicitly instead of leaving it to inherit. */
  .evidence { white-space: pre-wrap; max-height: 22rem; overflow: auto; font-size: .78rem; background: var(--tblr-bg-surface-secondary); color: var(--tblr-body-color); border-radius: 4px; padding: .5rem .75rem; margin: .5rem 0 0; }
  .finding-row { cursor: pointer; }
  .finding-row:hover { background: var(--tblr-bg-surface-secondary); }
  .chart-box { position: relative; height: 260px; }
  .chart-box.sm { height: 180px; }
  .tab-badge { margin-left: .35rem; }
  .table-wrap { max-height: 32rem; overflow: auto; }
  .nowrap { white-space: nowrap; }
  .kpi { font-size: 1.6rem; font-weight: 600; line-height: 1.1; }
  .clickable { cursor: pointer; }
  [x-cloak] { display: none !important; }
  .navbar-nav .nav-link { padding-left: .6rem; padding-right: .6rem; }
  /* ===================================================================== editorial theme
     Paper and ink, serif small-caps headlines asked as questions, one colour per area. */
  :root, [data-bs-theme=light] {
    --paper: #f3eee3; --paper-2: #faf7f0; --ink: #2a2521; --ink-2: #5d544b; --muted: #8b8073; --rule: #ddd3c1;
    --sev-high: #b3261e; --sev-medium: #d77a1f; --sev-low: #a98c1c; --sev-info: #5f7a94;
    --ok: #6b8f71; --field: rgba(42,37,33,.045);
    --tblr-body-bg: var(--paper); --tblr-bg-surface: var(--paper-2); --tblr-bg-surface-secondary: #f0eadf; --tblr-bg-surface-tertiary: #ebe4d7;
    --tblr-body-color: var(--ink); --tblr-secondary-color: var(--muted); --tblr-border-color: var(--rule); --tblr-border-color-translucent: var(--rule);
    --tblr-card-bg: var(--paper-2);
  }
  [data-bs-theme=dark] {
    --paper: #16151a; --paper-2: #1d1c22; --ink: #ece5d8; --ink-2: #c3b9aa; --muted: #8f8679; --rule: #34312e;
    --sev-high: #ef6a5e; --sev-medium: #f0a04b; --sev-low: #d9bd4f; --sev-info: #8fb0cc; --ok: #8fb596; --field: rgba(236,229,216,.05);
    --tblr-body-bg: var(--paper); --tblr-bg-surface: var(--paper-2); --tblr-bg-surface-secondary: #232229; --tblr-bg-surface-tertiary: #29282f;
    --tblr-body-color: var(--ink); --tblr-secondary-color: var(--muted); --tblr-border-color: var(--rule); --tblr-border-color-translucent: var(--rule);
    --tblr-card-bg: var(--paper-2);
  }
  body { background: var(--paper); color: var(--ink); }
  .card { border: 1px solid var(--rule); box-shadow: none; border-radius: 10px; }
  .card-header { border-bottom-color: var(--rule); }
  .card-title, h3.card-title { font-family: 'Fraunces', Georgia, serif; font-variant: small-caps; letter-spacing: .03em; font-weight: 600; font-size: 1.05rem; }
  .navbar { background: var(--paper) !important; border-bottom: 1px solid var(--rule); }
  .navbar-brand span { font-family: 'Fraunces', Georgia, serif; font-weight: 600; letter-spacing: .02em; }
  .navbar-nav .nav-link { font-family: 'Source Serif 4', Georgia, serif; font-size: .95rem; color: var(--ink-2); }
  .navbar-nav .nav-item.active .nav-link, .navbar-nav .nav-link:hover { color: var(--ink); }
  .navbar-nav .nav-item.active .nav-link::after { border-color: var(--ink) !important; }
  .table thead th { font-family: 'Fraunces', Georgia, serif; font-variant: small-caps; text-transform: none; letter-spacing: .04em; font-size: .82rem; color: var(--muted); background: transparent; }
  .badge { font-weight: 600; letter-spacing: .02em; }

  .ed { max-width: 1120px; margin: 0 auto; padding: .5rem 0 3rem; }
  .ed-mast { text-align: center; padding: 1.25rem 0 .5rem; }
  .ed-kicker { font-family: 'Fraunces', Georgia, serif; font-variant: small-caps; letter-spacing: .12em; color: var(--muted); font-size: .95rem; }
  .ed-title { font-family: 'Fraunces', Georgia, serif; font-weight: 500; font-variant: small-caps; letter-spacing: .02em; font-size: clamp(2rem, 4.6vw, 3.4rem); line-height: 1.05; margin: .35rem 0 .9rem; font-variation-settings: "opsz" 144, "SOFT" 50; }
  .ed-lede { font-family: 'Source Serif 4', Georgia, serif; font-size: clamp(1.02rem, 1.5vw, 1.2rem); line-height: 1.6; color: var(--ink-2); max-width: 46rem; margin: 0 auto; }
  .ed-lede b, .ed-sub b, .ed-ptext b { font-weight: 700; color: var(--ink); }
  .ed-ornament { display: flex; align-items: center; gap: 1rem; justify-content: center; margin: 1.6rem auto .5rem; max-width: 30rem; color: var(--muted); }
  .ed-ornament span { flex: 1; height: 1px; background: var(--rule); }
  .ed-ornament i { font-size: 1.3rem; }
  .ed-sec { margin-top: 2.6rem; }
  .ed-h { font-family: 'Fraunces', Georgia, serif; font-variant: small-caps; font-weight: 600; letter-spacing: .03em; text-align: center; font-size: clamp(1.35rem, 2.4vw, 1.8rem); margin: 0; }
  .ed-sub { font-family: 'Source Serif 4', Georgia, serif; text-align: center; color: var(--ink-2); max-width: 44rem; margin: .35rem auto 1.4rem; font-size: 1.02rem; line-height: 1.55; }
  .ed-note { text-align: center; color: var(--muted); font-size: .9rem; }
  .ed-chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .ed-chart text { font-family: 'Source Serif 4', Georgia, serif; fill: var(--muted); }
  .ed-chart .lbl { fill: var(--ink-2); font-size: 11px; }
  .ed-chart .axis { stroke: var(--rule); }

  .ed-portraits { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1.4rem 1rem; }
  .ed-portrait { text-align: center; color: inherit; text-decoration: none; padding: .4rem; border-radius: 14px; transition: background .15s; }
  .ed-portrait:hover { background: var(--field); text-decoration: none; color: inherit; }
  .ed-ring { width: 128px; height: 128px; margin: 0 auto .4rem; }
  .ed-pname { font-family: 'Fraunces', Georgia, serif; font-variant: small-caps; font-weight: 700; font-size: 1.2rem; letter-spacing: .03em; line-height: 1.1; }
  .ed-ptext { font-family: 'Source Serif 4', Georgia, serif; font-size: .92rem; line-height: 1.45; color: var(--ink-2); margin: .3rem 0 0; }
  .ed-empty { grid-column: 1 / -1; text-align: center; color: var(--muted); font-family: 'Source Serif 4', Georgia, serif; }

  .ed-two { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; }
  .ed-two .ed-h, .ed-two .ed-sub { text-align: left; margin-left: 0; }
  @media (max-width: 900px) { .ed-two { grid-template-columns: 1fr; gap: 2rem; } }
  .ed-changes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; border-top: 2px solid var(--ink); padding-top: .6rem; }
  @media (max-width: 600px) { .ed-changes { grid-template-columns: 1fr; } }
  .ed-colhead { font-family: 'Fraunces', Georgia, serif; font-variant: small-caps; letter-spacing: .05em; color: var(--muted); margin-bottom: .35rem; }
  .ed-colhead b { color: var(--ink); font-size: 1.25rem; margin-left: .2rem; }
  .ed-change { display: flex; gap: .45rem; align-items: baseline; font-family: 'Source Serif 4', Georgia, serif; font-size: .92rem; line-height: 1.35; color: var(--ink); text-decoration: none; padding: .22rem 0; border-bottom: 1px dotted var(--rule); }
  .ed-change:hover { color: var(--ink); text-decoration: none; background: var(--field); }
  .ed-change.is-resolved span { text-decoration: line-through; color: var(--muted); }
  .ed-dot { display: inline-block; width: .55rem; height: .55rem; border-radius: 50%; flex: none; transform: translateY(-.05rem); }
  .ed-none { color: var(--muted); font-size: .88rem; font-style: italic; font-family: 'Source Serif 4', Georgia, serif; }
  .ed-link { display: inline-block; margin-top: .9rem; font-family: 'Fraunces', Georgia, serif; font-variant: small-caps; letter-spacing: .04em; color: var(--ink); border-bottom: 1px solid var(--ink); text-decoration: none; }
  .ed-link:hover { text-decoration: none; opacity: .75; color: var(--ink); }
  .ed-list { list-style: none; padding: 0; margin: 0; border-top: 2px solid var(--ink); }
  .ed-list li { display: grid; grid-template-columns: 2.4rem 9.5rem 1fr; gap: .6rem; align-items: baseline; padding: .55rem .2rem; border-bottom: 1px solid var(--rule); cursor: pointer; }
  .ed-list li:hover { background: var(--field); }
  .ed-num { font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 1.15rem; font-variant-numeric: lining-nums; }
  .ed-area { font-family: 'Fraunces', Georgia, serif; font-variant: small-caps; letter-spacing: .04em; font-weight: 600; font-size: .9rem; }
  .ed-ftitle { font-family: 'Source Serif 4', Georgia, serif; font-size: .98rem; line-height: 1.35; }
  @media (max-width: 600px) { .ed-list li { grid-template-columns: 2rem 1fr; } .ed-area { grid-column: 2; } .ed-ftitle { grid-column: 2; } }

  .ed-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 6px; }
  .ed-tile { padding: .7rem .8rem; border-radius: 8px; background: var(--field); border-left: 4px solid var(--muted); }
  .ed-tile.is-fail { background: color-mix(in srgb, var(--sev-high) 14%, transparent); border-left-color: var(--sev-high); }
  .ed-tile.is-warn { background: color-mix(in srgb, var(--sev-medium) 14%, transparent); border-left-color: var(--sev-medium); }
  .ed-tile.is-info { background: color-mix(in srgb, var(--sev-info) 12%, transparent); border-left-color: var(--sev-info); }
  .ed-tile.is-pass { background: color-mix(in srgb, var(--ok) 10%, transparent); border-left-color: var(--ok); opacity: .85; }
  .ed-tname { font-family: 'Fraunces', Georgia, serif; font-variant: small-caps; font-weight: 600; letter-spacing: .03em; }
  .ed-tval { font-size: .82rem; color: var(--ink-2); margin-top: .15rem; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .ed-foot { margin-top: 3rem; text-align: center; color: var(--muted); font-family: 'Fraunces', Georgia, serif; font-variant: small-caps; letter-spacing: .06em; font-size: .85rem; border-top: 1px solid var(--rule); padding-top: .9rem; }
  :root, [data-bs-theme=light] { --tblr-primary: #34445e; --tblr-primary-rgb: 52,68,94; --tblr-primary-fg: #faf7f0; }
  [data-bs-theme=dark] { --tblr-primary: #c9b991; --tblr-primary-rgb: 201,185,145; --tblr-primary-fg: #16151a; }
  .btn-primary, .btn-check:checked + .btn { background: var(--tblr-primary) !important; border-color: var(--tblr-primary) !important; color: var(--tblr-primary-fg) !important; }
  .subheader { font-family: 'Fraunces', Georgia, serif; font-variant: small-caps; text-transform: none; letter-spacing: .06em; font-size: .9rem; color: var(--muted); }
  .navbar-brand .ti { color: var(--ink); }
  .ed-ops { grid-template-columns: 1.7fr 1fr; }
  @media (max-width: 900px) { .ed-ops { grid-template-columns: 1fr; } }
  .ed-ops .ed-changes { grid-template-columns: 1fr; gap: .6rem; }
  .ed-sevline { display: block; font-family: 'Fraunces', Georgia, serif; font-variant: small-caps; letter-spacing: .04em; font-size: .9rem; color: var(--muted); margin-bottom: .15rem; }
  .ed-more { color: var(--muted); white-space: nowrap; }
  .ed-mast2 { display: grid; grid-template-columns: 280px 1fr; gap: 2.6rem; align-items: center; text-align: left; padding-top: 2rem; }
  .ed-mast2 .ed-title { text-align: left; }
  .ed-mast2 .ed-lede { margin: 0; max-width: 40rem; }
  .ed-clock svg { width: 280px; height: 280px; display: block; overflow: visible; }
  .ed-legend { display: flex; flex-wrap: wrap; gap: .3rem 1.1rem; margin-top: 1rem; font-family: 'Fraunces', Georgia, serif; font-variant: small-caps; letter-spacing: .04em; font-size: .85rem; color: var(--muted); }
  .ed-legend i { display: inline-block; width: .7rem; height: .7rem; border-radius: 2px; margin-right: .35rem; transform: translateY(.05rem); }
  @media (max-width: 760px) { .ed-mast2 { grid-template-columns: 1fr; justify-items: center; text-align: center; } .ed-mast2 .ed-title { text-align: center; } .ed-legend { justify-content: center; } }
  .ed-stats { display: grid; grid-template-columns: repeat(6, 1fr); border-top: 2px solid var(--ink); border-bottom: 1px solid var(--rule); margin: 2rem 0 .5rem; }
  .ed-stat { padding: .9rem .4rem .8rem; text-align: center; border-left: 1px solid var(--rule); }
  .ed-stat:first-of-type { border-left: 0; }
  a.ed-stat { display: block; color: inherit; text-decoration: none; cursor: pointer; transition: background .15s; }
  a.ed-stat:hover, a.ed-stat:focus-visible { background: var(--field); color: inherit; text-decoration: none; }
  a.ed-stat:hover .ed-stat-l { color: var(--ink); }
  .ed-stat-v { font-family: 'Fraunces', Georgia, serif; font-weight: 500; font-size: clamp(1.8rem, 3.6vw, 2.8rem); line-height: 1; font-variant-numeric: lining-nums; font-variation-settings: "opsz" 144; }
  .ed-stat-l { font-family: 'Fraunces', Georgia, serif; font-variant: small-caps; letter-spacing: .07em; color: var(--muted); font-size: .88rem; margin-top: .35rem; }
  .ed-stat-u { opacity: .75; }
  @media (max-width: 760px) { .ed-stats { grid-template-columns: repeat(3, 1fr); } .ed-stat:nth-of-type(4) { border-left: 0; } }
  .ed-normal-key { display: inline-block; width: 1.1rem !important; height: 0 !important; border-radius: 0 !important; border-top: 1.5px dashed var(--ink); margin-right: .4rem; transform: translateY(-.2rem) !important; background: none !important; }
  .ed-multiples { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1.2rem 1.6rem; margin-top: 1.4rem; border-top: 1px solid var(--rule); padding-top: 1rem; }
  .ed-mult { color: inherit; text-decoration: none; display: block; }
  .ed-mult:hover { text-decoration: none; color: inherit; background: var(--field); }
  .ed-mult-h { display: flex; justify-content: space-between; align-items: baseline; font-family: 'Fraunces', Georgia, serif; font-variant: small-caps; font-weight: 600; letter-spacing: .04em; }
  .ed-mult-h b { font-size: 1.5rem; font-weight: 500; color: var(--ink); font-variant-numeric: lining-nums; }
  .ed-mult-d { font-family: 'Source Serif 4', Georgia, serif; font-size: .82rem; color: var(--muted); }
  /* ---- stop-press health strip */
  .ed-stop { display: grid; grid-template-columns: auto 1fr auto; gap: .4rem 1.2rem; align-items: baseline; border-top: 3px solid var(--sev-high); border-bottom: 1px solid var(--rule); padding: .65rem .2rem; margin: 0 0 1.4rem; background: color-mix(in srgb, var(--sev-high) 6%, transparent); }
  .ed-stop.is-warn { border-top-color: var(--sev-medium); background: color-mix(in srgb, var(--sev-medium) 7%, transparent); }
  .ed-stop.is-grace { border-top-color: var(--muted); background: var(--field); }
  .ed-stop-k { font-family: 'Fraunces', Georgia, serif; font-variant: small-caps; font-weight: 700; letter-spacing: .1em; font-size: 1.05rem; color: var(--sev-high); padding-left: .4rem; }
  .ed-stop.is-warn .ed-stop-k { color: var(--sev-medium); } .ed-stop.is-grace .ed-stop-k { color: var(--muted); }
  .ed-stop-item { font-family: 'Source Serif 4', Georgia, serif; font-size: .95rem; line-height: 1.45; }
  .ed-stop-item code { display: inline-block; margin-left: .6rem; font-size: .78rem; background: transparent; color: var(--ink-2); padding: 0; }
  .ed-stop-item .when { color: var(--muted); }
  .ed-stop-x { font-family: 'Fraunces', Georgia, serif; font-variant: small-caps; letter-spacing: .05em; color: var(--ink); border-bottom: 1px solid var(--ink); text-decoration: none; padding-right: .4rem; }
  @media (max-width: 700px) { .ed-stop { grid-template-columns: 1fr; } }

  /* ---- program search */
  .ed-find { position: relative; display: flex; align-items: center; gap: .35rem; border-bottom: 1px solid var(--rule); margin-right: .6rem; color: var(--muted); }
  .ed-find input { border: 0; background: transparent; color: var(--ink); font-family: 'Source Serif 4', Georgia, serif; font-size: .95rem; width: 13rem; padding: .25rem 0; outline: none; }
  .ed-find input::placeholder { color: var(--muted); font-style: italic; }
  .ed-find-menu { position: absolute; top: 100%; right: 0; width: min(34rem, 90vw); max-height: 60vh; overflow: auto; background: var(--paper-2); border: 1px solid var(--rule); border-top: 2px solid var(--ink); z-index: 1100; box-shadow: 0 12px 30px rgba(0,0,0,.18); }
  .ed-find-menu a { display: block; padding: .45rem .7rem; border-bottom: 1px solid var(--rule); color: var(--ink); text-decoration: none; }
  .ed-find-menu a:hover { background: var(--field); }
  .ed-find-menu b { font-family: 'Fraunces', Georgia, serif; font-weight: 600; display: block; }
  .ed-find-menu .mono { color: var(--muted); font-size: .75rem; }
  .ed-plink { color: inherit; text-decoration: underline dotted; text-decoration-color: var(--muted); text-underline-offset: 3px; }
  .ed-plink:hover { text-decoration-color: currentColor; color: inherit; }
  .ed-chart [data-dossier] { cursor: pointer; }

  /* ---- dossier */
  .dos-wrap { position: fixed; inset: 0; z-index: 1040; overflow-y: auto; padding: 2.5rem 1rem 4rem; }
  .dos-backdrop { position: fixed; inset: 0; background: color-mix(in srgb, var(--ink) 38%, transparent); backdrop-filter: blur(2px); }
  .dos { position: relative; max-width: 1100px; margin: 0 auto; background: var(--paper); border: 1px solid var(--rule); border-top: 4px double var(--ink); padding: 1.6rem 2.2rem 1rem; box-shadow: 0 30px 80px rgba(0,0,0,.3); }
  .dos-close { position: absolute; top: .8rem; right: .9rem; border: 0; background: transparent; color: var(--muted); font-size: 1.3rem; }
  .dos-close:hover { color: var(--ink); }
  .dos-mast { text-align: center; padding: .4rem 0 .2rem; }
  .dos-title { font-family: 'Fraunces', Georgia, serif; font-weight: 500; font-variant: small-caps; letter-spacing: .02em; font-size: clamp(2rem, 4.4vw, 3.2rem); line-height: 1.05; margin: .3rem 0 .4rem; font-variation-settings: "opsz" 144; }
  .dos-path { font-family: var(--tblr-font-monospace); font-size: .8rem; color: var(--muted); word-break: break-all; }
  .dos-notes { display: flex; flex-wrap: wrap; justify-content: center; gap: .4rem .5rem; margin-top: .9rem; }
  .dos-note { font-family: 'Source Serif 4', Georgia, serif; font-size: .9rem; padding: .15rem .6rem; border: 1px solid var(--c); color: var(--c); border-radius: 999px; }
  .dos-note.is-ok { --c: var(--ok); }
  .dos-stats { margin-top: 1.4rem; }
  .dos-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.6rem 2.6rem; margin-top: 1.6rem; }
  .dos-wide { grid-column: 1 / -1; }
  @media (max-width: 800px) { .dos-grid { grid-template-columns: 1fr; } .dos { padding: 1.2rem 1rem; } }
  .dos-h { font-family: 'Fraunces', Georgia, serif; font-variant: small-caps; font-weight: 600; letter-spacing: .03em; font-size: 1.3rem; border-bottom: 2px solid var(--ink); padding-bottom: .25rem; margin: 0 0 .6rem; }
  .dos-sub { font-family: 'Fraunces', Georgia, serif; font-variant: small-caps; letter-spacing: .05em; color: var(--muted); margin: 1rem 0 .3rem; }
  .dos-cap { font-family: 'Source Serif 4', Georgia, serif; color: var(--ink-2); font-size: .92rem; margin: -.2rem 0 .6rem; }
  .dos-dl { display: grid; grid-template-columns: 8.5rem 1fr; gap: .3rem .8rem; margin: 0; font-family: 'Source Serif 4', Georgia, serif; }
  .dos-dl dt { font-family: 'Fraunces', Georgia, serif; font-variant: small-caps; letter-spacing: .04em; color: var(--muted); font-weight: 500; }
  .dos-dl dd { margin: 0; word-break: break-all; }
  .dos-list { list-style: none; padding: 0; margin: 0; }
  .dos-list li { display: flex; justify-content: space-between; gap: 1rem; align-items: baseline; padding: .3rem 0; border-bottom: 1px dotted var(--rule); font-family: 'Source Serif 4', Georgia, serif; font-size: .92rem; }
  .dos-list a { color: var(--ink); }
  .dos-meta { color: var(--muted); font-size: .82rem; white-space: nowrap; }
  .dos-strong { font-weight: 700; color: var(--sev-medium); }
  .dos-table { width: 100%; border-collapse: collapse; font-family: 'Source Serif 4', Georgia, serif; font-size: .9rem; }
  .dos-table th { font-family: 'Fraunces', Georgia, serif; font-variant: small-caps; letter-spacing: .04em; color: var(--muted); font-weight: 500; text-align: left; border-bottom: 1px solid var(--ink); padding: .3rem .4rem; }
  .dos-table td { border-bottom: 1px solid var(--rule); padding: .35rem .4rem; vertical-align: middle; }
  .dos-table a { color: var(--ink); }
  .dos-table tr.is-flag td { background: color-mix(in srgb, var(--sev-high) 9%, transparent); }
  .dos-flag { display: inline-block; margin-left: .4rem; color: var(--sev-high); font-size: .8rem; font-weight: 700; }
  .dos-barcol { width: 34%; }
  .dos-bar { position: relative; height: 1.15rem; }
  .dos-bar i { position: absolute; left: 0; top: .2rem; bottom: .2rem; background: color-mix(in srgb, var(--ink) 22%, transparent); border-right: 2px solid var(--ink); }
  .dos-bar span { position: relative; padding-left: .4rem; font-size: .82rem; font-variant-numeric: tabular-nums; }
  .dos-events { list-style: none; padding: 0; margin: 0; max-height: 26rem; overflow: auto; }
  .dos-events li { display: grid; grid-template-columns: 9.5rem .8rem 1fr; gap: .4rem; align-items: baseline; padding: .3rem 0; border-bottom: 1px dotted var(--rule); font-size: .85rem; }
  .dos-events .mono { word-break: break-word; }
  .dos-when { color: var(--muted); font-size: .8rem; white-space: nowrap; }
  body.dos-open { overflow: hidden; }
  .dos .ed-list { border-top: 0; }
  /* program cells: name first, path below, truncated from the left so the file name stays visible */
  .ed-prog { min-width: 13rem; max-width: 24rem; }
  .ed-prog-name { font-family: 'Fraunces', Georgia, serif; font-weight: 600; color: var(--ink); text-decoration: none; display: block; line-height: 1.2; }
  .ed-prog-name:hover { text-decoration: underline; color: var(--ink); }
  .ed-prog-path { font-family: var(--tblr-font-monospace); font-size: .72rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; max-width: 24rem; }
  .ed-prog-path bdi { direction: ltr; unicode-bidi: isolate; }
  .ed-hosts { max-width: 26rem; }
  .ed-hosts a { display: inline-block; margin: 0 .7rem .1rem 0; white-space: nowrap; }
  /* flagged table rows: tinted paper, readable in both themes */
  .table-danger, .table-warning, .table-info, .table-success { --tblr-table-color: var(--ink) !important; --tblr-table-border-color: var(--rule) !important; --tblr-table-striped-color: var(--ink) !important; --tblr-table-hover-color: var(--ink) !important; }
  .table-danger { --tblr-table-bg: color-mix(in srgb, var(--sev-high) 13%, var(--paper-2)) !important; --tblr-table-hover-bg: color-mix(in srgb, var(--sev-high) 18%, var(--paper-2)) !important; }
  .table-warning { --tblr-table-bg: color-mix(in srgb, var(--sev-medium) 13%, var(--paper-2)) !important; --tblr-table-hover-bg: color-mix(in srgb, var(--sev-medium) 18%, var(--paper-2)) !important; }
  .table-info { --tblr-table-bg: color-mix(in srgb, var(--sev-info) 12%, var(--paper-2)) !important; }
  .table-success { --tblr-table-bg: color-mix(in srgb, var(--ok) 12%, var(--paper-2)) !important; }
  .table-danger > td, .table-warning > td, .table-info > td, .table-success > td { color: var(--ink); }

  /* calmer overview */
  .ed-tabs { flex-wrap: nowrap !important; }
  .ed-tabs .tab-badge { font-size: .68rem; padding: .15em .45em; }
  .ed-more { position: relative; }
  .ed-more-menu { position: absolute; top: 100%; left: 0; z-index: 30; min-width: 13rem; background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.08); padding: .3rem; }
  .ed-more-menu a { display: flex; align-items: center; gap: .55rem; padding: .45rem .6rem; border-radius: 6px; color: var(--ink-2); text-decoration: none; font-family: 'Source Serif 4', Georgia, serif; }
  .ed-more-menu a:hover, .ed-more-menu a.is-on { background: var(--field); color: var(--ink); }
  .ed-mast2 { grid-template-columns: 210px 1fr; gap: 2.2rem; padding-top: 1.2rem; }
  .ed-clock svg { width: 210px; height: 210px; }
  .ed-mast2 .ed-title { font-size: clamp(1.7rem, 3.2vw, 2.5rem); margin: .25rem 0 .6rem; }
  .ed-kicker { font-size: .85rem; }
  .ed-context { margin: .7rem 0 0; color: var(--muted); font-size: .92rem; }
  .ed-keys { display: inline-flex; gap: 3px; margin-right: .55rem; vertical-align: middle; }
  .ed-keys i { width: .55rem; height: .55rem; border-radius: 2px; display: inline-block; }
  .ed-stats { grid-template-columns: repeat(3, 1fr); margin: 1.4rem 0 .2rem; }
  .ed-stat { padding: .6rem .4rem .55rem; }
  .ed-stat-v { font-size: clamp(1.6rem, 3vw, 2.2rem); }
  .ed-stat-l { font-family: 'Source Serif 4', Georgia, serif; font-variant: normal; letter-spacing: 0; font-size: .9rem; }
  .ed-sec { margin-top: 2rem; }
  .ed-pname { font-family: 'Source Serif 4', Georgia, serif; font-variant: normal; font-weight: 600; font-size: 1.05rem; letter-spacing: 0; color: var(--ink); }
  .ed-sevline { font-family: 'Source Serif 4', Georgia, serif; font-variant: normal; letter-spacing: 0; font-size: .88rem; }
  .ed-ring { width: 112px; height: 112px; }
  .ed .page-body, .page-body:has(.ed) { margin-top: .5rem; }
  .ed-ring > div, .ed-ring svg { width: 112px !important; height: 112px !important; }
  @media (max-width: 760px) { .ed-stats { grid-template-columns: repeat(3, 1fr); } .ed-tabs { flex-wrap: wrap !important; } }

  /* tighter */
  .ed-mast2 { grid-template-columns: 190px 1fr; gap: 2rem; padding-top: .3rem; }
  .ed-clock svg { width: 190px; height: 190px; }
  .ed-mast2 .ed-title { font-size: clamp(1.6rem, 2.9vw, 2.25rem); margin: .15rem 0 .45rem; }
  .ed-lede { font-size: clamp(1rem, 1.35vw, 1.1rem); line-height: 1.5; }
  .ed-context { margin-top: .45rem; font-size: .88rem; }
  .ed-stats { margin: .9rem 0 0; }
  .ed-stat { padding: .4rem .4rem .35rem; }
  .ed-stat-v { font-size: clamp(1.5rem, 2.6vw, 1.9rem); }
  .ed-stat-l { margin-top: .2rem; font-size: .85rem; }
  .ed-sec { margin-top: 1.5rem; }
  .ed-h { font-size: clamp(1.25rem, 2vw, 1.55rem); }
  .ed-sub { margin: .2rem auto .8rem; font-size: .96rem; line-height: 1.45; max-width: 46rem; }
  .ed-portraits { gap: 1rem .8rem; }
  .ed-ring, .ed-ring > div, .ed-ring svg { width: 100px !important; height: 100px !important; }
</style>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
</head>
<body>
<div class="page" x-data="argus()" x-init="init()" x-cloak>
  <!-- header -->
  <header class="navbar navbar-expand-md d-print-none">
    <div class="container-xl">
      <div class="navbar-brand pe-3">
        <i class="ti ti-eye text-primary me-2" style="font-size:1.4rem"></i><span>Argus</span>
      </div>
      <div class="d-none d-md-flex align-items-center gap-2 text-secondary small" x-show="r">
        <span class="badge bg-secondary-lt" x-text="r && r.host.name ? r.host.name : 'Mac'"></span>
        <span x-show="r && r.host.os" x-text="r ? 'macOS ' + r.host.os : ''"></span>
        <span>· updated <span x-text="r ? ago(r.generated) : ''"></span></span>
      </div>
      <div class="navbar-nav flex-row order-md-last ms-auto gap-1 align-items-center">
        <div class="ed-find d-none d-md-flex" x-show="r" @click.outside="findRes = []; findQ = ''">
          <i class="ti ti-search"></i>
          <input type="search" placeholder="Find a program" aria-label="Find a program" :value="findQ" @input.debounce.250ms="findPrograms($event.target.value)" @keydown.escape="findRes = []; findQ = ''; $event.target.value = ''">
          <div class="ed-find-menu" x-show="findQ.trim().length > 1">
            <template x-for="p in findRes" :key="p.path"><a href="#" @click.prevent="openDossier(p.path); findRes = []; findQ = ''"><b x-text="p.name"></b><span class="mono" x-text="p.path"></span></a></template>
            <div class="ed-none px-3 py-2" x-show="!findRes.length && !findBusy">No program by that name in launches, network or running programs.</div>
          </div>
        </div>
        <button class="btn btn-ghost-secondary btn-icon" title="Refresh now" @click="load(true)"><i class="ti ti-refresh" :class="loading && 'ti-spin'"></i></button>
        <button class="btn btn-ghost-secondary btn-icon" title="Toggle theme" @click="toggleTheme()"><i class="ti" :class="theme === 'dark' ? 'ti-sun' : 'ti-moon'"></i></button>
      </div>
    </div>
  </header>
  <div class="navbar-expand-md border-bottom">
    <div class="navbar navbar-light">
      <div class="container-xl">
        <ul class="navbar-nav flex-row flex-wrap ed-tabs">
          <template x-for="t in tabs.filter(t => !t.more)" :key="t.id">
            <li class="nav-item" :class="tab === t.id && 'active'">
              <a class="nav-link" href="#" @click.prevent="setTab(t.id)">
                <span class="nav-link-icon d-inline-block"><i class="ti" :class="t.icon"></i></span>
                <span class="nav-link-title" x-text="t.label"></span>
                <span class="badge tab-badge" :class="t.badgeClass ? t.badgeClass() : 'bg-secondary-lt'" x-show="t.badge && t.badge()" x-text="t.badge && t.badge()"></span>
              </a>
            </li>
          </template>
          <li class="nav-item ed-more" :class="tabs.some(t => t.more && t.id === tab) && 'active'" @click.outside="moreOpen = false">
            <a class="nav-link" href="#" @click.prevent="moreOpen = !moreOpen" :aria-expanded="moreOpen">
              <span class="nav-link-title" x-text="(tabs.find(t => t.more && t.id === tab) || { label: 'More' }).label"></span>
              <span class="badge tab-badge bg-secondary-lt" x-show="tabs.some(t => t.more && t.badge && t.badge())" x-text="tabs.filter(t => t.more && t.badge).reduce((a, t) => a + (+t.badge() || 0), 0) || ''"></span>
              <i class="ti ti-chevron-down ms-1"></i>
            </a>
            <div class="ed-more-menu" x-show="moreOpen" x-transition.opacity>
              <template x-for="t in tabs.filter(t => t.more)" :key="t.id">
                <a href="#" :class="tab === t.id && 'is-on'" @click.prevent="setTab(t.id); moreOpen = false">
                  <i class="ti" :class="t.icon"></i><span x-text="t.label"></span>
                  <span class="badge tab-badge bg-secondary-lt ms-auto" x-show="t.badge && t.badge()" x-text="t.badge && t.badge()"></span>
                </a>
              </template>
            </div>
          </li>
        </ul>
      </div>
    </div>
  </div>

  <div class="page-wrapper">
    <div class="page-body">
      <div class="container-xl">
        <div class="alert alert-danger" x-show="error" x-text="error"></div>
        <div class="ed-stop" x-show="r && healthBad().length" :class="r && r.health ? 'is-' + r.health.status + (r.health.grace ? ' is-grace' : '') : ''">
          <div class="ed-stop-k" x-text="r && r.health && r.health.grace ? 'Catching up' : (r && r.health && r.health.status === 'fail' ? 'Stop press' : 'Notice')"></div>
          <div>
            <template x-for="c in healthBad()" :key="c.id">
              <div class="ed-stop-item"><b x-text="c.title"></b><span class="when" x-show="c.since" x-text="' · noticed ' + fmt(c.since)"></span><code x-show="c.fix" x-text="c.fix"></code></div>
            </template>
            <div class="ed-stop-item when" x-show="r && r.health && r.health.grace">Argus just started or the Mac just woke; inputs usually catch up within ten minutes.</div>
          </div>
          <a href="#" class="ed-stop-x" @click.prevent="setTab('sources')">Pipeline health</a>
        </div>
        <div class="text-center py-6 text-secondary" x-show="!r && !error"><div class="spinner-border mb-3"></div><div>Loading report…</div></div>

        <template x-if="r">
        <div>

        <!-- ============================================================ OVERVIEW -->
        <div x-show="tab === 'overview'" class="ed">
          <!-- masthead -->
          <header class="ed-mast ed-mast2">
            <div class="ed-clock" x-html="clockSvg()" x-show="r.timeline.length"></div>
            <div class="ed-masttext">
              <div class="ed-kicker" x-text="'The Argus brief · ' + new Date(r.generated).toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' })"></div>
              <h1 class="ed-title">What has <span x-text="r.host.name || 'this Mac'"></span> been up&nbsp;to?</h1>
              <p class="ed-lede" x-html="lede()"></p>
              <p class="ed-context" x-html="mastContext()"></p>
            </div>
          </header>
          <div class="ed-stats">
            <template x-for="s in mastStats()" :key="s.label">
              <a href="#" class="ed-stat" :title="s.hint" @click.prevent="s.go()">
                <div class="ed-stat-v" :style="s.color ? 'color:' + s.color : ''" x-text="s.value"></div>
                <div class="ed-stat-l"><span x-text="s.label"></span> <span class="ed-stat-u" x-text="s.unit || ''"></span></div>
              </a>
            </template>
          </div>

          <!-- talkers -->
          <section class="ed-sec" x-show="talkers().length">
            <h2 class="ed-h">Who is the Mac talking to?</h2>
            <p class="ed-sub" x-html="talkersSub()"></p>
            <div class="ed-chart" x-html="talkersSvg()" @click="dosClick($event)"></div>
          </section>

          <!-- portraits -->
          <section class="ed-sec">
            <h2 class="ed-h">Where is the attention needed?</h2>
            <p class="ed-sub" x-html="portraitSub()"></p>
            <div class="ed-portraits">
              <template x-for="a in areaStats().slice(0, 6)" :key="a.area">
                <a href="#" class="ed-portrait" @click.prevent="fArea = a.area; fSev = ['high','medium','low','info']; setTab('findings')">
                  <div class="ed-ring" x-html="ringSvg(a)"></div>
                  <div class="ed-pname" x-text="a.area"></div>
                  <p class="ed-ptext" x-html="portraitText(a)"></p>
                </a>
              </template>
              <div class="ed-empty" x-show="!areaStats().length">Nothing open. Every finding is either resolved or acknowledged.</div>
            </div>
          </section>

          <!-- timeline -->
          <section class="ed-sec">
            <h2 class="ed-h">When did things happen?</h2>
            <p class="ed-sub" x-html="timelineSub()"></p>
            <div class="ed-chart" x-html="timelineSvg()"></div>
            <p class="ed-note" x-show="!r.timeline.length">No unified-log events yet. Install the host collector (<code>./argus.sh install-collector</code>) and give it five minutes.</p>
          </section>

          <!-- changes + attention list -->
          <section class="ed-sec ed-two ed-ops">
            <div>
              <h2 class="ed-h">What should you look at first?</h2>
              <p class="ed-sub">Open high and medium findings, by severity. Acknowledged findings drop off.</p>
              <ol class="ed-list">
                <template x-for="(f, i) in r.findings.filter(x => !x.acked && (x.sev === 'high' || x.sev === 'medium')).slice(0, 10)" :key="f.id">
                  <li @click="fArea = f.area; fSev = ['high','medium','low','info']; setTab('findings'); openFinding = f.id">
                    <span class="ed-num" :style="'color:' + sevColor(f.sev)" x-text="String(i + 1).padStart(2, '0')"></span>
                    <span class="ed-area" :style="'color:' + areaColor(f.area)" x-text="f.area"></span>
                    <span class="ed-ftitle" x-text="plainTitle(f)"></span>
                  </li>
                </template>
              </ol>
              <div class="ed-none" x-show="!r.findings.some(x => !x.acked && (x.sev === 'high' || x.sev === 'medium'))">No open high or medium findings.</div>
            </div>
            <div>
              <h2 class="ed-h">What changed since yesterday?</h2>
              <p class="ed-sub" x-html="changesSub()"></p>
              <div class="ed-changes" x-show="changesReady() && changesTotal()">
                <template x-for="col in [['new', 'New'], ['changed', 'Changed'], ['resolved', 'Resolved']]" :key="col[0]">
                  <div x-show="((r.changes && r.changes[col[0]]) || []).length">
                    <div class="ed-colhead"><span x-text="col[1]"></span> <b x-text="((r.changes && r.changes[col[0]]) || []).length"></b></div>
                    <template x-for="(c, i) in ((r.changes && r.changes[col[0]]) || []).slice(0, 8)" :key="i">
                      <a href="#" class="ed-change" :class="col[0] === 'resolved' && 'is-resolved'" @click.prevent="col[0] !== 'resolved' && (fQ = '', fArea = c.area, fSev = ['high','medium','low','info'], setTab('findings'), openFinding = c.id)">
                        <i class="ed-dot" :style="'background:' + sevColor(c.sev)"></i><span x-text="plainTitle(c)"></span>
                      </a>
                    </template>
                    <div class="ed-none" x-show="!((r.changes && r.changes[col[0]]) || []).length">None.</div>
                  </div>
                </template>
              </div>
              <div class="d-flex flex-wrap gap-3"><a class="ed-link" href="/api/digest" target="_blank" rel="noopener">Read today's digest →</a><a class="ed-link" href="/api/weekly" target="_blank" rel="noopener">This week's edition →</a></div>
            </div>
          </section>

          <!-- trends -->
          <section class="ed-sec">
            <h2 class="ed-h">Is it getting better?</h2>
            <p class="ed-sub" x-html="trendSub()"></p>
            <div class="ed-chart" x-html="trendSvg()"></div>
            <div class="ed-multiples" x-show="trendAreas().length">
              <template x-for="m in trendAreas()" :key="m.area">
                <a href="#" class="ed-mult" @click.prevent="fArea = m.area; fSev = ['high','medium','low','info']; setTab('findings')">
                  <div class="ed-mult-h"><span :style="'color:' + areaColor(m.area)" x-text="m.area"></span><b x-text="m.now"></b></div>
                  <div x-html="sparkSvg(m)"></div>
                  <div class="ed-mult-d" x-html="m.deltaHtml"></div>
                </a>
              </template>
            </div>
          </section>

          <!-- posture tiles -->
          <section class="ed-sec">
            <h2 class="ed-h">How is the Mac set up?</h2>
            <p class="ed-sub" x-html="postureSub()"></p>
            <div class="ed-tiles">
              <template x-for="p in r.posture.filter(p => p.status !== 'pass' || showPassing)" :key="p.control">
                <div class="ed-tile" :class="'is-' + p.status" :title="p.why || ''">
                  <div class="ed-tname" x-text="p.control"></div>
                  <div class="ed-tval" x-text="p.value"></div>
                </div>
              </template>
            </div>
            <a href="#" class="ed-link" x-show="r.posture.some(p => p.status === 'pass')" @click.prevent="showPassing = !showPassing" x-text="showPassing ? 'Hide the passing checks' : 'Show the ' + r.posture.filter(p => p.status === 'pass').length + ' passing checks'"></a>
            <p class="ed-note" x-show="!r.posture.length">Waiting for the first posture snapshot from the collector.</p>
          </section>

          <footer class="ed-foot" x-text="'Argus ' + r.version + ' · ' + num(tpTotal('events')) + ' events read in 24 h · ' + num(r.intel.total || 0) + ' indicators tracked · updated ' + ago(r.generated)"></footer>
        </div>

        <!-- ============================================================ FINDINGS -->
        <div x-show="tab === 'findings'">
          <div class="card">
            <div class="card-header flex-wrap gap-2">
              <div class="btn-group" role="group">
                <template x-for="s in ['high','medium','low','info']" :key="s">
                  <button class="btn btn-sm" :class="fSev.includes(s) ? 'btn-primary' : ''" @click="toggleSev(s)" x-text="s + ' (' + r.counts[s] + ')'"></button>
                </template>
              </div>
              <select class="form-select form-select-sm w-auto" x-model="fArea">
                <option value="">All areas</option>
                <template x-for="a in areas()" :key="a"><option :value="a" x-text="a"></option></template>
              </select>
              <input class="form-control form-control-sm w-auto flex-fill" placeholder="Search findings and evidence" x-model.debounce.250ms="fQ">
              <label class="form-check form-switch m-0" x-show="ackedCount()"><input class="form-check-input" type="checkbox" x-model="showAcked"><span class="form-check-label small" x-text="'Show acknowledged (' + ackedCount() + ')'"></span></label>
              <div class="ms-auto btn-list">
                <span x-show="unackedShown().length"><select class="form-select form-select-sm w-auto d-inline-block" x-model.number="ackDays" @click.stop title="How long to hide it"><option :value="0">until it changes</option><option :value="7">for 7 days</option><option :value="30">for 30 days</option><option :value="90">for 90 days</option></select></span>
                <button class="btn btn-sm" x-show="unackedShown().length" :disabled="ackBusy" @click="ackAll()" :title="'Acknowledge every finding the filters are showing'"><i class="ti ti-checks"></i> <span x-text="'Acknowledge all (' + unackedShown().length + ')'"></span></button>
                <button class="btn btn-sm" @click="csv('argus-findings', filteredFindings().map(f => ({id: f.id, severity: f.sev, area: f.area, title: f.title, count: f.count, detail: f.detail, evidence: f.evidence.join(' | ')})))"><i class="ti ti-download"></i> CSV</button>
              </div>
            </div>
            <div class="list-group list-group-flush">
              <template x-for="f in filteredFindings().slice(0, fLimit)" :key="f.id">
                <div class="list-group-item finding-row" @click="openFinding = openFinding === f.id ? null : f.id">
                  <div class="d-flex gap-2 align-items-center flex-wrap">
                    <span class="badge" :class="sevBadge(f.sev)" x-text="f.sev"></span>
                    <span class="badge bg-secondary-lt" x-text="f.area"></span>
                    <span class="flex-fill" :class="f.acked && 'text-secondary'" x-text="f.title"></span>
                    <span class="badge bg-secondary-lt" x-show="f.acked">acknowledged</span>
                    <span class="badge bg-orange-lt" x-show="f.ackChanged" title="You acknowledged this earlier; something new has appeared in its evidence">changed since acknowledged</span>
                    <span class="badge bg-orange-lt" x-show="f.ackExpired" :title="f.ackExpired ? 'Acknowledged ' + fmt(f.ackExpired.at) + (f.ackExpired.note ? ' (' + f.ackExpired.note + ')' : '') + '; that ran out ' + fmt(f.ackExpired.until) : ''">acknowledgement expired</span>

                    <div class="text-secondary small mt-2" x-show="f.detail" x-text="f.detail"></div>

                      </template>
                    </div>
                    <div class="small text-secondary mt-1" x-show="f.ackChanged" x-text="f.ackChanged ? 'Acknowledged ' + fmt(f.ackChanged.at) + (f.ackChanged.note ? ' (' + f.ackChanged.note + ')' : '') + '; acknowledge again to hide the new state.' : ''"></div>

            </div>
          </div>
          <div class="card">

                <option value="flagged">Flagged (malicious + suspicious)</option><option value="malicious">Malicious</option><option value="suspicious">Suspicious</option>
                <option value="clean">Clean</option><option value="unknown">Not yet rated</option><option value="">All</option>
              </select>
              <select class="form-select form-select-sm w-auto" x-model="iType" @change="iOffset = 0; loadIndicators()">
                <option value="">IPs and domains</option><option value="ip">IPs</option><option value="domain">Domains</option>
              </select>
              <select class="form-select form-select-sm w-auto" x-model="iSource" @change="iOffset = 0; loadIndicators()">
                <option value="">Any source</option><option value="connection">Active connections</option><option value="dns">DNS (Pi-hole)</option><option value="dns-heuristic">DNS heuristics</option>
                <option value="ssh">SSH</option><option value="firewall">Firewall</option><option value="syslog">Syslog</option><option value="resolved">Resolved</option><option value="manual">Manual lookups</option>

              </div>
            </div>
            <div class="table-responsive table-wrap">
              <table class="table table-vcenter card-table table-sm">

                      <td><span class="badge" :class="riskBadge(o.risk)" x-text="o.risk + (o.risk_score ? ' ' + o.risk_score : '')"></span></td>

            </div>
            <div class="card-footer d-flex align-items-center">

            </div>
          </div>

                <tbody><template x-for="(t, i) in r.macos.network.tcp" :key="i">

            <div class="col-lg-6"><div class="card">

          <!-- crashes -->

              <thead><tr><th>When</th><th>App</th><th>Kind</th><th>Exception / detail</th><th>Path</th></tr></thead>

                <tr><td class="small nowrap" x-text="fmt(c.ts)"></td><td x-text="c.app"></td><td><span class="badge" :class="c.kind === 'Kernel panic' ? 'bg-red-lt' : 'bg-secondary-lt'" x-text="c.kind"></span></td>
                  <td class="small" x-text="[c.exception, c.detail].filter(Boolean).join(' — ')"></td><td class="mono small" x-text="c.procPath"></td></tr>
              </template>
              <tr x-show="!r.macos.crashes.length"><td colspan="5" class="text-secondary">No reports in the last 14 days.</td></tr></tbody></table></div>
          </div>

          <!-- system -->
          <div x-show="macTab === 'system'" class="row row-cards">
            <div class="col-lg-6"><div class="card">
              <div class="card-header"><h3 class="card-title">Fault-heavy processes</h3><div class="card-actions small text-secondary" x-text="num(r.macos.system.faultCount) + ' faults'"></div></div>
              <div class="table-responsive table-wrap"><table class="table table-sm card-table"><thead><tr><th>Process</th><th>Subsystem</th><th class="text-end">Faults</th></tr></thead>
                <tbody><template x-for="(f, i) in r.macos.system.faults.slice(0, 60)" :key="i"><tr :title="f.sample"><td x-text="f.proc"></td><td class="small mono" x-text="f.sub"></td><td class="text-end" x-text="num(f.count)"></td></tr></template></tbody></table></div></div></div>
            <div class="col-lg-6"><div class="card">
              <div class="card-header"><h3 class="card-title">Sleep and wake</h3></div>
              <div class="card-body"><div class="chart-box sm"><canvas id="ch-power"></canvas></div>
                <div class="small mt-2"><template x-for="x in r.macos.system.power.reasons.slice(0, 8)" :key="x.key"><div><span x-text="x.key"></span> <span class="text-secondary" x-text="'×' + x.count"></span></div></template></div></div></div></div>
            <div class="col-lg-6"><div class="card">
              <div class="card-header"><h3 class="card-title">Installs and updates</h3></div>
              <div class="table-responsive table-wrap"><table class="table table-sm card-table"><thead><tr><th>When</th><th>Name</th><th>Version</th></tr></thead>
                <tbody><template x-for="(u, i) in r.macos.system.installs.slice(0, 200)" :key="i"><tr><td class="small nowrap" x-text="fmt(u.ts)"></td><td x-text="u.name"></td><td class="small" x-text="u.version"></td></tr></template></tbody></table></div></div></div>
            <div class="col-lg-6"><div class="card">
              <div class="card-header"><h3 class="card-title">Containers</h3></div>
              <div class="table-responsive"><table class="table table-sm card-table"><thead><tr><th>Container</th><th>State</th><th class="text-end">Log lines</th><th class="text-end">Errors</th></tr></thead>
                <tbody><template x-for="(c, i) in containerRows()" :key="i"><tr :title="c.sample"><td x-text="c.name"></td><td class="small" x-text="c.state"></td><td class="text-end" x-text="c.lines"></td><td class="text-end" :class="c.errors > 20 && 'text-orange'" x-text="c.errors"></td></tr></template></tbody></table></div></div></div>
            <div class="col-12" x-show="r.macos.ollama"><div class="card">
              <div class="card-header"><h3 class="card-title">Ollama API</h3></div>
              <div class="card-body small" x-show="r.macos.ollama"><div x-text="r.macos.ollama ? num(r.macos.ollama.requests) + ' requests' : ''"></div>
                <template x-for="c in (r.macos.ollama ? r.macos.ollama.clients : [])" :key="c.key"><span class="badge me-1" :class="c.scope === 'loopback' ? 'bg-green-lt' : 'bg-orange-lt'" x-text="c.key + ' ×' + c.count"></span></template></div></div></div>
          </div>
        </div>

        <!-- ============================================================ DNS -->
        <div x-show="tab === 'dns'">
          <div class="card" x-show="!r.dns"><div class="card-body">
            <h3>No DNS data yet</h3>
            <p class="text-secondary mb-0">Set <code>PIHOLE_URL</code> and <code>PIHOLE_PASSWORD</code> (an app password) in <code>argus.env</code>, or let the host collector copy the Pi-hole query log. Every queried domain is checked against threat feeds; new domains get an RDAP age check.</p>
          </div></div>
          <template x-if="r.dns"><div>
            <div class="alert alert-warning" x-show="r.inputs.pihole.error" x-text="'Pi-hole: ' + r.inputs.pihole.error"></div>
            <div class="row row-cards mb-3">
              <div class="col-6 col-md-3"><div class="card card-sm"><div class="card-body"><div class="small text-secondary text-uppercase">Queries</div><div class="kpi" x-text="num(r.dns.queries)"></div></div></div></div>
              <div class="col-6 col-md-3"><div class="card card-sm"><div class="card-body"><div class="small text-secondary text-uppercase">Blocked</div><div class="kpi" x-text="r.dns.queries ? (100 * r.dns.blocked / r.dns.queries).toFixed(1) + '%' : '—'"></div></div></div></div>
              <div class="col-6 col-md-3"><div class="card card-sm"><div class="card-body"><div class="small text-secondary text-uppercase">Unique domains</div><div class="kpi" x-text="num(r.dns.unique)"></div></div></div></div>
              <div class="col-6 col-md-3"><div class="card card-sm"><div class="card-body"><div class="small text-secondary text-uppercase">Suspicious names</div><div class="kpi" :class="r.dns.suspicious.length && 'text-orange'" x-text="num(r.dns.suspicious.length)"></div></div></div></div>
            </div>
            <div class="card mb-3"><div class="card-header"><h3 class="card-title">Queries per hour</h3></div><div class="card-body"><div class="chart-box sm"><canvas id="ch-dns"></canvas></div></div></div>
            <div class="row row-cards">
              <div class="col-lg-6"><div class="card"><div class="card-header"><h3 class="card-title">Suspicious-looking names</h3></div>
                <div class="table-responsive table-wrap"><table class="table table-sm card-table"><thead><tr><th>Domain</th><th>Why</th><th class="text-end">Queries</th></tr></thead>
                  <tbody><template x-for="(s, i) in r.dns.suspicious.slice(0, 200)" :key="i"><tr class="clickable" @click="!s.domain.startsWith('*') && openIndicator('domain', s.domain)"><td class="mono small" x-text="s.domain"></td><td class="small" x-text="s.reasons"></td><td class="text-end" x-text="s.queries"></td></tr></template>
                  <tr x-show="!r.dns.suspicious.length"><td colspan="3" class="text-secondary">Nothing stands out.</td></tr></tbody></table></div></div></div>
              <div class="col-lg-6"><div class="card"><div class="card-header"><h3 class="card-title">Top registered domains</h3></div>
                <div class="table-responsive table-wrap"><table class="table table-sm card-table"><tbody><template x-for="d in r.dns.topBases" :key="d.key"><tr><td class="mono small" x-text="d.key"></td><td class="text-end" x-text="num(d.count)"></td></tr></template></tbody></table></div></div></div>
              <div class="col-lg-6"><div class="card"><div class="card-header"><h3 class="card-title">Top blocked</h3></div>
                <div class="table-responsive table-wrap"><table class="table table-sm card-table"><tbody><template x-for="d in r.dns.topBlocked" :key="d.key"><tr><td class="mono small" x-text="d.key"></td><td class="text-end" x-text="num(d.count)"></td></tr></template></tbody></table></div></div></div>
              <div class="col-lg-6"><div class="card"><div class="card-header"><h3 class="card-title">Clients</h3></div>
                <div class="table-responsive table-wrap"><table class="table table-sm card-table"><tbody><template x-for="d in r.dns.clients" :key="d.key"><tr><td class="mono small" x-text="d.key"></td><td class="text-end" x-text="num(d.count)"></td></tr></template></tbody></table></div></div></div>
            </div>
          </div></template>
        </div>

        <!-- ============================================================ SYSLOG -->
        <div x-show="tab === 'syslog'">
          <div class="card mb-3" x-show="!r.syslog.enabled"><div class="card-body text-secondary">The syslog listener is off. Set <code>ARGUS_SYSLOG=1</code> in <code>argus.env</code> and run <code>./argus.sh up</code>.</div></div>
          <div class="row row-cards" x-show="r.syslog.enabled">
            <div class="col-lg-5"><div class="card">
              <div class="card-header"><h3 class="card-title">Senders</h3></div>
              <div class="table-responsive"><table class="table table-sm card-table"><thead><tr><th>Host</th><th>Address</th><th class="text-end">Messages</th><th>Last</th></tr></thead>
                <tbody><template x-for="h in r.syslog.hosts" :key="h.host"><tr :title="Object.keys(h.programs || {}).join(', ')"><td x-text="h.host"></td><td class="mono small" x-text="h.src"></td><td class="text-end" x-text="num(h.messages)"></td><td class="small nowrap" x-text="ago(h.last)"></td></tr></template>
                <tr x-show="!r.syslog.hosts.length"><td colspan="4" class="text-secondary">Nothing received yet.</td></tr></tbody></table></div>
              <div class="card-body small text-secondary border-top">
                Point devices at this Mac: UDP <code x-text="syslogHint('udp')"></code>, TCP <code x-text="syslogHint('tcp')"></code> (RFC 3164 / BSD syslog, one message per line).
                Test from the Mac: <code>./argus.sh syslog-test</code>
              </div></div></div>
            <div class="col-lg-7"><div class="card">
              <div class="card-header"><h3 class="card-title">Recent messages</h3></div>
              <div class="table-responsive table-wrap"><table class="table table-sm card-table"><tbody>
                <template x-for="(m, i) in r.syslog.recent" :key="i"><tr><td class="small nowrap" x-text="fmt(m.ts)"></td><td class="small" x-text="m.host"></td><td class="small" x-text="m.prog"></td><td class="small mono" x-text="m.msg"></td></tr></template>
              </tbody></table></div></div></div>
          </div>
        </div>

        <!-- ============================================================ ENDPOINT -->
        <div x-show="tab === 'endpoint'">
          <template x-if="!r.hostsec"><div class="alert alert-info">No endpoint telemetry in this report yet.</div></template>
          <template x-if="r.hostsec">
          <div class="row row-cards">
            <div class="col-12"><div class="row row-cards">
              <div class="col-sm-6 col-lg-3"><div class="card card-sm"><div class="card-body">
                <div class="subheader">Endpoint Security</div>
                <div class="h2 mb-0" x-text="r.hostsec.es && r.hostsec.es.active ? num(r.hostsec.es.events) + ' events' : 'not active'"></div>
                <div class="small text-secondary" x-text="r.hostsec.es && r.hostsec.es.active ? 'last chunk ' + ago(r.hostsec.es.lastFileAt) + ' · collecting since ' + fmt(r.hostsec.es.since) : 'run ./argus.sh install-telemetry and grant Full Disk Access to /usr/bin/eslogger'"></div></div></div></div>
              <div class="col-sm-6 col-lg-3"><div class="card card-sm"><div class="card-body">
                <div class="subheader">Third-party binaries (window)</div>
                <div class="h2 mb-0" x-text="r.hostsec.es && r.hostsec.es.active ? num(r.hostsec.es.thirdParty) : '—'"></div>
                <div class="small text-secondary" x-text="r.hostsec.es && r.hostsec.es.active ? num(r.hostsec.es.noTeam) + ' without a Team ID · ' + (r.hostsec.es.baselineDone ? num(r.hostsec.es.newBinaries.length) + ' first seen' : 'building 24 h baseline') : ''"></div></div></div></div>
              <div class="col-sm-6 col-lg-3"><div class="card card-sm"><div class="card-body">
                <div class="subheader">TCC.db</div>
                <div class="h2 mb-0" x-text="r.hostsec.tccDb && r.hostsec.tccDb.available ? num(r.hostsec.tccDb.thirdParty.length) + ' high-impact' : 'no data'"></div>
                <div class="small text-secondary" x-text="r.hostsec.tccDb && r.hostsec.tccDb.available ? num(r.hostsec.tccDb.granted) + ' grants in ' + (r.hostsec.tccDb.system ? 'system' : '') + (r.hostsec.tccDb.system && r.hostsec.tccDb.user ? ' + ' : '') + (r.hostsec.tccDb.user ? 'user' : '') + ' DB' : 'grant Full Disk Access to /usr/bin/sqlite3'"></div></div></div></div>
              <div class="col-sm-6 col-lg-3"><div class="card card-sm"><div class="card-body">
                <div class="subheader">Downloads (30 days)</div>
                <div class="h2 mb-0" x-text="r.hostsec.downloads && r.hostsec.downloads.available ? num(r.hostsec.downloads.total) : 'no data'"></div>
                <div class="small text-secondary" x-text="r.hostsec.downloads && r.hostsec.downloads.available ? num(r.hostsec.downloads.hosts.length) + ' source hosts (checked against threat intel)' : 'waits for the user collector'"></div></div></div></div>
            </div></div>

            <div class="col-12" x-show="r.hostsec.es && r.hostsec.es.active"><div class="card">
              <div class="card-header"><h3 class="card-title">Notable Endpoint Security events</h3>
                <div class="card-actions small text-secondary" x-text="(r.hostsec.es.eventKinds || []).map(k => k.kind + ' ' + k.n).join(' · ')"></div></div>
              <div class="table-responsive table-wrap"><table class="table table-sm card-table">
                <thead><tr><th>When</th><th>Event</th><th>Severity</th><th>Detail</th></tr></thead>
                <tbody>
                  <template x-for="(e, i) in (r.hostsec.es.recent || []).slice(0, 300)" :key="i"><tr><td class="small nowrap" x-text="fmt(e.ts)"></td><td class="small mono" x-text="e.kind"></td>
                    <td><span class="badge" :class="sevBadge(e.sev)" x-text="e.sev"></span></td><td class="small mono text-break" x-text="e.summary"></td></tr></template>
                  <tr x-show="!(r.hostsec.es.recent || []).length"><td colspan="4" class="text-secondary">Nothing notable in the window.</td></tr>
                </tbody></table></div></div></div>

            <div class="col-lg-6" x-show="r.hostsec.es && r.hostsec.es.active"><div class="card">
              <div class="card-header"><h3 class="card-title">First-seen third-party programs</h3></div>
              <div class="table-responsive table-wrap"><table class="table table-sm card-table">
                <thead><tr><th>First run</th><th>Program</th><th>Signer</th><th>Parent</th></tr></thead>
                <tbody>
                  <template x-for="(b, i) in (r.hostsec.es.newBinaries || [])" :key="i"><tr><td class="small nowrap" x-text="fmt(b.first_seen)"></td><td class="ed-prog"><a href="#" class="ed-prog-name" @click.prevent="openDossier(b.path)" x-text="progName(b.path)"></a><div class="ed-prog-path" :title="b.path"><bdi x-text="b.path"></bdi></div></td>
                    <td class="small"><span class="badge" :class="b.team ? 'bg-green-lt' : 'bg-orange-lt'" x-text="b.team || (b.adhoc ? 'ad-hoc' : 'no Team ID')"></span></td><td class="small mono text-break" x-text="b.last_parent"></td></tr></template>
                  <tr x-show="!(r.hostsec.es.newBinaries || []).length"><td colspan="4" class="text-secondary" x-text="r.hostsec.es.baselineDone ? 'None in the window.' : 'Learning what normally runs here (first 24 h).'"></td></tr>
                </tbody></table></div></div></div>
            <div class="col-lg-6" x-show="r.hostsec.es && r.hostsec.es.active"><div class="card">
              <div class="card-header"><h3 class="card-title">Most-run third-party programs</h3></div>
              <div class="table-responsive table-wrap"><table class="table table-sm card-table">
                <thead><tr><th>Program</th><th>Signer</th><th class="text-end">Runs</th><th>Last</th></tr></thead>
                <tbody><template x-for="(b, i) in (r.hostsec.es.topThirdParty || []).slice(0, 150)" :key="i"><tr><td class="ed-prog"><a href="#" class="ed-prog-name" @click.prevent="openDossier(b.path)" x-text="progName(b.path)"></a><div class="ed-prog-path" :title="b.path"><bdi x-text="b.path"></bdi></div></td>
                  <td class="small" x-text="b.team || (b.adhoc ? 'ad-hoc' : 'no Team ID')"></td><td class="text-end" x-text="num(b.count)"></td><td class="small nowrap" x-text="ago(b.last_seen)"></td></tr></template></tbody></table></div></div></div>

            <div class="col-lg-6"><div class="card">
              <div class="card-header"><h3 class="card-title">High-impact grants (TCC.db)</h3></div>
              <div class="table-responsive table-wrap"><table class="table table-sm card-table">
                <thead><tr><th>Permission</th><th>Client</th><th>DB</th><th>Modified</th></tr></thead>

                  <template x-for="(t, i) in ((r.hostsec.tccDb && r.hostsec.tccDb.thirdParty) || [])" :key="i"><tr :class="t.recent && 'table-warning'"><td x-text="t.serviceName"></td>
                    <td class="small mono text-break"><span x-text="t.client"></span> <span class="badge bg-secondary-lt" x-show="t.ours">Argus</span> <span class="badge bg-orange-lt" x-show="t.recent">new</span></td><td class="small" x-text="t.db"></td><td class="small nowrap" x-text="t.modified ? fmt(t.modified) : ''"></td></tr></template>
                  <tr x-show="!(r.hostsec.tccDb && r.hostsec.tccDb.available)"><td colspan="4" class="text-secondary">No TCC.db snapshot yet (needs ./argus.sh install-telemetry and Full Disk Access for /usr/bin/sqlite3).</td></tr>
                </tbody></table></div></div></div>
            <div class="col-lg-6"><div class="card">
              <div class="card-header"><h3 class="card-title">Background item changes</h3><div class="card-actions small text-secondary" x-show="r.hostsec.btmDiff && r.hostsec.btmDiff.available" x-text="num(r.hostsec.btmDiff.items) + ' third-party items · baseline ' + fmt(r.hostsec.btmDiff.baselineAt)"></div></div>
              <div class="table-responsive table-wrap"><table class="table table-sm card-table">
                <thead><tr><th>When</th><th>Change</th><th>Item</th><th>Executable</th></tr></thead>
                <tbody>
                  <template x-for="(c, i) in ((r.hostsec.btmDiff && r.hostsec.btmDiff.changes) || [])" :key="i"><tr><td class="small nowrap" x-text="fmt(c.at)"></td>
                    <td><span class="badge" :class="c.change === 'added' || c.change === 'enabled' ? 'bg-orange-lt' : 'bg-secondary-lt'" x-text="c.change"></span></td>
                    <td class="small"><span x-text="c.name"></span> <span class="text-secondary" x-text="c.type"></span></td><td class="small mono text-break" x-text="c.exe"></td></tr></template>
                  <tr x-show="!((r.hostsec.btmDiff && r.hostsec.btmDiff.changes) || []).length"><td colspan="4" class="text-secondary">No changes since the baseline snapshot.</td></tr>
                </tbody></table></div></div></div>

            <div class="col-12" x-show="r.hostsec.littlesnitch && r.hostsec.littlesnitch.available"><div class="card">
              <div class="card-header"><h3 class="card-title">Little Snitch traffic (24 h)</h3>
                <div class="card-actions small text-secondary" x-show="r.hostsec.littlesnitch && r.hostsec.littlesnitch.totals" x-text="r.hostsec.littlesnitch ? num(r.hostsec.littlesnitch.totals.progs) + ' programs · ' + num(r.hostsec.littlesnitch.totals.c) + ' connections · ' + num(r.hostsec.littlesnitch.totals.d) + ' denied · ↑ ' + bytes(r.hostsec.littlesnitch.totals.bo) + ' ↓ ' + bytes(r.hostsec.littlesnitch.totals.bi) + ' · updated ' + ago(r.hostsec.littlesnitch.lastAt) : ''"></div></div>
              <div class="table-responsive table-wrap"><table class="table table-sm card-table">
                <thead><tr><th>Program</th><th>Destinations</th><th class="text-end">Remotes</th><th class="text-end">Conns</th><th class="text-end">Denied</th><th class="text-end">Sent</th><th class="text-end">Received</th><th>Last</th></tr></thead>
                <tbody><template x-for="(p, i) in ((r.hostsec.littlesnitch && r.hostsec.littlesnitch.programs) || []).slice(0, 200)" :key="i"><tr>
                  <td class="ed-prog"><a href="#" class="ed-prog-name" @click.prevent="openDossier(p.path)" x-text="progName(p.path)"></a><div class="ed-prog-path" :title="p.path"><bdi x-text="p.path"></bdi></div></td>
                  <td class="small ed-hosts"><template x-for="(h, j) in p.hosts.slice(0, 4)" :key="j"><a href="#" @click.prevent="openIndicator('domain', h)" x-text="h"></a></template><span class="text-secondary" x-show="p.hosts.length > 4" x-text="'+' + (p.hosts.length - 4)"></span></td>
                  <td class="text-end" x-text="num(p.remotes)"></td><td class="text-end" x-text="num(p.connects)"></td><td class="text-end" :class="p.denies && 'text-orange'" x-text="num(p.denies)"></td>
                  <td class="text-end nowrap" x-text="bytes(p.bytes_out)"></td><td class="text-end nowrap" x-text="bytes(p.bytes_in)"></td><td class="small nowrap" x-text="ago(p.last)"></td></tr></template></tbody></table></div></div></div>

            <div class="col-12" x-show="r.hostsec.dnsAttribution && r.hostsec.dnsAttribution.available && r.hostsec.dnsAttribution.rows.length"><div class="card">

                  <td class="text-end" x-text="im.error ? '—' : (im.counts.CRITICAL || 0)"></td><td class="text-end" x-text="im.error ? '—' : (im.counts.HIGH || 0)"></td>
                  <td class="text-end" x-text="im.error ? '—' : im.fixable"></td><td class="text-end" x-text="im.error ? '—' : im.kev"></td>
                  <td class="small"><span x-show="im.error" class="text-red" x-text="im.error"></span><template x-for="(v, j) in (im.top || []).slice(0, 4)" :key="j"><span class="badge me-1 mb-1" :class="v.kev ? 'bg-red text-red-fg' : v.severity === 'CRITICAL' ? 'bg-red-lt' : 'bg-orange-lt'" :title="v.pkg + ' ' + v.version + (v.fix ? ' → ' + v.fix : '')" x-text="v.id"></span></template></td>
                  <td class="small nowrap" x-text="ago(im.scanned)"></td></tr></template></tbody></table></div></div></div>

            <div class="col-12" x-show="(r.vulns.pendingUpdates || []).length"><div class="card">

            <div class="col-12"><div class="card"><div class="card-body small text-secondary">
              Data: CISA KEV <span x-text="r.vulns.kev && r.vulns.kev.updated ? '(' + num(r.vulns.kev.count) + ' entries, ' + ago(r.vulns.kev.updated) + ')' : (r.vulns.kev && r.vulns.kev.error ? '— ' + r.vulns.kev.error : '— not fetched yet')"></span> ·
              Apple security releases <span x-text="r.vulns.apple && r.vulns.apple.updated ? '(' + ago(r.vulns.apple.updated) + ')' : (r.vulns.apple && r.vulns.apple.error ? '— ' + r.vulns.apple.error : '— not fetched yet')"></span> ·
              OSV.dev <span x-text="r.vulns.osv && r.vulns.osv.updated ? '(' + ago(r.vulns.osv.updated) + ')' : (r.vulns.osv && r.vulns.osv.error ? '— ' + r.vulns.osv.error : '— only used when brew vulns is unavailable')"></span>.
              App matching is by product name and by when the app bundle last changed on disk, so treat "likely unpatched" as a prompt to check the app's version, not proof.
            </div></div></div>
          </div>
          </template>
        </div>

        <!-- ============================================================ SOURCES -->
        <div x-show="tab === 'sources'" class="row row-cards">
          <div class="col-lg-6"><div class="card">
