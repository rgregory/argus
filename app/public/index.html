<script>
const CH = {};
function argus() {
  return {
    r: null, error: '', loading: false, theme: document.documentElement.getAttribute('data-bs-theme') || 'light',
    tab: 'overview', macTab: 'access', openFinding: null,
    fSev: ['high', 'medium', 'low'], fArea: '', fQ: '', fLimit: 100,
    ind: { total: 0, rows: [] }, iRisk: 'flagged', iType: '', iSource: '', iQ: '', iOffset: 0,
    detail: null, lookupQ: '', lookupBusy: false, lookupErr: '',
    hideCollector: true, showPassing: false, showAcked: false, ackNote: '', ackBusy: false, thirdPartyTcc: true, showScans: false,
    macTabs: [{ id: 'access', label: 'Access' }, { id: 'permissions', label: 'Permissions & Gatekeeper' }, { id: 'persistence', label: 'Persistence' },
      { id: 'network', label: 'Network' }, { id: 'crashes', label: 'Crashes' }, { id: 'system', label: 'System' }],
    get tabs() {
      const r = this.r;
      return [
        { id: 'overview', label: 'Overview', icon: 'ti-layout-dashboard' },
        { id: 'findings', label: 'Findings', icon: 'ti-list-check', badge: () => r && (r.counts.high + r.counts.medium) || '', badgeClass: () => r && r.counts.high ? 'bg-red-lt' : 'bg-orange-lt' },
        { id: 'indicators', label: 'Indicators', icon: 'ti-fingerprint', badge: () => r && ((r.intel.malicious || 0) + (r.intel.suspicious || 0)) || '', badgeClass: () => r && r.intel.malicious ? 'bg-red-lt' : 'bg-orange-lt' },
        { id: 'crowdsec', label: 'CrowdSec', icon: 'ti-shield-half', badge: () => r && r.crowdsec.alerts.length || '' },
        { id: 'macos', label: 'macOS', icon: 'ti-device-laptop' },
        { id: 'endpoint', label: 'Endpoint', icon: 'ti-cpu', badge: () => r && r.hostsec && r.hostsec.es && r.hostsec.es.recent ? r.hostsec.es.recent.filter(e => e.sev === 'high').length || '' : '', badgeClass: () => 'bg-red-lt' },
        { id: 'vulns', label: 'Vulnerabilities', icon: 'ti-bug', badge: () => r && r.findings ? r.findings.filter(f => f.area === 'Vulnerabilities' && (f.sev === 'high' || f.sev === 'medium')).length || '' : '', badgeClass: () => 'bg-orange-lt' },
        { id: 'dns', label: 'DNS', icon: 'ti-world-search' },
        { id: 'syslog', label: 'Syslog', icon: 'ti-server-2', badge: () => r && r.syslog.hosts.length || '' },
        { id: 'sources', label: 'Sources & feeds', icon: 'ti-plug-connected' },
        { id: 'throughput', label: 'Throughput', icon: 'ti-activity' },
      ];
    },
    init() {
      try { const t = localStorage.getItem('argus-tab'); if (t) this.tab = t; } catch (e) {}
      this.load();
      setInterval(() => this.load(), 60000);
      this.$watch('macTab', () => this.$nextTick(() => this.charts()));
    },
    async load(fresh) {
      this.loading = true;
      try {
        const res = await fetch('/api/report' + (fresh ? '?fresh=1' : ''));
        if (res.status === 401) throw new Error('you are not signed in, or your sign-in has expired. Run ./argus.sh open on this Mac.');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        this.r = Object.freeze(await res.json());
        this.error = '';
        if (this.tab === 'indicators') this.loadIndicators();
        this.$nextTick(() => this.charts());
      } catch (e) { this.error = 'Could not load the report: ' + e.message; }
      this.loading = false;
    },
    setTab(t) {
      this.tab = t;
      try { localStorage.setItem('argus-tab', t); } catch (e) {}
      if (t === 'indicators') this.loadIndicators();
      this.$nextTick(() => this.charts());
    },
    async loadIndicators() {
      const p = new URLSearchParams({ risk: this.iRisk, type: this.iType, source: this.iSource, q: this.iQ, limit: 200, offset: this.iOffset });
      try { this.ind = Object.freeze(await (await fetch('/api/indicators?' + p)).json()); } catch (e) { this.error = 'Could not load indicators: ' + e.message; }
    },
    async openIndicator(type, value) {
      try {
        const res = await fetch('/api/indicators/' + encodeURIComponent(type) + '/' + encodeURIComponent(value));
        if (res.status === 404) { this.lookupQ = value; return this.lookup(); }
        this.detail = Object.freeze(await res.json());
      } catch (e) { this.error = e.message; }
    },
    async lookup() {
      if (!this.lookupQ) return;
      this.lookupBusy = true; this.lookupErr = '';
      try {
        const res = await fetch('/api/lookup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ value: this.lookupQ }) });
        const j = await res.json();
        if (!res.ok) throw new Error(j.error || ('HTTP ' + res.status));
        this.detail = Object.freeze(j);
        if (this.tab === 'indicators') this.loadIndicators();
      } catch (e) { this.lookupErr = e.message; }
      this.lookupBusy = false;
    },
    async refreshFeeds() { await fetch('/api/feeds/refresh', { method: 'POST' }); setTimeout(() => this.load(true), 15000); },
    toggleTheme() {
      this.theme = this.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-bs-theme', this.theme);
      try { localStorage.setItem('argus-theme', this.theme); } catch (e) {}
      this.$nextTick(() => this.charts());
    },
    toggleSev(s) { this.fSev = this.fSev.includes(s) ? this.fSev.filter(x => x !== s) : [...this.fSev, s]; },
    areas() { return this.r ? [...new Set(this.r.findings.map(f => f.area))].sort() : []; },
    // ---------------------------------------------------------- editorial overview
    areaColor(a) {
      const dark = this.theme === 'dark';
      const P = {
        'Access': ['#c44536', '#ef7a6a'], 'Persistence': ['#3d5a80', '#7fa3d1'], 'Permissions': ['#2a8f84', '#5cc7b9'], 'Network': ['#d4892a', '#f0ae55'],
        'Endpoint Security': ['#5c8a46', '#93c27b'], 'Vulnerabilities': ['#8d4f9a', '#c18bd0'], 'Browser': ['#b5577a', '#e08aac'], 'Posture': ['#4f6d8a', '#8fb0cc'],
        'Gatekeeper': ['#7a3f8c', '#b884c9'], 'Devices': ['#8f6f45', '#c9a77a'], 'File integrity': ['#7f4f2e', '#c48d64'], 'Certificates': ['#3f7f7e', '#77bdbb'],
        'Downloads': ['#c0605a', '#e8948e'], 'Threat intel': ['#a63a2e', '#e0705f'], 'Crashes': ['#6e6e6e', '#a9a9a9'], 'System': ['#6b6457', '#a59d8f'],
        'Firewall': ['#d4892a', '#f0ae55'], 'Containers': ['#476f95', '#86aed4'], 'DNS': ['#3a7ca5', '#7cb6db'], 'CrowdSec': ['#2f6f73', '#6ab0b4'], 'Ollama': ['#6b6457', '#a59d8f'],
      };
      if (P[a]) return P[a][dark ? 1 : 0];
      let h = 0; for (const c of String(a)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
      return `hsl(${h % 360} 45% ${dark ? 65 : 42}%)`;
    },
    sevColor(s) { return `var(--sev-${s || 'info'})`; },
    esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]); },
    open() { return this.r ? this.r.findings.filter(f => !f.acked) : []; },
    areaStats() {
      const m = new Map(), w = { high: 9, medium: 3, low: 1, info: 0 };
      for (const f of this.open()) {
        const a = m.get(f.area) || { area: f.area, n: 0, high: 0, medium: 0, low: 0, info: 0, score: 0, top: null };
        a.n++; a[f.sev]++; a.score += w[f.sev];
        if (!a.top || w[f.sev] > w[a.top.sev]) a.top = f;
        m.set(f.area, a);
      }
      return [...m.values()].filter(a => a.score > 0).sort((x, y) => y.score - x.score);
    },
    lede() {
      if (!this.r) return '';
      const c = this.r.counts, e = this.esc, n = v => `<b>${this.num(v)}</b>`, col = (s, v) => `<b style="color:${this.sevColor(s)}">${this.num(v)}</b>`;
      const ev = this.tpTotal('events'), flagged = (this.r.intel.malicious || 0) + (this.r.intel.suspicious || 0);
      const os = this.r.vulns && this.r.vulns.macos;
      const parts = [`In the last 24 hours Argus read ${n(ev)} events (${e(this.bytes(this.tpTotal('bytes')))}) from <b>${e(this.r.host.name || 'this Mac')}</b> and your network.`];
      if (c.high || c.medium) parts.push(`${c.high ? col('high', c.high) + ` finding${c.high === 1 ? ' needs' : 's need'} action` : 'Nothing needs urgent action'}${c.medium ? `, and ${col('medium', c.medium)} deserve${c.medium === 1 ? 's' : ''} a look` : ''}.`);
      else parts.push('Nothing high or medium is open.');
      parts.push(`Of ${n(this.r.intel.total || 0)} addresses and domains checked against threat intelligence, ${flagged ? col('high', flagged) + ' were flagged' : '<b>none</b> were flagged'}.`);
      if (os && os.installed) parts.push(os.behind && os.behind.length ? `macOS ${e(os.installed)} is ${col('high', os.behind.length)} security release${os.behind.length === 1 ? '' : 's'} behind.` : `macOS ${e(os.installed)} is current.`);
      if (this.r.findingState && this.r.findingState.acked) parts.push(`${n(this.r.findingState.acked)} acknowledged finding${this.r.findingState.acked === 1 ? ' is' : 's are'} set aside.`);
      return parts.join(' ');
    },
    portraitSub() {
      const a = this.areaStats();
      if (!a.length) return 'Nothing open needs attention.';
      const share = Math.round(100 * a[0].n / Math.max(1, this.open().filter(f => f.sev !== 'info').length));
      return `<b style="color:${this.areaColor(a[0].area)}">${this.esc(a[0].area)}</b> carries the most weight right now. Each ring is that area's share of the open findings, coloured by how severe they are.`;
    },
    portraitText(a) {
      const bits = [];
      if (a.high) bits.push(`<b style="color:${this.sevColor('high')}">${a.high}</b> high`);
      if (a.medium) bits.push(`<b style="color:${this.sevColor('medium')}">${a.medium}</b> medium`);
      if (a.low) bits.push(`<b>${a.low}</b> low`);
      return `${bits.join(', ')}. ${this.esc(a.top.title)}.`;
    },
    ringSvg(a) {
      const total = Math.max(1, this.open().length), r = 52, C = 2 * Math.PI * r, col = this.areaColor(a.area);
      let off = 0; const segs = [];
      for (const s of ['high', 'medium', 'low', 'info']) {
        if (!a[s]) continue;
        const len = C * a[s] / total;
        segs.push(`<circle cx="64" cy="64" r="${r}" fill="none" stroke="${this.sevColor(s)}" stroke-width="12" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 64 64)" stroke-linecap="butt"/>`);
        off += len;
      }
      const icon = { 'Access': 'ti-key', 'Persistence': 'ti-repeat', 'Permissions': 'ti-lock-access', 'Network': 'ti-world', 'Endpoint Security': 'ti-cpu', 'Vulnerabilities': 'ti-bug',
        'Browser': 'ti-browser', 'Posture': 'ti-shield-half', 'Gatekeeper': 'ti-shield-lock', 'Devices': 'ti-usb', 'File integrity': 'ti-file-diff', 'Certificates': 'ti-certificate',
        'Downloads': 'ti-download', 'Threat intel': 'ti-fingerprint', 'Crashes': 'ti-bolt', 'System': 'ti-settings', 'Containers': 'ti-box', 'DNS': 'ti-world-search' }[a.area] || 'ti-point';
      return `<div style="position:relative;width:128px;height:128px"><svg viewBox="0 0 128 128" width="128" height="128"><circle cx="64" cy="64" r="${r}" fill="none" stroke="var(--rule)" stroke-width="12"/>${segs.join('')}<circle cx="64" cy="64" r="40" fill="${col}" opacity=".13"/></svg>`
        + `<i class="ti ${icon}" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2.4rem;color:${col}"></i>`
        + `<div style="position:absolute;right:2px;top:2px;font:700 1rem Fraunces,Georgia,serif;color:var(--ink)">${a.n}</div></div>`;
    },
    tlCats() {
      return [['auth', 'access and logins', 'Access'], ['gatekeeper', 'Gatekeeper and XProtect', 'Gatekeeper'], ['tcc', 'privacy permissions', 'Permissions'], ['firewall', 'firewall', 'Firewall'], ['background', 'login items', 'Persistence']];
    },
    timelineSub() {
      const tl = (this.r && this.r.timeline) || [];
      if (!tl.length) return 'Security-relevant events from the unified log, hour by hour.';
      const cats = this.tlCats(), tot = x => cats.reduce((a, [k]) => a + (x[k] || 0), 0);
      const peak = tl.reduce((a, x) => tot(x) > tot(a) ? x : a, tl[0]);
      const dom = cats.map(([k, l, a]) => [l, a, peak[k] || 0]).sort((x, y) => y[2] - x[2])[0];
      const legend = cats.map(([, l, a]) => `<b style="color:${this.areaColor(a)}">${l}</b>`).join(', ');
      return `Security events from the unified log, hour by hour: ${legend}. The busiest hour was <b>${new Date(peak.t).toLocaleString([], { weekday: 'short', hour: 'numeric' })}</b> with <b>${tot(peak)}</b> events, mostly <b style="color:${this.areaColor(dom[1])}">${dom[0]}</b>.`;
    },
    timelineSvg() {
      const tl = (this.r && this.r.timeline) || [];
      if (!tl.length) return '';
      const cats = this.tlCats(), W = 1100, H = 300, top = 18, base = 240, left = 34, right = 10;
      const tot = x => cats.reduce((a, [k]) => a + (x[k] || 0), 0);
      const max = Math.max(1, ...tl.map(tot));
      const y = v => base - (base - top) * Math.sqrt(v / max);
      const step = (W - left - right) / tl.length;
      const out = [`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Security events per hour">`];
      for (const g of [max, Math.round(max / 4)].filter((v, i, a) => v > 0 && a.indexOf(v) === i)) out.push(`<line class="axis" x1="${left}" x2="${W - right}" y1="${y(g)}" y2="${y(g)}" stroke-dasharray="3 4"/><text x="${left - 6}" y="${y(g) + 4}" text-anchor="end" font-size="11">${g}</text>`);
      out.push(`<line class="axis" x1="${left}" x2="${W - right}" y1="${base}" y2="${base}"/>`);
      tl.forEach((x, i) => {
        const cx = left + step * (i + .5), present = cats.filter(([k]) => x[k] > 0);
        const sp = Math.min(5, step / (present.length + 1));
        present.forEach(([k, , a], j) => {
          const xx = cx + (j - (present.length - 1) / 2) * sp, yy = y(x[k]), c = this.areaColor(a);
          out.push(`<path d="M${xx} ${base} C ${xx} ${base - 20}, ${xx} ${yy + 20}, ${xx} ${yy}" stroke="${c}" stroke-width="2" fill="none" opacity=".85"/><circle cx="${xx}" cy="${yy}" r="${2.5 + 3 * Math.sqrt(x[k] / max)}" fill="${c}"><title>${this.esc(new Date(x.t).toLocaleString([], { weekday: 'short', hour: 'numeric' }))}: ${x[k]} ${k}</title></circle>`);
        });
        const d = new Date(x.t);
        if (d.getHours() % 6 === 0) out.push(`<text x="${cx}" y="${base + 18}" text-anchor="middle" font-size="11">${d.getHours() === 0 ? this.esc(d.toLocaleDateString([], { weekday: 'short' })) : this.esc(d.toLocaleTimeString([], { hour: 'numeric' }))}</text>`);
      });
      out.push('</svg>');
      return out.join('');
    },
    changesSub() {
      const ch = this.r && this.r.changes;
      if (!ch || !ch.since) return 'Comparisons start once Argus has a day of hourly snapshots.';
      return `Compared with <b>${this.esc(new Date(ch.since).toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' }))}</b>: <b>${ch.new.length}</b> new, <b>${ch.changed.length}</b> changed, <b>${ch.resolved.length}</b> resolved.`;
    },
    talkers() {
      const h = this.r && this.r.hostsec;
      if (!h) return [];
      const sig = new Map(((h.net && h.net.programs) || []).map(p => [p.path, p]));
      const ls = (h.littlesnitch && h.littlesnitch.available && h.littlesnitch.programs) || [];
      const src = ls.length ? ls.map(p => ({ path: p.path, bytes: (p.bytes_in || 0) + (p.bytes_out || 0), conns: p.connects || 0, remotes: p.remotes, hosts: p.hosts || [] }))
        : ((h.net && h.net.programs) || []).map(p => ({ path: p.path, bytes: 0, conns: p.remotes, remotes: p.remotes, hosts: p.sample || [] }));
      const flagged = new Set(((h.dnsAttribution && h.dnsAttribution.rows) || []).flatMap(r => r.programs.map(p => p.path)));
      return src.map(p => {
        const s = sig.get(p.path) || {};
        const cls = s.platform || /^\/(System|usr\/(s?bin|libexec))\//.test(p.path) ? 'Apple' : s.team ? 'Developer ID' : s.known ? 'Unsigned / ad-hoc' : 'Signer unknown';
        return { ...p, name: (p.path.match(/([^/]+)\.app\//) || [])[1] || p.path.split('/').pop(), cls, flagged: flagged.has(p.path) || (s.flagged > 0) };
      });
    },
    talkersSub() {
      const t = this.talkers(), by = c => t.filter(x => x.cls === c).length;
      const odd = by('Unsigned / ad-hoc'), fl = t.filter(x => x.flagged).length;
      return `<b>${t.length}</b> programs reached the network in the last day, grouped by who signed them. Higher means more data${t.some(x => x.bytes) ? '' : ' (connections, until Little Snitch data arrives)'}. ${odd ? `<b style="color:${this.sevColor('medium')}">${odd}</b> ${odd === 1 ? 'is' : 'are'} unsigned or ad-hoc signed.` : 'None are unsigned.'} ${fl ? `<b style="color:${this.sevColor('high')}">${fl}</b> touched a flagged destination (ringed).` : ''}`;
    },
    talkersSvg() {
      const t = this.talkers(); if (!t.length) return '';
      const cols = ['Apple', 'Developer ID', 'Unsigned / ad-hoc', 'Signer unknown'].filter(c => t.some(x => x.cls === c));
      const colColor = { 'Apple': 'var(--muted)', 'Developer ID': this.areaColor('Permissions'), 'Unsigned / ad-hoc': this.areaColor('Network'), 'Signer unknown': this.areaColor('Posture') };
      const W = 1100, H = 420, top = 34, bot = 380, left = 46, cw = (W - left) / cols.length;
      const val = x => Math.log10(1 + (x.bytes || x.conns || 0));
      const max = Math.max(1, ...t.map(val));
      const y = v => bot - (bot - top) * (v / max);
      const out = [`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Programs talking to the network">`];
      cols.forEach((c, i) => {
        const x0 = left + cw * i, items = t.filter(x => x.cls === c).sort((a, b) => val(b) - val(a));
        out.push(`<line class="axis" x1="${x0}" x2="${x0}" y1="${top - 10}" y2="${bot}" stroke-dasharray="2 4"/>`);
        out.push(`<text x="${x0 + cw / 2}" y="${top - 16}" text-anchor="middle" style="font:600 14px Fraunces,Georgia,serif;font-variant:small-caps;letter-spacing:.04em;fill:${colColor[c]}">${this.esc(c)} · ${items.length}</text>`);
        const placed = [], labels = [];
        items.forEach(p => {
          const yy = y(val(p)); let xx = x0 + cw / 2, k = 0;
          const r = 4 + Math.min(6, Math.sqrt(p.remotes || 1));
          while (placed.some(q => Math.hypot(q.x - xx, q.y - yy) < q.r + r + 3) && k < 60) { k++; xx = x0 + cw / 2 + (k % 2 ? 1 : -1) * Math.ceil(k / 2) * 11; }
          placed.push({ x: xx, y: yy, r, p });
        });
        const hitsDot = b => placed.some(q => q.x + q.r > b[0] && q.x - q.r < b[2] && q.y + q.r > b[1] && q.y - q.r < b[3]);
        placed.forEach(({ x: xx, y: yy, r, p }, j) => {
          out.push(`<circle cx="${xx}" cy="${yy}" r="${r}" fill="${colColor[c]}" opacity="${p.flagged ? 1 : .72}" ${p.flagged ? `stroke="${this.sevColor('high')}" stroke-width="3"` : ''}><title>${this.esc(p.path)}\n${p.bytes ? this.esc(this.bytes(p.bytes)) + ' · ' : ''}${p.remotes || 0} remote addresses${p.hosts.length ? '\n' + this.esc(p.hosts.slice(0, 4).join(', ')) : ''}</title></circle>`);
          if (j < 6 || p.flagged) {
            const label = p.name.length > 24 ? p.name.slice(0, 23) + '…' : p.name, lw = label.length * 6.2 + 4;
            const tries = [[xx + r + 4, 'start'], [xx - r - 4, 'end']];
            for (const [lx, anchor] of tries) {
              const x1 = anchor === 'start' ? lx : lx - lw, box = [x1, yy - 8, x1 + lw, yy + 6];
              if (x1 < x0 + 2 || x1 + lw > x0 + cw - 2) continue;
              if (labels.some(b => !(box[2] < b[0] || box[0] > b[2] || box[3] < b[1] || box[1] > b[3])) || hitsDot(box)) continue;
              labels.push(box);
              out.push(`<text class="lbl" x="${lx}" y="${yy + 4}" text-anchor="${anchor}"${p.flagged ? ` style="fill:${this.sevColor('high')};font-weight:700"` : ''}>${this.esc(label)}</text>`);
              break;
            }
          }
        });
      });
      const ticks = [1e3, 1e6, 1e9].filter(b => Math.log10(1 + b) <= max);
      if (t.some(x => x.bytes)) ticks.forEach(b => out.push(`<text x="${left - 6}" y="${y(Math.log10(1 + b)) + 4}" text-anchor="end" font-size="11">${b >= 1e9 ? '1 GB' : b >= 1e6 ? '1 MB' : '1 KB'}</text><line class="axis" x1="${left}" x2="${W}" y1="${y(Math.log10(1 + b))}" y2="${y(Math.log10(1 + b))}" stroke-dasharray="1 5"/>`));
      out.push('</svg>');
      return out.join('');
    },
    postureSub() {
      const p = (this.r && this.r.posture) || [];
      const f = p.filter(x => x.status === 'fail').length, w = p.filter(x => x.status === 'warn').length, ok = p.filter(x => x.status === 'pass').length;
      if (!p.length) return 'Security settings, checked every hour.';
      return `<b>${ok}</b> of ${p.length} checks pass. ${f ? `<b style="color:${this.sevColor('high')}">${f}</b> fail` : 'None fail'}${w ? ` and <b style="color:${this.sevColor('medium')}">${w}</b> need${w === 1 ? 's' : ''} attention` : ''}; the rest are for information.`;
    },
    async ackFinding(f, undo) {
      this.ackBusy = true;
      try {
        const res = await fetch('/api/findings/' + (undo ? 'unack' : 'ack'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: f.id, note: this.ackNote }) });
        if (!res.ok) throw new Error((await res.json()).error || ('HTTP ' + res.status));
        this.ackNote = ''; this.openFinding = null; await this.load(true);
      } catch (e) { this.error = 'Could not update the finding: ' + e.message; }
      this.ackBusy = false;
    },
    ackedCount() { return this.r ? this.r.findings.filter(f => f.acked).length : 0; },
    filteredFindings() {
      if (!this.r) return [];
      const q = this.fQ.toLowerCase();
      return this.r.findings.filter(f => (this.showAcked || !f.acked) && this.fSev.includes(f.sev) && (!this.fArea || f.area === this.fArea) &&
        (!q || (f.title + ' ' + f.detail + ' ' + f.evidence.join(' ')).toLowerCase().includes(q)));
    },
    remoteAccess() {
      const a = this.r.macos.access;
      return [...a.sshEvents.map(e => ({ ...e, svc: 'SSH' })), ...a.screen.map(e => ({ ...e, svc: 'Screen Sharing' }))].sort((x, y) => new Date(y.ts) - new Date(x.ts)).slice(0, 300);
    },
    containerRows() {
      const c = this.r.macos.containers, rows = new Map();
      for (const x of c.list.rows) rows.set(x.ID, { name: x.ID, state: x.STATE || '', lines: '', errors: '', sample: '' });
      for (const l of c.logs) { const x = rows.get(l.name) || { name: l.name, state: '' }; Object.assign(x, { lines: l.lines, errors: l.errors, sample: l.samples[l.samples.length - 1] || '' }); rows.set(l.name, x); }
      return [...rows.values()];
    },
    collectorFresh() { const t = this.r.inputs.collector.lastFileAt || ((this.r.inputs.collector.meta.system_last_run || 0) * 1000); return t && Date.now() - t < 20 * 60e3; },
    syslogHint(p) { return (location.hostname === 'localhost' || location.hostname === '127.0.0.1' ? '<this Mac’s IP>' : location.hostname) + (p === 'udp' ? ':5514' : ':5515'); },
    tpTotal(k) { return this.r ? this.r.throughput.sources.reduce((a, s) => a + s[k], 0) : 0; },
    tpRate() { return this.r ? this.r.throughput.sources.reduce((a, s) => a + s.bps, 0) : 0; },
    tpLabel(s) { return ({ macos: 'macOS unified log (security slice)', 'to-crowdsec': '→ written for CrowdSec', snapshots: 'Host snapshots', syslog: 'Network syslog', pihole: 'Pi-hole queries' })[s] || s; },
    csv(name, rows) {
      const blob = new Blob([Papa.unparse(rows)], { type: 'text/csv' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name + '.csv'; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    },
    // ---- formatting
    num(n) { return (n === null || n === undefined || n === '') ? '—' : Number(n).toLocaleString(); },
    bytes(n) { if (!n) return '0 B'; const u = ['B', 'KB', 'MB', 'GB', 'TB']; let i = 0; while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; } return n.toFixed(n >= 100 || i === 0 ? 0 : 1) + ' ' + u[i]; },
    rate(bps) { return this.bytes(bps) + '/s'; },
    fmt(d) { if (!d) return '—'; const x = new Date(d); return isNaN(x) ? '—' : x.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); },
    dur(ms) { const m = Math.round(ms / 60000); return m < 60 ? m + ' min' : m < 2880 ? (m / 60).toFixed(1) + ' h' : (m / 1440).toFixed(1) + ' d'; },
    ago(d) { if (!d) return 'never'; const t = typeof d === 'number' ? d : Date.parse(d); if (!t) return 'never'; const s = (Date.now() - t) / 1000; if (s < 60) return 'just now'; if (s < 3600) return Math.round(s / 60) + ' min ago'; if (s < 86400) return Math.round(s / 3600) + ' h ago'; return Math.round(s / 86400) + ' d ago'; },
    sevBadge(s) { return ({ high: 'bg-red-lt', medium: 'bg-orange-lt', low: 'bg-yellow-lt', info: 'bg-azure-lt' })[s] || 'bg-secondary-lt'; },
    sevText(s) { return ({ high: 'text-red', medium: 'text-orange', low: 'text-yellow', info: 'text-azure' })[s] || ''; },
    riskBadge(r) { return ({ malicious: 'bg-red-lt', suspicious: 'bg-orange-lt', clean: 'bg-green-lt', error: 'bg-pink-lt', info: 'bg-azure-lt' })[r] || 'bg-secondary-lt'; },
    statusIcon(s) { return ({ pass: 'ti-circle-check text-green', fail: 'ti-circle-x text-red', warn: 'ti-alert-triangle text-orange', info: 'ti-info-circle text-azure' })[s] || 'ti-help-circle text-secondary'; },
    // ---- charts
    // Resolve a Tabler CSS variable to a concrete rgb() string (canvas cannot use var()).
    color(name, prop = 'color') {
      const el = document.createElement('span');
      el.style[prop] = 'var(--tblr-' + name + ')';
      document.body.appendChild(el);
      const c = getComputedStyle(el)[prop];
      el.remove();
      return c;
    },
    draw(id, config) {
      const el = document.getElementById(id);
      if (CH[id]) { CH[id].destroy(); delete CH[id]; }
      if (!el || !el.offsetParent) return;
      CH[id] = new Chart(el, config);
    },
    charts() {
      if (!this.r || !window.Chart) return;
      Chart.defaults.color = this.color('secondary-color');
      Chart.defaults.borderColor = this.color('border-color', 'borderTopColor') || this.color('border-color');
      Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
      const col = n => this.color(n);
      const timeLabel = t => new Date(t).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit' });
      const stackOpts = { responsive: true, maintainAspectRatio: false, animation: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10 } } },
        scales: { x: { stacked: true, ticks: { maxTicksLimit: 12, autoSkip: true } }, y: { stacked: true, beginAtZero: true } } };
      if (this.tab === 'overview') {
        const tl = this.r.timeline;
        const cats = [['auth', 'Auth & access', 'azure'], ['gatekeeper', 'Gatekeeper / XProtect', 'red'], ['tcc', 'Privacy (TCC)', 'purple'], ['firewall', 'Firewall', 'orange'], ['background', 'Login items', 'teal']];
        this.draw('ch-timeline', { type: 'bar', data: { labels: tl.map(x => timeLabel(x.t)), datasets: cats.map(([k, l, c]) => ({ label: l, data: tl.map(x => x[k]), backgroundColor: col(c), borderWidth: 0 })) }, options: stackOpts });
      }
      if (this.tab === 'throughput') {
        const tp = this.r.throughput, srcs = tp.sources.map(s => s.source).filter(s => s !== 'to-crowdsec');
        const firstIdx = tp.series.findIndex(x => srcs.some(s => x[s + ':e']));
        const series = firstIdx > 0 ? tp.series.slice(Math.max(0, firstIdx - 3)) : tp.series;
        const palette = ['azure', 'purple', 'teal', 'orange', 'green', 'pink'];
        this.draw('ch-tp', { type: 'bar', data: { labels: series.map(x => new Date(x.t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })),
          datasets: srcs.map((s, i) => ({ label: this.tpLabel(s) + ' (events / ' + tp.bucketMin + ' min)', data: series.map(x => x[s + ':e'] || 0), backgroundColor: col(palette[i % palette.length]), borderWidth: 0 })) }, options: stackOpts });
      }
      if (this.tab === 'dns' && this.r.dns) {
        const h = this.r.dns.byHour;
        this.draw('ch-dns', { type: 'bar', data: { labels: h.map(x => timeLabel(x.t)), datasets: [{ label: 'Queries', data: h.map(x => x.n), backgroundColor: col('azure'), borderWidth: 0 }] },
          options: { ...stackOpts, plugins: { legend: { display: false } } } });
      }
      if (this.tab === 'macos' && this.macTab === 'system') {
        const d = this.r.macos.system.power.days;
        this.draw('ch-power', { type: 'bar', data: { labels: d.map(x => x.day.slice(5)), datasets: [
          { label: 'Sleep', data: d.map(x => x.sleep), backgroundColor: col('secondary') }, { label: 'Wake', data: d.map(x => x.wake), backgroundColor: col('azure') }, { label: 'Dark wake', data: d.map(x => x.darkwake), backgroundColor: col('purple') }] },
          options: { responsive: true, maintainAspectRatio: false, animation: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10 } } }, scales: { y: { beginAtZero: true } } } });
      }
    },
  };
}
</script>
