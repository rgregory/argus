@version: current
#
# Argus syslog receiver.
# Container ports are fixed (UDP 5514, TCP 5515); argus.sh maps host ports to them.
#
# Two copies of every message:
#   remote/<host>-YYYYMMDD.log   BSD-syslog lines that CrowdSec tails
#   remote-YYYYMMDD.tsv          tab-separated fields the Argus service tails
#
options {
  chain_hostnames(no);
  keep_hostname(yes);
  use_dns(no);
  use_fqdn(no);
  dns_cache(no);
  create_dirs(yes);
  dir_perm(0750);
  perm(0640);
  log_msg_size(65536);
  time_reap(300);
  flush_lines(50);
  stats(freq(0));
};

source s_net {
  network(transport("udp") port(5514) so_rcvbuf(4194304));
  network(transport("tcp") port(5515) max_connections(64) log_iw_size(6400));
};

# Keep hostnames and program names file-system safe.
rewrite r_sanitize {
  subst("[^A-Za-z0-9._-]", "_", value("HOST"), flags(global));
};

destination d_crowdsec {
  file("/var/lib/argus/logs/remote/${HOST}-${R_YEAR}${R_MONTH}${R_DAY}.log"
       template("${DATE} ${HOST} ${MSGHDR}${MESSAGE}\n"));
};

destination d_argus {
  file("/var/lib/argus/logs/remote-${R_YEAR}${R_MONTH}${R_DAY}.tsv"
       template("${R_UNIXTIME}\t${ISODATE}\t${HOST}\t${SOURCEIP}\t${PROGRAM}\t${PID}\t${LEVEL}\t${FACILITY}\t${MESSAGE}\n"));
};

log {
  source(s_net);
  rewrite(r_sanitize);
  destination(d_crowdsec);
  destination(d_argus);
};
