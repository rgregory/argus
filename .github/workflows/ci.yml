name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Shell syntax
        run: for f in argus.sh collector/*.sh image/entrypoint.sh .github/smoke-test.sh; do bash -n "$f"; done

      - name: ShellCheck (errors only)
        run: shellcheck -S error argus.sh collector/*.sh image/entrypoint.sh .github/smoke-test.sh

      - name: Install app dependencies
        working-directory: app
        run: npm ci --omit=dev --no-audit --no-fund

      - name: JavaScript syntax
        run: for f in app/server.js app/lib/*.js; do node --check "$f"; done

      - name: Dashboard access-control smoke test
        run: bash .github/smoke-test.sh
